model.", "Discussed office hours as an interactive enablement mechanism.", "Advanced a custom survey approach focused on outcomes beyond usage activity.", "Initiated the requested compliance review for an AI safety attestation using relevant internal evidence."], "takeaways": ["Usage is not outcome.", "Training, support, measurement, and compliance belong in one operating loop.", "A completed process still needs evidence that the result is correct."], "source": "journal/2026/07/14/2026-07-14.md"}, {"id": "2026-07-10-version-the-interface", "date": "2026-07-10", "title": "Version the Interface", "theme": "Teach rollback before customization", "summary": "A customized SharePoint form is still software. It has versions, dependencies, state, and a recovery path. Today I walked another builder through those mechanics and realized how much safer low-code development becomes when version history is treated as a primary feature rather than an emergency button.", "prompt": "What are you working on?", "types": ["learning", "win"], "projects": ["powerapps", "sharepoint", "versioncontrol", "enablement"], "words": 513, "minutes": 2, "intro": "A customized SharePoint form is still software. It has versions, dependencies, state, and a recovery path. Today I walked another builder through those mechanics and realized how much safer low-code development becomes when version history is treated as a primary feature rather than an emergency button.", "sections": {"theme": "I led a transcribed one-to-one walkthrough of SharePoint list form customization. We reviewed the default form setting, how enabling a custom form changes that configuration, how to open the editor, and where committed versions can be inspected and restored.\n\nThe concrete example already had multiple saved versions. That made the lesson practical. Editing does not need to be fearless, but it should be recoverable. Before showing how to add controls, I showed where the system records change and how to return to an earlier state.\n\nThis was a compact enablement session, but it aligned with the larger platform work from the week. More builders can safely participate when the development path includes history, rollback, and explicit boundaries.", "fieldNotes": "The SharePoint list starts with its default form. Creating a customized form changes the list configuration and exposes direct links for editing and version details. The version page is the critical operational surface because it provides a record of committed changes and the ability to restore.\n\nThe supported transcript establishes the walkthrough and the mechanics discussed. It does not establish that the trainee later shipped a form, so I am limiting the outcome to demonstrated and documented enablement.\n\nElsewhere, automated notifications showed both a restored access issue and data loads with continuing row-count mismatches. I was copied on those records, but they are not evidence of work I completed. They reinforce the distinction between system state and personal accomplishment.\n\nThe week also ended with protected time for enablement, logging, and reflection on the calendar. Calendar blocks alone are not evidence of completed work. The directly supported result is the recorded training session and the concrete version-control pattern it transferred.", "moved": "- Demonstrated how SharePoint list forms move from the default experience to a customized Power Apps form.\n\n- Documented where builders can enter the form editor and inspect committed versions.\n\n- Demonstrated rollback through the form's version history.\n\n- Transferred a recoverable customization pattern to another builder through a recorded working session.\n\n- Reinforced versioning as a prerequisite for safe low-code enablement.", "pattern": "Every low-code asset should have a release baseline, named owner, version notes, validation checklist, and rollback procedure. Before a change is promoted, capture the current version and define how success will be tested.\n\nThe automation opportunity is to export the solution, record its version and configuration, run static checks, and create a restore point before edits begin. This gives low-code work the same basic safety properties expected in traditional development.", "takeaways": "- Low-code does not mean low-discipline.\n\n- Rollback should be taught before experimentation.\n\n- Version history is useful only when builders know where it is and what each version represents.", "thread": "The next step is to turn the walkthrough into a short, repeatable builder standard with pre-change backup and post-change validation built into the workflow."}, "moved": ["Demonstrated how SharePoint list forms move from the default experience to a customized Power Apps form.", "Documented where builders can enter the form editor and inspect committed versions.", "Demonstrated rollback through the form's version history.", "Transferred a recoverable customization pattern to another builder through a recorded working session.", "Reinforced versioning as a prerequisite for safe low-code enablement."], "takeaways": ["Low-code does not mean low-discipline.", "Rollback should be taught before experimentation.", "Version history is useful only when builders know where it is and what each version represents."], "source": "journal/2026/07/10/2026-07-10.md"}, {"id": "2026-07-09-governance-needs-a-support-model", "date": "2026-07-09", "title": "Governance Needs a Support Model", "theme": "Do not launch demand without a recovery path", "summary": "The platform could enable more builders, but neither side of the organization had resources committed to support citizen-developed AI projects. That is not a minor operating detail. It is a boundary on what can responsibly scale.", "prompt": "Who did you help, or who helped you?", "types": ["win"], "projects": ["platformgovernance", "powerplatform", "governance", "finops", "citizendevelopment"], "words": 521, "minutes": 2, "intro": "The platform could enable more builders, but neither side of the organization had resources committed to support citizen-developed AI projects. That is not a minor operating detail. It is a boundary on what can responsibly scale.\n\nToday separated enthusiasm for low-code AI from the support obligations that follow it.", "sections": {"theme": "I participated in a transcribed Power Platform baseline review. The discussion covered Microsoft feature changes, Copilot credit usage, departmental environment naming, an application lifecycle management workshop, and the lack of support capacity for citizen AI development.\n\nA concrete action was to bring the support gap to governance. That is the right venue because the issue cannot be solved through better prompts or another environment. If teams are encouraged to build critical workflows, someone must own incidents, platform changes, access problems, cost controls, and retirement.\n\nThe group also agreed to monitor production credit consumption before advising teams to purchase capacity. That preserved evidence over speculation. Departmental affiliation also mattered because the environment name and credit scope depended on it.", "fieldNotes": "The meeting planned an application lifecycle management workshop once key people were available. The need was clear: developers require a shared path for source control, environment promotion, configuration, and support. The workshop was scheduled as future work, not completed work.\n\nA separate enterprise-browser demonstration explored moving some users away from virtual desktops or toward a hybrid model. The transcribed session covered test-user deployment, application analysis, and certificate-based trust for a clinical application. I attended the demonstration, but I did not own or complete those actions. The value of the session was architectural context about endpoint control and application compatibility.\n\nI also joined a short working session related to extracting Google Search Console data with a service account. The invite states that setup was the purpose, and attendance is supported, but no transcript confirms completion. I am recording it as an explored integration path rather than a configured service.\n\nAutomated pipeline notices continued to show row-count mismatches and a failed terminology load. They remain supporting evidence only. Their relevance is the support question: someone must interpret warning states, route ownership, and decide when an apparently completed service is not healthy.", "moved": "- Contributed to a transcribed baseline review of Power Platform governance and support constraints.\n\n- Advanced governance escalation for the lack of citizen-development support capacity.\n\n- Advanced production usage monitoring before Copilot credit purchase recommendations.\n\n- Clarified that departmental affiliation should drive environment naming and cost scope.\n\n- Planned a future application lifecycle management workshop.\n\n- Explored enterprise-browser and service-account integration patterns without overstating implementation.", "pattern": "Every citizen-development program needs a published responsibility matrix covering builder support, platform operations, security review, data ownership, incident response, cost management, and retirement. Projects without an accountable product owner should remain prototypes.\n\nThe future-state platform should automate environment assignment, license checks, usage telemetry, policy validation, and release evidence while routing exceptions to named support owners.", "takeaways": "- Enablement without support creates hidden operational debt.\n\n- Cost guidance should follow measured usage.\n\n- An environment boundary should reflect ownership and funding.", "thread": "The unresolved decision is who will support successful citizen-developed AI solutions after they move beyond a bounded pilot."}, "moved": ["Contributed to a transcribed baseline review of Power Platform governance and support constraints.", "Advanced governance escalation for the lack of citizen-development support capacity.", "Advanced production usage monitoring before Copilot credit purchase recommendations.", "Clarified that departmental affiliation should drive environment naming and cost scope.", "Planned a future application lifecycle management workshop.", "Explored enterprise-browser and service-account integration patterns without overstating implementation."], "takeaways": ["Enablement without support creates hidden operational debt.", "Cost guidance should follow measured usage.", "An environment boundary should reflect ownership and funding."], "source": "journal/2026/07/09/2026-07-09.md"}, {"id": "2026-07-08-fix-the-state-not-the-screen", "date": "2026-07-08", "title": "Fix the State, Not the Screen", "theme": "Use training as production discovery", "summary": "A Power App showed one department in view mode and the correct department only after the user entered edit mode and refreshed. The visible defect was a screen problem. The likely engineering problem was state.", "prompt": "What's the next smallest step?", "types": ["learning"], "projects": ["powerapps", "statemanagement", "testing", "copilotstudio"], "words": 530, "minutes": 2, "intro": "A Power App showed one department in view mode and the correct department only after the user entered edit mode and refreshed. The visible defect was a screen problem. The likely engineering problem was state.\n\nToday was a reminder that training exposes failure modes that unit testing rarely finds. Users follow real sequences, carry old values between records, and reveal where the application depends on an accidental refresh.", "sections": {"theme": "I attended and contributed to a transcribed training session for a provider-attribution Power App. The application served as a central data source for recurring panel and capacity reporting, which made data maintenance accuracy important.\n\nThe session documented how users access the application, maintain provider information, and download reports. It also surfaced a concrete defect assigned to me: investigate why the view tab displayed the wrong department until the edit tab was opened and refreshed.\n\nThat issue reframed the training from documentation delivery into a live validation event. The problem was not merely confusing. A stale department value could undermine trust in the application and the reporting fed by it.", "fieldNotes": "The defect suggests that view state and edit state were not initialized from the same source at the same time. The available evidence establishes the symptom and my assigned investigation, but not the eventual root cause or resolution. I am keeping the outcome at investigated, not fixed.\n\nThe meeting also identified missing required fields in exported data and the need to notify responsible contacts. Another calculation question concerning panel capacity was moved to an offline discussion. These were good examples of separating application defects from unresolved business rules.\n\nIn parallel, I shared the latest contract-focused agent with a controlled tester. I noted that an earlier version had become too restrictive and blocked follow-up questions. The latest release was intended to correct that behavior. A stakeholder had already tested a long contract and saw value quickly, but usage telemetry remained an open question.\n\nA governance conversation examined Copilot credit consumption during development and whether separate groups require separate environments. The working direction favored stronger separation because it was safer for budget attribution, even though it increased administrative work.", "moved": "- Participated in a transcribed end-user training and demonstration for a Power App supporting recurring reporting.\n\n- Accepted investigation of a view and edit state mismatch discovered during the session.\n\n- Distinguished missing data, application behavior, and unresolved calculation logic as separate work types.\n\n- Shared an updated contract-focused agent intended to restore useful follow-up questions.\n\n- Advanced discussion of environment separation for safer Copilot credit attribution.", "pattern": "Treat training sessions as instrumented acceptance tests. Record the user sequence, selected record, expected state, actual state, refresh behavior, and downstream impact. Convert every reproducible issue into a regression test.\n\nFor Power Apps, centralize record selection and state initialization rather than allowing each screen to carry its own stale copy. Pair client validation with downstream checks when the application feeds reporting.", "takeaways": "- A screen defect can be a state-management defect.\n\n- Training produces high-value test cases because users follow real workflows.\n\n- Security and cost isolation can justify additional environment overhead.", "thread": "The department mismatch still needs a verified root cause and regression test before it can be called resolved."}, "moved": ["Participated in a transcribed end-user training and demonstration for a Power App supporting recurring reporting.", "Accepted investigation of a view and edit state mismatch discovered during the session.", "Distinguished missing data, application behavior, and unresolved calculation logic as separate work types.", "Shared an updated contract-focused agent intended to restore useful follow-up questions.", "Advanced discussion of environment separation for safer Copilot credit attribution."], "takeaways": ["A screen defect can be a state-management defect.", "Training produces high-value test cases because users follow real workflows.", "Security and cost isolation can justify additional environment overhead."], "source": "journal/2026/07/08/2026-07-08.md"}, {"id": "2026-07-07-metadata-is-product-infrastructure", "date": "2026-07-07", "title": "Metadata Is Product Infrastructure", "theme": "Retrieval quality starts before the prompt", "summary": "A generative search experience can look intelligent while depending almost entirely on descriptions written months earlier. Today made that dependency visible.", "prompt": "What would future-you want to know?", "types": ["learning"], "projects": ["metadata", "generativeai", "powerbi", "datagovernance"], "words": 529, "minutes": 2, "intro": "A generative search experience can look intelligent while depending almost entirely on descriptions written months earlier. Today made that dependency visible.\n\nI attended a transcribed demonstration of a reporting assistant that interprets plain-language questions, searches report metadata, and can generate query logic when it does not find a direct match. The capability was useful, but the lesson was not that generative AI replaces catalog work. It was that generative AI increases the value of good catalog work.", "sections": {"theme": "The reporting assistant searched names and descriptions to locate existing reports. Accurate descriptions increased the likelihood that a user would find an existing asset before another report was rebuilt. When a direct match was unavailable, the tool could provide query logic that still required validation.\n\nThe limitations mattered. The demonstration described constraints around source types, identifier-based searches, abbreviations, and the precision of the user's request. Those constraints turn metadata quality, naming conventions, and user education into part of the product architecture.\n\nI also participated in an M365 application governance review. The meeting addressed application approval follow-up, user-list coordination, Teams feature review, and automated digest support. These were operational decisions rather than build outcomes, but they reinforced the same need for clear ownership and discoverable records.", "fieldNotes": "The strongest implementation pattern was to treat the catalog as a governed retrieval layer. Report names and descriptions should communicate purpose, grain, owner, freshness, and intended audience. An assistant should not have to infer these from a visual title alone.\n\nI also joined a DevOps discussion and had already shared a restrictive branch setup with required reviewers, linked work, comment resolution, continuous integration, status checks, and controlled merge behavior. The session itself was not transcribed, so I am not claiming decisions beyond the supported attendance and the documented guidance shared around it.\n\nOperational alerts reported failed data jobs and successful loads with row-count mismatches. These notifications support a broader quality lesson, but they do not prove that I resolved the incidents. They show why assistants and catalogs need freshness and quality indicators. A discoverable report built on a failed or incomplete refresh is still the wrong answer.", "moved": "- Evaluated a metadata-driven generative reporting assistant through a transcribed demonstration.\n\n- Identified accurate descriptions and naming as prerequisites for reliable report discovery.\n\n- Documented limitations around source coverage, identifiers, abbreviations, and query precision.\n\n- Participated in governance follow-up for enterprise applications and Microsoft 365 features.\n\n- Advanced a restrictive Azure DevOps branch-control pattern through technical discussion.", "pattern": "Build retrieval products on a versioned metadata contract. Require purpose, owner, source, grain, refresh state, validation state, and access scope before an asset becomes discoverable to an assistant.\n\nThe future state is an automated catalog pipeline that extracts technical metadata, requests human completion of business context, validates freshness, and publishes only assets that meet a minimum quality threshold. The assistant should return the evidence it used, not only a confident recommendation.", "takeaways": "- Better prompts cannot repair missing metadata.\n\n- Generated query logic still requires validation.\n\n- Discoverability without freshness and quality context can accelerate the wrong decision.", "thread": "The metadata standard needs an enforceable minimum so new reports do not enter the catalog with descriptions too weak for people or agents to use."}, "moved": ["Evaluated a metadata-driven generative reporting assistant through a transcribed demonstration.", "Identified accurate descriptions and naming as prerequisites for reliable report discovery.", "Documented limitations around source coverage, identifiers, abbreviations, and query precision.", "Participated in governance follow-up for enterprise applications and Microsoft 365 features.", "Advanced a restrictive Azure DevOps branch-control pattern through technical discussion."], "takeaways": ["Better prompts cannot repair missing metadata.", "Generated query logic still requires validation.", "Discoverability without freshness and quality context can accelerate the wrong decision."], "source": "journal/2026/07/07/2026-07-07.md"}, {"id": "2026-07-06-make-review-lightweight-enough-to-use", "date": "2026-07-06", "title": "Make Review Lightweight Enough to Use", "theme": "Match review effort to actual risk", "summary": "A review process only helps when it is easier to use than to bypass. Today I tested that idea by turning a documented peer-review standard into a lightweight assistant and giving it a deliberately ordinary script.", "prompt": "What's worth remembering about today?", "types": ["idea"], "projects": ["aireview", "aiagents", "peerreview", "azuredevops", "sharepoint"], "words": 558, "minutes": 3, "intro": "> 💡 idea\n\nA review process only helps when it is easier to use than to bypass. Today I tested that idea by turning a documented peer-review standard into a lightweight assistant and giving it a deliberately ordinary script.\n\nThe script reset a Windows icon cache. It was not an AI system and it was not high risk. That was exactly why it made a useful test. A good intake tool should recognize the difference between a small operating-system utility and a complex model, then scale the review depth instead of applying the same ceremony to both.", "sections": {"theme": "I built and shared a rough peer-review assistant grounded in a SharePoint document library. The assistant accepted a script, classified the modality and provisional risk, summarized the implementation, and returned a review outcome with follow-up items.\n\nThe first result showed the value of a risk-tiered approach. A simple batch script received a low-risk, skim-level review rather than an exaggerated assessment. The assistant still identified practical concerns, but it did not pretend every artifact needed a full AI governance process.\n\nThe conversation also clarified the intended future use. The same pattern could support a complete project workflow, not only one script. That makes the assistant more interesting, but it also raises the need for versioned criteria, auditability, and a way to distinguish advice from an approved peer review.", "fieldNotes": "The lightweight datastore was a SharePoint document library. It offered a low-friction way to maintain review criteria and reuse the same grounding pattern across business cases. The tradeoff was explicit: it was less configurable and less performant than object storage paired with a dedicated search service.\n\nI also shared a more restrictive Azure DevOps branch pattern. The recommendation separated developer contribution from direct changes to the protected branch, required multiple reviewers, reset approvals after new commits, linked work items, resolved comments, and expected build and security checks before merge.\n\nA separate recording workflow exposed another automation opportunity. Teams transcripts already contain timestamps, and AI can derive chapter titles and boundaries. Automatic chapters did not generate as expected, so I proposed a simpler path: export the transcript, generate chapter metadata, and add the chapters to the recording. Starting with navigation preserved most of the value without immediately taking on video clipping.", "moved": "- Implemented and demonstrated a lightweight peer-review assistant against a real maintenance script.\n\n- Validated risk-tiered review behavior for a low-risk, non-AI artifact.\n\n- Shared a reusable SharePoint-grounded knowledge pattern and its storage tradeoffs.\n\n- Documented a restrictive Azure DevOps branch policy pattern for protected code.\n\n- Explored transcript-to-chapter automation after automatic chapter generation did not work as expected.", "pattern": "Represent review as a deterministic pipeline: classify the artifact, select the review depth, retrieve versioned criteria, run checks, record evidence, and return a bounded outcome. The same pipeline can support scripts, applications, models, and agents while preserving different thresholds.\n\nThe next automation layer should emit a machine-readable review record that can be attached to a pull request. Human approval remains explicit, but the repetitive evidence collection becomes reusable.", "takeaways": "- Risk-based review is more credible than one-size-fits-all governance.\n\n- Lightweight storage can be the right starting point when its limits are stated.\n\n- Automate navigation before automating media production.", "thread": "The assistant still needs a clear boundary between generated guidance and an officially accepted peer-review decision."}, "moved": ["Implemented and demonstrated a lightweight peer-review assistant against a real maintenance script.", "Validated risk-tiered review behavior for a low-risk, non-AI artifact.", "Shared a reusable SharePoint-grounded knowledge pattern and its storage tradeoffs.", "Documented a restrictive Azure DevOps branch policy pattern for protected code.", "Explored transcript-to-chapter automation after automatic chapter generation did not work as expected."], "takeaways": ["Risk-based review is more credible than one-size-fits-all governance.", "Lightweight storage can be the right starting point when its limits are stated.", "Automate navigation before automating media production."], "source": "journal/2026/07/06/2026-07-06.md"}, {"id": "2026-07-02-access-is-a-chain", "date": "2026-07-02", "title": "Access Is a Chain", "theme": "Diagnose access from the user action backward", "summary": "A user could open the SharePoint list but could not create an item or populate its lookup fields. The first permission change fixed one symptom, then exposed the next dependency.", "prompt": "What blocked you today?", "types": ["win"], "projects": ["accesscontrol", "sharepoint", "powerapps", "identity", "governance"], "words": 673, "minutes": 3, "intro": "A user could open the SharePoint list but could not create an item or populate its lookup fields. The first permission change fixed one symptom, then exposed the next dependency.\n\nThat was the useful lesson. Access is rarely one switch. It is a chain across the primary application, supporting lists, security groups, and the operations that keep those relationships current.", "sections": {"theme": "I worked through an access problem in a SharePoint-based workflow. The user initially could not see the control needed to add records. I updated the list permissions to allow item creation and editing, then asked for direct validation.\n\nThe next test showed that the user could reach the form but the dropdowns had no values and free-text entry was not allowed. That narrowed the issue to supporting lookup data rather than the main list alone.\n\nI traced the missing behavior to a security group that automatically grants access to the supported lookup lists. I requested confirmation that the user had been included in that group, and the responsible team initiated the access request.\n\nNothing about this was technically exotic. The value came from following the user journey instead of declaring success after the first permission change.", "fieldNotes": "The initial adjustment changed the user's ability to create and update items in the primary SharePoint list. That was implemented, but it did not complete the workflow.\n\nThe second failure was more informative. Empty dropdowns indicated that the form was retrieving choices from another controlled source. Because the fields did not permit arbitrary text, missing read access to those sources made the form unusable even though the main list itself was available.\n\nThe access model depended on a security group that provided permissions to the related lookup lists. I escalated that specific dependency instead of broadening permissions across the site. The available evidence shows that the access request was initiated. It does not confirm that the user later completed the entire workflow, so I am not marking end-to-end access as validated.\n\nA separate reporting validation thread recorded that two previously identified issues had been addressed and returned for additional testing. The evidence supports that updates were made available for validation, but not that every metric discrepancy was resolved. I am keeping that effort in the validated-in-progress category rather than calling it shipped.\n\nAutomated data-platform messages also reported successful jobs with row-count mismatches and a failed terminology batch. Those notifications are supporting context only. I did not treat receiving them as work completed. They reinforce the same principle: a top-level status can look healthy while a required dependency underneath it is not.", "moved": "- Implemented create and update permissions for a user in a SharePoint-based workflow.\n\n- Diagnosed empty lookup controls as a separate access dependency from the main list.\n\n- Narrowed the missing access to a security group that grants permissions to supporting lookup lists.\n\n- Initiated the appropriate group-access request through the responsible team.\n\n- Advanced a reporting update into additional user validation without overstating unresolved metric differences.", "pattern": "Model access as a dependency graph. Start with the intended user action, then enumerate the application, primary data store, lookup sources, groups, licenses, and downstream services required to complete it.\n\nA reusable preflight check should test each dependency with the same identity before the user receives a link. For a SharePoint and Power Apps workflow, that means validating page access, list permissions, lookup reads, create and update operations, and any group-driven inheritance separately.\n\nThe future state is a small diagnostic tool that accepts a user and workflow, evaluates the permission graph, and returns the first broken dependency with an accountable remediation path. That turns access troubleshooting from email archaeology into a repeatable control.", "takeaways": "- Opening the application is not the same as completing the workflow.\n\n- Lookup fields introduce data-source permissions that are easy to miss.\n\n- The narrowest correct permission is better than broad site access.", "thread": "The remaining evidence gap is end-to-end confirmation that the group update restored the lookup values and allowed the user to submit a record successfully."}, "moved": ["Implemented create and update permissions for a user in a SharePoint-based workflow.", "Diagnosed empty lookup controls as a separate access dependency from the main list.", "Narrowed the missing access to a security group that grants permissions to supporting lookup lists.", "Initiated the appropriate group-access request through the responsible team.", "Advanced a reporting update into additional user validation without overstating unresolved metric differences."], "takeaways": ["Opening the application is not the same as completing the workflow.", "Lookup fields introduce data-source permissions that are easy to miss.", "The narrowest correct permission is better than broad site access."], "source": "journal/2026/07/02/2026-07-02.md"}, {"id": "2026-06-25-observability-is-a-design-input", "date": "2026-06-25", "title": "Observability Is a Design Input", "theme": "Build the monitoring path beside the delivery path", "summary": "A pipeline that cannot explain its own state is not finished. Today I connected implementation work with the operating signals needed to support it.", "prompt": "What are you trying next?", "types": ["win"], "projects": ["observability", "azuremonitor", "kql", "datafactory", "synapse"], "words": 564, "minutes": 3, "intro": "A pipeline that cannot explain its own state is not finished. Today I connected implementation work with the operating signals needed to support it.\n\nI continued the SharePoint-to-Synapse pipeline build, reviewed centralized Azure monitoring, and worked through final access and policy gaps for a Copilot Studio environment. The day tied data movement, platform governance, and operations into one pattern: every automated path needs evidence about what ran, what changed, and what requires attention.", "sections": {"theme": "In a transcribed knowledge-transfer session, I worked through schema alignment between SharePoint, staging, and final Synapse tables. The remaining fields needed to be added with matching data types, including date and identifier fields, before the upsert keys could be finalized.\n\nThe staging table would be truncated before each reload. The final table would use invoice number and line number as the working upsert keys once those fields were available. I was also assigned to create knowledge documentation for the ETL setup.\n\nLater, a transcribed monitoring session demonstrated how Azure Log Analytics collects audit information from cloud resources and Data Factory pipeline activities. The team used KQL to query status and support alerts, and discussed a Power BI model over the monitoring data.", "fieldNotes": "The pipeline session reinforced that staging and final tables serve different purposes. Staging preserves the incoming shape and supports deterministic reloads. The final table enforces the schema and update behavior expected by consumers.\n\nThe monitoring session made failure routing part of the architecture. The team discussed who should receive alert emails, how report-developer assignments are maintained in a SharePoint list, and whether deployment automation could keep that ownership data current.\n\nThat ownership registry is as important as the alert itself. A precise failure signal still becomes noise when no accountable person can be resolved from it.\n\nA separate Power Platform baseline review found that a newly created executive environment had a security group but still lacked my required access. The documented next steps were to add permissions, distribute access through the group, and apply the correct Copilot policy assignment. The same session planned an educational pipeline demonstration and continued review of external-sharing controls.\n\nAutomated data-platform alerts reported failures and row-count mismatches during the day. I did not claim those notifications as resolved work. They served as evidence that completion status and data correctness must be monitored separately.", "moved": "- Advanced schema and data-type alignment for a SharePoint-to-Synapse ETL pipeline.\n\n- Defined truncate-and-reload staging behavior and working composite upsert keys.\n\n- Accepted creation of knowledge documentation for the pipeline setup.\n\n- Participated in a transcribed review of Azure Log Analytics, KQL, Data Factory logging, and alerting.\n\n- Advanced an ownership and distribution pattern for pipeline failure notifications.\n\n- Identified and routed remaining access and policy steps for a Copilot Studio environment.", "pattern": "Emit a structured event from every pipeline activity with run ID, stage, source, target, row counts, duration, status, and owner. Send those events to a centralized workspace and calculate alerts from explicit thresholds.\n\nMaintain ownership as deployable metadata. When a report or pipeline changes owners, the monitoring route should change in the same release rather than through a separate manual list update.", "takeaways": "- Monitoring begins during design, not after production failure.\n\n- Row counts and execution status answer different questions.\n\n- Alerts require an accurate ownership registry.", "thread": "The pipeline still needs completed schema mapping, validated upsert behavior, and a documented alert-routing process tied to deployment metadata."}, "moved": ["Advanced schema and data-type alignment for a SharePoint-to-Synapse ETL pipeline.", "Defined truncate-and-reload staging behavior and working composite upsert keys.", "Accepted creation of knowledge documentation for the pipeline setup.", "Participated in a transcribed review of Azure Log Analytics, KQL, Data Factory logging, and alerting.", "Advanced an ownership and distribution pattern for pipeline failure notifications.", "Identified and routed remaining access and policy steps for a Copilot Studio environment."], "takeaways": ["Monitoring begins during design, not after production failure.", "Row counts and execution status answer different questions.", "Alerts require an accurate ownership registry."], "source": "journal/2026/06/25/2026-06-25.md"}, {"id": "2026-06-24-environments-are-boundaries-not-labels", "date": "2026-06-24", "title": "Environments Are Boundaries, Not Labels", "theme": "Promote configuration and evidence with the artifact", "summary": "Creating dev, test, and production environments is easy to describe and surprisingly easy to do incompletely. Today the missing details were permissions, policy assignment, managed configuration, data sources, and deployment behavior.", "prompt": "What did you learn?", "types": ["learning", "win"], "projects": ["platformengineering", "powerplatform", "copilotstudio", "azuredevops", "supplychain"], "words": 533, "minutes": 2, "intro": "Creating dev, test, and production environments is easy to describe and surprisingly easy to do incompletely. Today the missing details were permissions, policy assignment, managed configuration, data sources, and deployment behavior.\n\nI moved several platform patterns forward at once: executive-agent environment provisioning, agent application lifecycle management, controlled Python package distribution, and a data-ingestion request for reporting. The common lesson was that a named environment is not a boundary until its dependencies move with it.", "sections": {"theme": "In a transcribed Power Platform governance session, I took responsibility for coordinating an executive Copilot Studio environment and addressing blockers. The session also assigned follow-up for an educational application lifecycle management review covering movement between development, test, and production.\n\nThe environment set was created with managed configuration and a security group, but access was not yet complete. Policy inclusion and exclusion still needed to be applied. This was provisioned infrastructure, not a finished delivery path.\n\nI also advised another agent team that deployment pipelines should account for separate knowledge sources and environment variables. Pointing every stage to the same data store may work technically, but it defeats isolation and makes testing less meaningful.", "fieldNotes": "The governance discussion established that requests to share Power Apps broadly must pass through committee review. It also exposed a support constraint: centrally supported development capacity was not guaranteed. That turns audience size and ownership into intake requirements rather than post-build questions.\n\nI documented an output-component pattern for the AI community. The design used fixed evaluation logic with multiple display modes. I wanted the pattern shared as a reusable building block instead of remaining embedded in one assistant.\n\nFor Python package management, I had established the structure of a controlled Azure Artifacts feed and reviewed it with another developer. My status update described the package feed, planned developer configuration, and Snyk-based CVE, OWASP, and SBOM scanning. The remaining package set still needed promotion and management, so the system was advanced rather than complete.\n\nI also submitted a higher-priority request to ingest SharePoint list data into Synapse for an executive reporting need. The team intended to recreate an existing report once the data became available. The evidence supports the request and architecture motion, not completion of the report.", "moved": "- Coordinated provisioning of managed development, test, and production environments for an executive agent path.\n\n- Identified missing access and policy assignments after initial environment creation.\n\n- Advanced an application lifecycle management review for agent promotion.\n\n- Documented separate knowledge sources and variables as environment concerns.\n\n- Advanced a controlled Azure Artifacts feed with security and software-bill-of-materials scanning.\n\n- Submitted the ingestion request required for a SharePoint-to-Synapse reporting path.", "pattern": "Package an agent release as code, solution, configuration, data-source bindings, policy state, access model, evaluation evidence, and rollback metadata. Promote the package through the same gates in every stage.\n\nAutomate environment preflight checks so a pipeline fails before deployment when permissions, variables, connectors, or policies are missing.", "takeaways": "- Environment names do not create isolation by themselves.\n\n- Agent lifecycle management includes data and policy, not only solution files.\n\n- Broad sharing creates support and governance obligations.", "thread": "The delivery path still needs a verified production promotion, complete access, and automated checks for policy and data-source drift."}, "moved": ["Coordinated provisioning of managed development, test, and production environments for an executive agent path.", "Identified missing access and policy assignments after initial environment creation.", "Advanced an application lifecycle management review for agent promotion.", "Documented separate knowledge sources and variables as environment concerns.", "Advanced a controlled Azure Artifacts feed with security and software-bill-of-materials scanning.", "Submitted the ingestion request required for a SharePoint-to-Synapse reporting path."], "takeaways": ["Environment names do not create isolation by themselves.", "Agent lifecycle management includes data and policy, not only solution files.", "Broad sharing creates support and governance obligations."], "source": "journal/2026/06/24/2026-06-24.md"}, {"id": "2026-06-23-test-the-behavior-not-the-pitch", "date": "2026-06-23", "title": "Test the Behavior, Not the Pitch", "theme": "Evaluation begins when another person drives", "summary": "A useful AI demo should make its constraints visible. Today I put a contract-focused assistant in front of a working group and used the session to test behavior, not just presentation.", "prompt": "What decision did you make, and why?", "types": ["learning"], "projects": ["aievaluation", "copilotstudio", "aiagents", "evaluation", "productdesign"], "words": 525, "minutes": 2, "intro": "A useful AI demo should make its constraints visible. Today I put a contract-focused assistant in front of a working group and used the session to test behavior, not just presentation.\n\nThe agent could accept a document, compare terms against a reference standard, flag deviations, and vary the output depth. The important result was not that it produced a polished answer. It was that real users exposed where readability, access, licensing, and follow-up behavior still needed work.", "sections": {"theme": "Before the session, I prepared a simple flow: review the instructions, let a tester use the test environment, and gather feedback. I had also implemented small, medium, and large output modes so the same evaluation logic could support triage, action, or deeper analysis without changing the underlying conclusions.\n\nThe transcribed working session demonstrated document upload, comparison against a reference, risk flagging, confidence information, and configurable output. The discussion identified strengths in risk identification and summarization while surfacing improvement areas around readability and licensing.\n\nA Teams installation attempt was blocked. That was useful evidence. Distribution is part of the product, and an agent that works only inside the authoring experience is not ready for broad use.", "fieldNotes": "The output-mode design separated presentation from evaluation. The small mode reduced columns for quick triage. The medium mode added severity and indicators for action. The large mode added alignment, impact, confidence, location, and evidence fields for deeper review.\n\nThe core rule was deliberately strict: changing the presentation must not change the evaluation result. That creates a testable contract across modes and reduces the risk that a concise view quietly hides a different conclusion.\n\nThe day also included a transcribed reporting architecture discussion. A dashboard currently read from SharePoint, and the team needed to decide between direct query and a fuller ETL path into Synapse. I was assigned to help determine that path. The meeting supported the need for broader access and additional reporting, but did not establish a final architecture decision.\n\nIn a separate remediation session, I compared security-model data across systems, identified a duplicate candidate, and recommended pausing removal until another validation pass before go-live. That choice reflected the same principle as the agent test: observation should precede irreversible change.", "moved": "- Demonstrated a contract-focused Copilot Studio agent in a transcribed working session.\n\n- Implemented and tested three presentation modes over a consistent evaluation model.\n\n- Gathered user feedback on risk findings, summaries, confidence, readability, and licensing.\n\n- Identified a Teams distribution blocker during real use.\n\n- Advanced the architecture decision between direct SharePoint reporting and a Synapse ETL path.\n\n- Compared security-model records and deferred deletion pending validation.", "pattern": "Define evaluation invariants before designing presentation variants. Store one structured result, then render it for different operating needs.\n\nRun every agent through a user-driven test that covers access, document ingestion, reference grounding, follow-up questions, failure behavior, and export. Record each finding as evidence, not anecdote.", "takeaways": "- A demo becomes an evaluation when another person controls the workflow.\n\n- Distribution and licensing are product requirements.\n\n- Concise output should not change the underlying judgment.", "thread": "The next test needs to verify Teams access and confirm that output modes remain logically equivalent across a larger contract set."}, "moved": ["Demonstrated a contract-focused Copilot Studio agent in a transcribed working session.", "Implemented and tested three presentation modes over a consistent evaluation model.", "Gathered user feedback on risk findings, summaries, confidence, readability, and licensing.", "Identified a Teams distribution blocker during real use.", "Advanced the architecture decision between direct SharePoint reporting and a Synapse ETL path.", "Compared security-model records and deferred deletion pending validation."], "takeaways": ["A demo becomes an evaluation when another person controls the workflow.", "Distribution and licensing are product requirements.", "Concise output should not change the underlying judgment."], "source": "journal/2026/06/23/2026-06-23.md"}, {"id": "2026-06-22-design-for-change-before-loading-data", "date": "2026-06-22", "title": "Design for Change Before Loading Data", "theme": "Idempotence starts with the data contract", "summary": "The load was not the hard part. The harder question was what should happen when the source changes after the first successful run.", "prompt": "What blocked you today?", "types": ["win"], "projects": ["dataengineering", "azuredatafactory", "synapse", "sharepoint", "cdc"], "words": 552, "minutes": 3, "intro": "The load was not the hard part. The harder question was what should happen when the source changes after the first successful run.\n\nI spent the day moving a SharePoint-to-Synapse pipeline from a one-time copy toward change-aware behavior. The work exposed the decisions that determine whether a pipeline remains reliable after launch: schema placement, naming, staging behavior, key selection, updates, deletions, and ownership of future changes.", "sections": {"theme": "In a transcribed working session, I corrected a schema that had been provisioned in the wrong location and recreated the required tables using established staging conventions. I then worked through pipeline configuration and publishing with a focus on repeatable loads.\n\nThe staging pattern was straightforward. Truncate before reload so repeated executions do not accumulate duplicates. The final-table pattern required more thought. The working key was a composite of invoice number and line number, but we left the final decision open pending additional analysis and confirmation of how the source is edited or deleted.\n\nThat distinction matters. An upsert is safe only when the key represents the business record consistently. A technically unique combination that changes over time can silently convert updates into inserts.", "fieldNotes": "The pipeline used a raw staging table followed by an upsert into the final table. The working guidance was to preserve source values in staging, align final data types with the SharePoint source, and use the composite key for matching once the required columns were present.\n\nA float-type issue on identifier-like fields reinforced the need to inspect how connectors infer types. Values that behave as identifiers should not inherit a numeric representation simply because they contain digits. The available evidence shows the issue was investigated and the rest of the fields appeared acceptable. It does not establish a final production fix.\n\nI also documented an unresolved policy dependency. The change-data-capture design depends on whether source records can be edited or deleted. That question was deferred to a future business review, so I did not encode deletion behavior as a settled requirement.\n\nOutside the pipeline, I shared a leadership status update covering completed connector enablement, an environment provisioning guide in progress, intake and approval work, and an upcoming legal-assistant test. I also contributed two reusable team patterns: a stricter Azure DevOps branch-control approach and a transcript-to-chapter workflow after automatic chapters did not generate as expected.", "moved": "- Corrected the target schema location and recreated staging-aligned structures.\n\n- Configured and published a repeatable staging and upsert pipeline pattern.\n\n- Implemented truncate-before-load behavior for the staging table.\n\n- Explored a composite business key for deduplication and updates.\n\n- Documented open dependencies around record edits, deletions, and final key selection.\n\n- Shared reusable branch-control and transcript-chapter automation patterns.", "pattern": "Separate ingestion into raw landing, typed staging, and curated final layers. Make each run restartable. Capture the source key, ingestion timestamp, source-modified timestamp, and operation type when available.\n\nBefore production, validate the key against duplicates, late updates, null values, and source corrections. Treat deletion handling as an explicit business rule, not an implementation guess.", "takeaways": "- A successful first load says little about the second run.\n\n- Schema placement and naming are operational controls.\n\n- Identifier fields should not be modeled by appearance alone.", "thread": "The pipeline still needs a confirmed business key and an approved rule for source edits and deletions."}, "moved": ["Corrected the target schema location and recreated staging-aligned structures.", "Configured and published a repeatable staging and upsert pipeline pattern.", "Implemented truncate-before-load behavior for the staging table.", "Explored a composite business key for deduplication and updates.", "Documented open dependencies around record edits, deletions, and final key selection.", "Shared reusable branch-control and transcript-chapter automation patterns."], "takeaways": ["A successful first load says little about the second run.", "Schema placement and naming are operational controls.", "Identifier fields should not be modeled by appearance alone."], "source": "journal/2026/06/22/2026-06-22.md"}, {"id": "2026-06-19-schema-first-pipeline-second", "date": "2026-06-19", "title": "Schema First, Pipeline Second", "theme": "Generated tables are not a substitute for design", "summary": "Copying an existing pipeline made the first step faster. It did not make the new source compatible.", "prompt": "Who did you help, or who helped you?", "types": ["win"], "projects": ["dataengineering", "azuredatafactory", "synapse", "sharepoint", "dataquality"], "words": 457, "minutes": 2, "intro": "Copying an existing pipeline made the first step faster. It did not make the new source compatible.", "sections": {"theme": "I worked through a transcribed SharePoint-to-Synapse pipeline session using Azure Data Factory. We copied an existing pattern, configured the new SharePoint source, previewed the list, and pointed the sink toward Synapse.\n\nThe load then exposed the real work: schema mapping, indexed columns, problematic inferred types, auto-create failures, and data-quality questions. The source was large enough that performance and timeout behavior also needed measurement.\n\nThe session produced a practical fallback. Export a bounded subset to CSV, create the initial table deliberately, then return to pipeline testing with a known schema.", "fieldNotes": "The SharePoint connector exposed many platform fields that were not required downstream. Selecting only required fields reduced ambiguity and helped isolate type problems.\n\nAutomatic table creation failed with a columnstore-related error. The team also identified indexed source columns as a possible blocker. The evidence supports active troubleshooting, not a resolved production load.\n\nI accepted several concrete tasks: test handling of negative balances and duplicate or inconsistent account identifiers, investigate indexed-column behavior, create a subset export for manual table creation, and benchmark the full load.\n\nThe data-quality questions mattered as much as the connector. Multiple records could represent different people while sharing or varying identifiers in ways that could create false duplicates. The task was to verify behavior, not silently deduplicate.\n\nI also began importing packages into a controlled Azure Artifacts feed and described a formal intake and promotion path with third-party security scanning. This advanced the package-management pattern, but the later review had not yet occurred, so I did not treat it as an approved enterprise solution.\n\nA separate group lifecycle notification showed that a migration workspace had expired and been deleted with a restoration window. I did not count that automated message as completed work. It reinforced the need for ownership and lifecycle automation around temporary collaboration assets.", "moved": "- Configured and tested a SharePoint-to-Synapse pipeline path in Azure Data Factory.\n\n- Identified schema mapping, indexed columns, inferred types, and columnstore creation as blockers.\n\n- Defined a CSV subset fallback for deliberate table creation.\n\n- Accepted validation of duplicates, inconsistent identifiers, negative balances, and load performance.\n\n- Began importing Python packages into a controlled Azure Artifacts feed with a formal promotion concept.", "pattern": "Profile before loading. Generate a source schema report, classify identifiers separately from measures, select required columns, define the target table explicitly, and validate edge cases before scaling volume.", "takeaways": "- Reusing a pipeline does not remove source-specific assumptions.\n\n- Automatic schema creation is a convenience, not a contract.\n\n- Suspected duplicates require business validation before removal.", "thread": "The pipeline still needed a stable target schema, successful benchmark, and verified treatment of indexed fields and financial edge cases."}, "moved": ["Configured and tested a SharePoint-to-Synapse pipeline path in Azure Data Factory.", "Identified schema mapping, indexed columns, inferred types, and columnstore creation as blockers.", "Defined a CSV subset fallback for deliberate table creation.", "Accepted validation of duplicates, inconsistent identifiers, negative balances, and load performance.", "Began importing Python packages into a controlled Azure Artifacts feed with a formal promotion concept."], "takeaways": ["Reusing a pipeline does not remove source-specific assumptions.", "Automatic schema creation is a convenience, not a contract.", "Suspected duplicates require business validation before removal."], "source": "journal/2026/06/19/2026-06-19.md"}, {"id": "2026-06-18-document-ownership-before-scale", "date": "2026-06-18", "title": "Document Ownership Before Scale", "theme": "Operational metadata is part of the application", "summary": "The application inventory was not just a list of apps. It was an attempt to make ownership, support, security, lineage, and deployment visible before the platform grew further.", "prompt": "What's the next smallest step?", "types": ["win"], "projects": ["powerplatform", "powerapps", "lineage", "dlp", "operatingmodel"], "words": 446, "minutes": 2, "intro": "The application inventory was not just a list of apps. It was an attempt to make ownership, support, security, lineage, and deployment visible before the platform grew further.", "sections": {"theme": "I participated in a transcribed walkthrough of Power Apps lineage documentation. The record captured the application, environment, audience, primary and secondary development owners, operational support, access-management roles, and data sources.\n\nThe group identified missing process layers around deployment, training, enhancement intake, and ticket enforcement. I accepted follow-up to help formalize a Power Apps deployment task process and clarify the enhancement route.\n\nI also added a security remediation item to the tracking list. The work was documented and queued, not completed.", "fieldNotes": "The inventory separated development ownership from operational support. That distinction is essential. The person who can modify a canvas app may not be the person responsible for outages, permissions, or business continuity.\n\nThe session also emphasized group-managed access where possible. The intent was to reduce direct support dependency by assigning appropriate stakeholders to manage users. That creates scale only when group owners and escalation paths remain current.\n\nI coordinated a policy correction for Copilot environments. The environments needed to be added to an exclusion list on one data-loss-prevention policy while remaining governed by the Copilot-specific policy. The requested change was completed, and I committed to reflect it in documentation.\n\nI continued enablement work by supporting an Agent in a Day participant with environment access and import expectations. I also shared an early peer-review agent proof of concept grounded in the existing ML document library. That was a testable prototype, not an approved review authority.\n\nA deployment conversation revisited a prior application upgrade. The safe path included backing up blue and live slots, producing a manifest, confirming custom files, and backing up the database. I explained that earlier automation attempts failed around schema changes and initial configuration, so the working method remained partly manual.", "moved": "- Reviewed and advanced a Power Apps lineage and support inventory in a transcribed session.\n\n- Accepted follow-up for deployment-task standardization and enhancement-intake documentation.\n\n- Added a security remediation item to the tracking list.\n\n- Corrected Copilot environment treatment across data-loss-prevention policies.\n\n- Enabled a new Copilot Studio learner with environment access and import guidance.\n\n- Shared a grounded peer-review agent proof of concept for testing.", "pattern": "Require an operational manifest for every app: owners, support contacts, audience, environment, data sources, connectors, groups, policies, deployment method, training, monitoring, and retirement path.", "takeaways": "- Ownership and support are different responsibilities.\n\n- Policy exceptions need documentation and a bounded scope.\n\n- A prototype can accelerate learning without being treated as an authority.", "thread": "The application inventory still needed a standardized deployment workflow and enforceable enhancement intake."}, "moved": ["Reviewed and advanced a Power Apps lineage and support inventory in a transcribed session.", "Accepted follow-up for deployment-task standardization and enhancement-intake documentation.", "Added a security remediation item to the tracking list.", "Corrected Copilot environment treatment across data-loss-prevention policies.", "Enabled a new Copilot Studio learner with environment access and import guidance.", "Shared a grounded peer-review agent proof of concept for testing."], "takeaways": ["Ownership and support are different responsibilities.", "Policy exceptions need documentation and a bounded scope.", "A prototype can accelerate learning without being treated as an authority."], "source": "journal/2026/06/18/2026-06-18.md"}, {"id": "2026-06-17-turn-feedback-into-a-system", "date": "2026-06-17", "title": "Turn Feedback Into a System", "theme": "Define the loop before adding more testers", "summary": "User testing creates value only when feedback has somewhere durable to go.", "prompt": "What would future-you want to know?", "types": ["win"], "projects": ["productoperations", "copilotstudio", "uat", "productops", "alm"], "words": 451, "minutes": 2, "intro": "User testing creates value only when feedback has somewhere durable to go.", "sections": {"theme": "I moved an agent from informal testing toward a structured UAT model. I proposed two contributor tracks: one for UAT and documentation, and another for the development and process lifecycle.\n\nThe first track would define the testing approach, capture feedback consistently, and consolidate it into actionable requirements. The second would define how feedback becomes backlog work, iteration, and governed improvement.\n\nThat operating model mattered more than recruiting another tester. Without it, valid feedback becomes chat history.", "fieldNotes": "I asked for volunteers who could lead testing sessions, guide participants through evaluation, identify improvement opportunities, and keep outputs reusable. I remained available but intentionally pushed ownership outward so the model could scale.\n\nThe AI Champions leadership checkpoint reinforced the same pattern. My supported actions were to obtain a finalized business data extract, compare it with an existing semantic model, and schedule contract-review agent testing with real workflow owners. Those were assigned next steps, not completed outcomes.\n\nI also enabled another builder's path into Copilot Studio by checking license status, granting development-environment access, and sharing the formal license-request route. I explained that newly available Work IQ connectors could reduce prior context gaps. Later confirmation showed those connectors had been added to the default Copilot data policy.\n\nA SharePoint transaction workflow exposed a boundary that still needed stakeholder alignment. New records could flow from SharePoint through Data Factory into Synapse, but edits to existing records could conflict with the transactional system of record. I documented that risk and requested a focused follow-up.\n\nI also shared a repository README that documented a previously manual deployment path, including blue and green slots and an unresolved order-of-operations problem. The prior automation attempts had malformed configuration and broken the application, so I did not present the deployment as fully automated.", "moved": "- Defined UAT, documentation, development, and process ownership tracks for agent iteration.\n\n- Requested volunteer ownership for the feedback-to-backlog lifecycle.\n\n- Granted a builder access to a Copilot Studio development environment and shared the license path.\n\n- Confirmed Work IQ connectors were added to the default Copilot data policy.\n\n- Documented a system-of-record conflict for edits in a SharePoint-to-Synapse flow.\n\n- Transferred a documented manual deployment pattern and its known automation failure.", "pattern": "Use a closed UAT loop: test case, observed behavior, evidence, severity, owner, backlog item, change, regression test, and release note. Every feedback item should have one durable state.", "takeaways": "- Feedback without a lifecycle is only conversation.\n\n- Enablement includes access, licensing, policy, and support.\n\n- A manual fallback is valuable when failed automation is documented honestly.", "thread": "The agent UAT model still needed named owners and a first complete feedback-to-release cycle."}, "moved": ["Defined UAT, documentation, development, and process ownership tracks for agent iteration.", "Requested volunteer ownership for the feedback-to-backlog lifecycle.", "Granted a builder access to a Copilot Studio development environment and shared the license path.", "Confirmed Work IQ connectors were added to the default Copilot data policy.", "Documented a system-of-record conflict for edits in a SharePoint-to-Synapse flow.", "Transferred a documented manual deployment pattern and its known automation failure."], "takeaways": ["Feedback without a lifecycle is only conversation.", "Enablement includes access, licensing, policy, and support.", "A manual fallback is valuable when failed automation is documented honestly."], "source": "journal/2026/06/17/2026-06-17.md"}, {"id": "2026-06-16-scale-metadata-with-evidence", "date": "2026-06-16", "title": "Scale Metadata With Evidence", "theme": "Human review belongs inside the pipeline", "summary": "The catalog had enough reports to make manual enrichment expensive, but not enough trustworthy metadata to make automated discovery reliable.", "prompt": "What's worth remembering about today?", "types": ["learning"], "projects": ["metadata", "powerbi", "generativeai", "governance"], "words": 442, "minutes": 2, "intro": "The catalog had enough reports to make manual enrichment expensive, but not enough trustworthy metadata to make automated discovery reliable.", "sections": {"theme": "I demonstrated an AI-assisted process for enriching metadata across an initial set of Power BI reports. The workflow exported catalog data, generated missing descriptions and related fields, and kept people in the review loop.\n\nThe demonstration surfaced the real scaling requirements. Security and prompt-injection risks needed review. Generated metadata needed routine sampling. Permissions and approvals had to be explicit before the process expanded beyond the initial scope.\n\nThis shifted the work from a useful script toward a governed enrichment pipeline.", "fieldNotes": "The strongest design decision was to keep the source catalog exportable and the generated changes reviewable. That made it possible to compare old and proposed metadata before publication.\n\nThe meeting produced concrete follow-up work: conduct a security and governance review, develop a quality-control sampling strategy, coordinate required permissions, and delay broader demonstrations until those concerns were addressed.\n\nI also contributed to an AI community discussion about acceptable tool use and approval paths. The transcribed meeting connected organizational use of AI tools to established review and steering processes. I shared that organizational tools need identification and approval before adoption. This was a governance clarification, not a new policy created by me.\n\nA separate transcribed session covered renewal of Azure DevOps access tokens and secure storage. The session showed that token renewal was recurring operational work and that access to the password-management system still needed clarification for several groups. I was assigned to request the access needed to help manage keys and folders.\n\nAutomated pipeline notifications again showed executions that completed with mismatched counts or warnings. They supported the same lesson as metadata sampling: automation needs a second layer that evaluates output quality.", "moved": "- Demonstrated AI-assisted metadata enrichment for a bounded Power BI catalog scope.\n\n- Identified security, prompt-injection, quality-sampling, permission, and approval requirements before scaling.\n\n- Advanced a human-in-the-loop review model for generated metadata.\n\n- Clarified organizational AI approval expectations in a transcribed community session.\n\n- Learned and documented the recurring token-renewal workflow and its access dependencies.", "pattern": "Treat generated metadata as a proposed change set. Preserve the source, capture the prompt and model configuration, score completeness, sample outputs, route defects, and require approval before publication.\n\nThe future state is a scheduled enrichment pipeline with deterministic schemas, risk checks, drift monitoring, and an exception queue for human review.", "takeaways": "- Metadata generation is easy. Metadata trust is the product.\n\n- Sampling and defect capture must exist before scale.\n\n- Credentials and permissions are part of the operating model.", "thread": "The enrichment workflow still needed an approved security review and measurable acceptance thresholds."}, "moved": ["Demonstrated AI-assisted metadata enrichment for a bounded Power BI catalog scope.", "Identified security, prompt-injection, quality-sampling, permission, and approval requirements before scaling.", "Advanced a human-in-the-loop review model for generated metadata.", "Clarified organizational AI approval expectations in a transcribed community session.", "Learned and documented the recurring token-renewal workflow and its access dependencies."], "takeaways": ["Metadata generation is easy. Metadata trust is the product.", "Sampling and defect capture must exist before scale.", "Credentials and permissions are part of the operating model."], "source": "journal/2026/06/16/2026-06-16.md"}, {"id": "2026-06-15-start-with-the-data-flow", "date": "2026-06-15", "title": "Start With the Data Flow", "theme": "Trace the source before choosing the tool", "summary": "A recurring email attachment looked like an automation problem. The first useful question was whether email should be in the architecture at all.", "prompt": "What are you trying next?", "types": ["win"], "projects": ["automation", "powerautomate", "microsoftgraph", "sharepoint", "datagovernance"], "words": 489, "minutes": 2, "intro": "A recurring email attachment looked like an automation problem. The first useful question was whether email should be in the architecture at all.", "sections": {"theme": "I helped frame an ingestion path for a recurring external report. The source did not expose the needed data through its developer interface, so the practical options narrowed to Power Automate or Microsoft Graph, with a database load downstream.\n\nI sketched the general flow and joined a working session where the team assembled a low-code approach. The direct evidence supports exploration and implementation work around the flow, not a completed production load.\n\nThe same day, I rebuilt a large SharePoint list after masking a sensitive identifier and refining the imported data. A reviewer confirmed the refreshed version looked ready for an initial stakeholder review. I also documented that the data flow still needed to be explained clearly before broader use.", "fieldNotes": "Email attachment ingestion creates hidden dependencies: mailbox access, attachment naming, recurrence, source-file stability, storage, schema validation, and failure handling. Power Automate can reduce initial plumbing, while Graph supports a more programmable path. The right choice depends on volume, support ownership, and how much control the pipeline requires.\n\nThe SharePoint rebuild reinforced a related point. Masking sensitive data before import is not a presentation detail. It is part of the ingestion contract. Reimporting after refinement was safer than allowing uncertain fields to persist in a shared list.\n\nI also requested the latest AI safety assessment workbook and circulated it with an AI governance reference. I connected the assessment to governance, platform controls, community enablement, and existing documentation. That was an alignment step, not a completed attestation.\n\nA reporting discussion identified another integration pattern. Instead of manually reconstructing a stakeholder-edited spreadsheet, I requested the final workbook so its transformations could be compared against the semantic model. The intent was to recover the logic from existing artifacts and reduce repeated manual work.\n\nAutomated operations messages showed successful loads with row-count mismatches and a separate data-mart failure. I treated those only as context. They reinforced why an automated pipeline needs data-quality checks beyond a green execution status.", "moved": "- Explored a recurring email-attachment ingestion path using Power Automate or Microsoft Graph.\n\n- Participated in implementation of the initial low-code flow.\n\n- Rebuilt and reimported a SharePoint list after masking sensitive data and refining fields.\n\n- Validated the refreshed list as ready for an initial stakeholder review.\n\n- Obtained and circulated an AI safety assessment workbook for governance alignment.\n\n- Requested a finalized reporting workbook to reverse-engineer reusable semantic logic.", "pattern": "Start every ingestion design with a source-to-target contract. Record source availability, transport, cadence, schema, sensitivity, validation, ownership, and recovery behavior before selecting the automation tool.", "takeaways": "- The easiest transport is not always the best source.\n\n- Sensitive fields should be transformed before they reach shared storage.\n\n- Pipeline success and data correctness require separate checks.", "thread": "The email workflow still needed an evidence-backed production path, monitoring, and a clear owner."}, "moved": ["Explored a recurring email-attachment ingestion path using Power Automate or Microsoft Graph.", "Participated in implementation of the initial low-code flow.", "Rebuilt and reimported a SharePoint list after masking sensitive data and refining fields.", "Validated the refreshed list as ready for an initial stakeholder review.", "Obtained and circulated an AI safety assessment workbook for governance alignment.", "Requested a finalized reporting workbook to reverse-engineer reusable semantic logic."], "takeaways": ["The easiest transport is not always the best source.", "Sensitive fields should be transformed before they reach shared storage.", "Pipeline success and data correctness require separate checks."], "source": "journal/2026/06/15/2026-06-15.md"}, {"id": "2026-06-12-protect-before-you-publish", "date": "2026-06-12", "title": "Protect Before You Publish", "theme": "Access belongs in the ingestion plan", "summary": "I loaded a large dataset, then realized the permissions should have been designed first. The correct response was not to defend the work. It was to remove the exposure and rebuild safely.", "prompt": "What blocked you today?", "types": ["win", "decision"], "projects": ["dataprivacy", "sharepoint", "security", "copilotstudio", "azureartifacts"], "words": 464, "minutes": 2, "intro": "I loaded a large dataset, then realized the permissions should have been designed first. The correct response was not to defend the work. It was to remove the exposure and rebuild safely.", "sections": {"theme": "A SharePoint list migration completed, but breaking inherited permissions failed because of the list size. The development site included broader access than the sensitive data justified.\n\nI considered hiding columns, but that was not a sufficient control. I chose to purge the list and reload it after access was constrained. The extra work was the right tradeoff.", "fieldNotes": "This was a clean example of sequencing failure. I had focused on schema and load mechanics before proving the access boundary. Once records existed, the list was too large for the intended permission change to complete reliably.\n\nThe reusable correction is straightforward: create the destination, break inheritance, assign the minimum groups, test with representative identities, then load. The day's evidence supports the decision to purge and redo the load. It does not confirm the completed reload, so I am not calling that final state shipped.\n\nThe day also produced several positive platform outcomes. I submitted a request to add the Microsoft Work IQ connector suite to the default Copilot Studio policy, with a documented rationale covering chat, meetings, mail, calendar, documents, OneDrive, and SharePoint grounding. The platform owner agreed to include the broader suite.\n\nI demonstrated that an image could be processed into structured text and written to a SharePoint list now that Dataverse and tool access were working. I identified audio and meeting transcripts as adjacent patterns, but those extensions were not yet implemented.\n\nI also helped bring an executive chief-of-staff agent online and shared its purpose and instructions with pilot users. One user confirmed access worked. This was an enabled pilot, not a production-wide release.\n\nFor data-science packages, I recommended Azure Artifacts as an enterprise-accessible feed rather than manually curating exact source archives. The proposal acknowledged storage limits and the need for role management. It was a design recommendation, not an approved operating service.", "moved": "- Identified an unsafe permission sequence after a large SharePoint migration.\n\n- Chose to purge and rebuild rather than rely on hidden columns.\n\n- Submitted and advanced the Work IQ connector request for Copilot Studio policy.\n\n- Demonstrated image-to-structured-data extraction into a SharePoint list.\n\n- Enabled a chief-of-staff agent pilot and received successful access confirmation.\n\n- Proposed Azure Artifacts as a scalable package-distribution control.", "pattern": "Make security preflight a hard gate before ingestion. Validate inheritance, groups, test identities, sensitive columns, export paths, and rollback before the first record is written.", "takeaways": "- Hidden columns are not access control.\n\n- Permission design must precede bulk loading.\n\n- A deliberate purge is better than preserving a risky shortcut.", "thread": "The dataset still needed a verified reload into a least-privilege destination."}, "moved": ["Identified an unsafe permission sequence after a large SharePoint migration.", "Chose to purge and rebuild rather than rely on hidden columns.", "Submitted and advanced the Work IQ connector request for Copilot Studio policy.", "Demonstrated image-to-structured-data extraction into a SharePoint list.", "Enabled a chief-of-staff agen
