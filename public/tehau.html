t pilot and received successful access confirmation.", "Proposed Azure Artifacts as a scalable package-distribution control."], "takeaways": ["Hidden columns are not access control.", "Permission design must precede bulk loading.", "A deliberate purge is better than preserving a risky shortcut."], "source": "journal/2026/06/12/2026-06-12.md"}, {"id": "2026-06-11-capacity-is-governance", "date": "2026-06-11", "title": "Capacity Is Governance", "theme": "Make consumption visible before scale", "summary": "Provisioning more environments without limits creates a shared-resource failure mode.", "prompt": "What did you ship or move forward?", "types": ["win"], "projects": ["governance", "dataverse", "copilotstudio", "capacity", "platformgovernance"], "words": 382, "minutes": 2, "intro": "Provisioning more environments without limits creates a shared-resource failure mode.", "sections": {"theme": "In a transcribed Power Platform baseline review, I worked through Dataverse capacity, environment allocation, data-loss-prevention policy assignment, connector coverage, and naming consistency.\n\nThe main risk was uncontrolled consumption. Individual environments could draw from shared capacity, and nonproduction use could affect the broader platform if limits and notifications were not configured.", "fieldNotes": "The working decisions were to disable capacity overages for Copilot Studio environments, enable notifications near limits, verify the intended data-loss-prevention policy, update environment-creation documentation, add required Work IQ connectors, and normalize naming.\n\nMy assigned work was to update the provisioning documentation with the new capacity and policy steps. The meeting was transcribed, so the decisions and action are directly supported. The evidence did not show that my documentation update was completed that same day.\n\nThe discussion also highlighted cost accountability. Environment requests were connected to director-level awareness, but technical controls were still necessary. Budget awareness cannot replace quotas, policy, and monitoring.\n\nIn parallel, I explored automation opportunities and continued work on governed AI and machine-learning standards. A separate town hall discussed publishing AI-generated survey summaries after leadership review. Those references supported the broader governance context, but I did not treat them as completed work by me.\n\nI also received a package-management problem from the data-science team. Manually approving exact archives for frequently changing Python and R dependencies was not scalable. I began considering an internal artifact feed as a more maintainable control, but the documented recommendation came the following day.", "moved": "- Participated in a transcribed capacity and policy review for Copilot Studio environments.\n\n- Defined controls for overages, threshold notifications, policy assignment, connectors, and naming.\n\n- Accepted the provisioning-documentation update for the revised environment process.\n\n- Surfaced shared-capacity and cost risks before additional environment growth.\n\n- Began framing a scalable alternative to manual data-science package approval.", "pattern": "Treat platform capacity as code. Every environment request should declare owner, purpose, expected storage, connector needs, policy, expiration, and cost center. Provisioning should apply limits and alerts automatically.", "takeaways": "- Shared capacity without quotas is an operational risk.\n\n- Governance needs technical enforcement, not only approval.\n\n- Package controls must account for dependency and version churn.", "thread": "The environment process still needed updated documentation and automated verification of limits, alerts, and policies."}, "moved": ["Participated in a transcribed capacity and policy review for Copilot Studio environments.", "Defined controls for overages, threshold notifications, policy assignment, connectors, and naming.", "Accepted the provisioning-documentation update for the revised environment process.", "Surfaced shared-capacity and cost risks before additional environment growth.", "Began framing a scalable alternative to manual data-science package approval."], "takeaways": ["Shared capacity without quotas is an operational risk.", "Governance needs technical enforcement, not only approval.", "Package controls must account for dependency and version churn."], "source": "journal/2026/06/11/2026-06-11.md"}, {"id": "2026-06-10-document-the-operating-model", "date": "2026-06-10", "title": "Document the Operating Model", "theme": "Documentation should answer operational questions", "summary": "An application inventory becomes valuable when it explains how a solution is owned, supported, connected, and changed.", "prompt": "What are you working on?", "types": ["idea"], "projects": ["documentation", "powerapps", "lineage", "governance"], "words": 415, "minutes": 2, "intro": "> 💡 idea\n\nAn application inventory becomes valuable when it explains how a solution is owned, supported, connected, and changed.", "sections": {"theme": "In a transcribed working session, I helped refine a Power Apps documentation framework. The current inventory included environment, audience, development ownership, operational support, SharePoint sites, security groups, data sources, application links, lineage, databases, lookup lists, size, pipelines, and schedule frequency.\n\nI proposed adding links to master requirements and supporting documentation. I also accepted the task of defining complexity metrics that could describe solution size more consistently.", "fieldNotes": "The strongest outcome was separating development ownership from operational support. Those responsibilities can overlap, but they should never be assumed to be identical.\n\nComplexity also needed a practical definition. Candidate indicators included the number of data sources, SharePoint lists, screens, integrations, environments, and scheduled processes. The evidence supports that I was assigned to define these options, not that a final scoring model was approved.\n\nI continued shaping requirements for a financial-adjustment workflow. The team reviewed sample records and discussed whether a default SharePoint form could provide a minimal entry experience before a Power BI report was created. The requirements were still moving, so I did not label the solution implemented.\n\nI also explored a paper-to-digital recovery pattern for a Power App workflow. The idea was to photograph a consistent paper form, extract structured fields with AI, and load the result after validation. I described options involving image capture and AI extraction, while acknowledging handwriting accuracy as a constraint. This remained exploration.\n\nA separate operational thread concerned certificate renewal for a public web property. I documented the expected coordination across certificate issuance, host installation, and network infrastructure, but the day's evidence did not confirm completion.", "moved": "- Advanced a comprehensive Power Apps documentation framework in a transcribed session.\n\n- Added requirements and support-document links to the proposed documentation model.\n\n- Accepted definition of measurable solution-complexity attributes.\n\n- Refined the minimal entry approach for a SharePoint-based adjustment workflow.\n\n- Explored an AI-assisted paper-to-structured-data recovery pattern.\n\n- Documented the coordination path for an approaching certificate renewal.", "pattern": "Maintain an operational manifest beside every application. Include ownership, support, audience, environments, access groups, sources, dependencies, lineage, schedules, requirements, runbooks, and complexity indicators.\n\nGenerate the manifest from deployment metadata where possible, then route only the unresolved fields for human review.", "takeaways": "- Documentation should support decisions during incidents and enhancements.\n\n- Complexity needs observable attributes, not intuition.\n\n- Recovery workflows require validation before data import.", "thread": "The documentation model still needed approved complexity measures and a repeatable maintenance process."}, "moved": ["Advanced a comprehensive Power Apps documentation framework in a transcribed session.", "Added requirements and support-document links to the proposed documentation model.", "Accepted definition of measurable solution-complexity attributes.", "Refined the minimal entry approach for a SharePoint-based adjustment workflow.", "Explored an AI-assisted paper-to-structured-data recovery pattern.", "Documented the coordination path for an approaching certificate renewal."], "takeaways": ["Documentation should support decisions during incidents and enhancements.", "Complexity needs observable attributes, not intuition.", "Recovery workflows require validation before data import."], "source": "journal/2026/06/10/2026-06-10.md"}, {"id": "2026-06-09-everything-becomes-a-pipeline", "date": "2026-06-09", "title": "Everything Becomes a Pipeline", "theme": "Turn one-off success into a controlled path", "summary": "A proof of concept becomes trustworthy when its assumptions can be repeated, tested, and handed off.", "prompt": "Who did you help, or who helped you?", "types": ["win"], "projects": ["pipelines", "python", "azuredevops", "etl", "googlesearchconsole"], "words": 431, "minutes": 2, "intro": "A proof of concept becomes trustworthy when its assumptions can be repeated, tested, and handed off.", "sections": {"theme": "I built a functional proof of concept for extracting Google Search Console impressions. The output included date, query, page, country, and device, with a date range that could later become a rolling extract.\n\nThe business owner reviewed the available fields and confirmed that the initial extraction covered what the service exposed. I deliberately kept the requirements iterative, but I also wanted most of the expected output understood before involving the downstream data team.", "fieldNotes": "I packaged the proof of concept and shared it for technical review. I also worked through a peer-review template and recognized that a generic AI project template did not fit cleanly. This was primarily an ETL pipeline, and the documentation needed to match that delivery model.\n\nThat realization sharpened a broader principle: code, AI, integrations, and review processes all become pipelines when they need to scale. A pipeline creates repeatable checkpoints for inputs, transformations, tests, approvals, and outputs.\n\nOn a separate Azure DevOps deployment, a private-endpoint restriction returned a forbidden response while the pipeline attempted to reach application settings. I advised testing the agent IP restriction in development and described a temporary public-access deployment pattern that had worked elsewhere. The rerun deployed the web and function applications successfully. That was a completed development deployment, not proof of production readiness.\n\nI also supported agent-access troubleshooting and helped route an additional user into the pilot group. Licensing and configuration remained confusing, which reinforced the need to separate builder access, agent use, and administrative visibility.\n\nFor a financial-adjustment workflow, I argued against a free-form CSV as the primary transaction interface. A SharePoint form offered validation controls and a clearer path toward structured entry, even if the final solution remained minimal.", "moved": "- Implemented a functional Google Search Console extraction proof of concept.\n\n- Validated the initial output fields with the business owner.\n\n- Packaged the code for technical review and began requirements documentation.\n\n- Supported successful development deployment of a web app and function app after network troubleshooting.\n\n- Advanced agent builder access for additional pilot users.\n\n- Recommended validated structured entry over free-form CSV for a transactional workflow.", "pattern": "Treat every durable solution as a pipeline: acquire, validate, transform, test, approve, publish, and monitor. Keep environment-specific configuration outside the code and make each checkpoint observable.", "takeaways": "- A functional script is the beginning of a delivery system.\n\n- Review templates must fit the actual solution type.\n\n- Temporary deployment workarounds need explicit restoration checks.", "thread": "The extraction still needed a production ingestion owner, scheduled execution, durable storage, and monitoring."}, "moved": ["Implemented a functional Google Search Console extraction proof of concept.", "Validated the initial output fields with the business owner.", "Packaged the code for technical review and began requirements documentation.", "Supported successful development deployment of a web app and function app after network troubleshooting.", "Advanced agent builder access for additional pilot users.", "Recommended validated structured entry over free-form CSV for a transactional workflow."], "takeaways": ["A functional script is the beginning of a delivery system.", "Review templates must fit the actual solution type.", "Temporary deployment workarounds need explicit restoration checks."], "source": "journal/2026/06/09/2026-06-09.md"}, {"id": "2026-06-08-prototype-before-platform", "date": "2026-06-08", "title": "Prototype Before Platform", "theme": "Use the smallest useful surface", "summary": "The first version did not need to solve the entire dataset. It needed to make the unknowns visible.", "prompt": "What's the next smallest step?", "types": ["win"], "projects": ["prototyping", "powerapps", "sharepoint", "dataarchitecture"], "words": 437, "minutes": 2, "intro": "The first version did not need to solve the entire dataset. It needed to make the unknowns visible.", "sections": {"theme": "I had a working Power Apps prototype for a financial-adjustment workflow. The app was explicitly in a development state so stakeholders could inspect the available fields and decide what needed to be displayed and maintained when creating records.\n\nThe largest constraint was scale. The available source contained hundreds of thousands of records, which pushed the design toward premium SQL connectivity. I challenged whether the first workflow truly needed every historical record or whether a smaller active subset could support the immediate use case.", "fieldNotes": "The prototype gave the team something concrete to react to without pretending the requirements were complete. A development interface was enough to test field selection, entry expectations, and the practical implications of source volume.\n\nI also helped troubleshoot access to an external analytics API and confirmed the connection worked. That unblocked a separate proof of concept, but the day's evidence did not yet show a production integration.\n\nAnother useful thread involved SharePoint governance automation. I shared a PnP PowerShell connection pattern and reviewed a tenant-scanning script intended to locate broad access assignments. The script was still being shaped, so I treated it as implementation support rather than a completed control.\n\nA team code review provided direct learning about domain identifiers and financial containers. The practical takeaway was that similar-looking identifiers represent different grains. A stable person identifier, an encounter identifier, and a financial account identifier should never be treated as interchangeable keys.\n\nAutomated batch messages reported successful executions with row-count differences. Those alerts remained supporting context only. They reinforced why a green status should not be interpreted as data equivalence.", "moved": "- Demonstrated a functional Power Apps prototype in a development environment.\n\n- Defined the next requirement questions around displayed fields and editable attributes.\n\n- Identified source volume and connector licensing as architectural constraints.\n\n- Validated access to an external analytics API for a separate proof of concept.\n\n- Shared a reusable PnP PowerShell connection pattern for SharePoint governance work.\n\n- Advanced my understanding of identifier grain through a transcribed code review.", "pattern": "Build the smallest surface that exposes the real decisions. Keep the first version narrow, instrument its constraints, and use stakeholder interaction to turn assumptions into requirements.\n\nFor data-heavy apps, profile row volume, key grain, update behavior, and access requirements before selecting the connector or storage tier.", "takeaways": "- A prototype should expose unknowns, not hide them.\n\n- Data volume can change both architecture and licensing.\n\n- Similar identifiers can represent entirely different grains.", "thread": "The workflow still needed a confirmed record scope, final field set, and production-grade data path."}, "moved": ["Demonstrated a functional Power Apps prototype in a development environment.", "Defined the next requirement questions around displayed fields and editable attributes.", "Identified source volume and connector licensing as architectural constraints.", "Validated access to an external analytics API for a separate proof of concept.", "Shared a reusable PnP PowerShell connection pattern for SharePoint governance work.", "Advanced my understanding of identifier grain through a transcribed code review."], "takeaways": ["A prototype should expose unknowns, not hide them.", "Data volume can change both architecture and licensing.", "Similar identifiers can represent entirely different grains."], "source": "journal/2026/06/08/2026-06-08.md"}, {"id": "2026-06-05-governance-is-model-infrastructure", "date": "2026-06-05", "title": "Governance Is Model Infrastructure", "theme": "Make lineage and review executable", "summary": "A machine learning standard is useful only when it can answer operational questions. Which data trained this model? Which extract produced a feature? What changed since the last review? When does retraining require a new approval?", "prompt": "What are you trying next?", "types": ["win"], "projects": ["mlgovernance", "machinelearning", "mlops", "lineage", "responsibleai"], "words": 624, "minutes": 3, "intro": "A machine learning standard is useful only when it can answer operational questions. Which data trained this model? Which extract produced a feature? What changed since the last review? When does retraining require a new approval?\n\nI finished the week by advancing a working machine learning governance standard around those questions. The document was still a work in progress, but it made the expected evidence concrete.", "sections": {"theme": "The standard required training data to be referenced through versioned, immutable data assets or governed tables rather than ad hoc local files. It also required end-to-end lineage from source tables and extract dates through curated layers, features, and model inputs.\n\nThat requirement is more than documentation hygiene. It is what makes a result reproducible, a defect traceable, and a model review meaningful. If a feature cannot be connected to its source and extraction context, the organization cannot confidently explain why the model behaved as it did.\n\nThe supporting peer-review work also distinguished changes that could be logged from changes that should trigger fresh review. Routine retraining on data of the same shape and source could be pre-authorized when performance stayed within evaluated bounds. Changes to features, data sources, extraction definitions, algorithms, intended use, audience, or risk tier required renewed scrutiny.", "fieldNotes": "The standard connected governance to real platform objects. Versioning needed to live in the data and model systems, not in filenames alone. Lineage needed to be queryable. References needed access dates because cloud documentation and product names change.\n\nThis was also a reminder that governance should define interfaces instead of prescribing one giant platform. A team might use Azure Machine Learning data assets or governed lakehouse tables, but the invariant is the same: immutable versions, traceable lineage, reproducible inputs, and review evidence.\n\nThe week's application work reinforced the point. A team wanted to transfer low-code applications to a future support function, but the necessary platform roles and support capacity were not yet fully available. A technically correct solution without an operating owner becomes a delayed incident.\n\nI also continued shaping a data-entry application against incomplete historical records. The next increment narrowed the first section to minimum viable attributes. That was progress in the interface, but not resolution of the data-quality risk. I kept those statuses separate.\n\nA discussion about bias in AI-enabled hiring systems added another governance dimension. Model quality cannot be reduced to aggregate accuracy. Intended use, affected populations, review thresholds, and the consequences of error belong in the control model from the beginning.", "moved": "- Advanced a working machine learning governance standard with versioning and lineage requirements.\n\n- Defined traceability from source and extract through features and model inputs.\n\n- Established a risk-based distinction between logged retraining and changes requiring fresh peer review.\n\n- Preserved an unresolved support-model gap for low-code applications.\n\n- Narrowed an application data table toward minimum viable attributes without overstating source-data completeness.\n\n- Incorporated intended use and bias risk into the broader evaluation lens.", "pattern": "Represent every model release as an evidence bundle. Include immutable data references, code and environment versions, feature definitions, evaluation results, intended use, risk tier, approvals, and deployment metadata.\n\nThen make re-review event-driven. A changed feature contract, new source, drift threshold breach, altered audience, or model revision should automatically open the appropriate review workflow. Non-behavioral changes can be logged and verified without forcing the full process.\n\nThis is governance as infrastructure: controls that follow the model through its lifecycle rather than a document reviewed once at the beginning.", "takeaways": "- Lineage must be queryable, not merely described.\n\n- Retraining and redesign are different change classes.\n\n- A support owner is part of production readiness.", "thread": "The standard still needed validation against real projects and an automated evidence model that teams could adopt without duplicating work."}, "moved": ["Advanced a working machine learning governance standard with versioning and lineage requirements.", "Defined traceability from source and extract through features and model inputs.", "Established a risk-based distinction between logged retraining and changes requiring fresh peer review.", "Preserved an unresolved support-model gap for low-code applications.", "Narrowed an application data table toward minimum viable attributes without overstating source-data completeness.", "Incorporated intended use and bias risk into the broader evaluation lens."], "takeaways": ["Lineage must be queryable, not merely described.", "Retraining and redesign are different change classes.", "A support owner is part of production readiness."], "source": "journal/2026/06/05/2026-06-05.md"}, {"id": "2026-06-04-document-before-you-automate", "date": "2026-06-04", "title": "Document Before You Automate", "theme": "Turn tribal steps into an executable specification", "summary": "Automation does not fix an unclear process. It makes the uncertainty execute faster.", "prompt": "What did you learn?", "types": ["learning"], "projects": ["platformengineering", "powerplatform", "automation", "azure", "governance"], "words": 583, "minutes": 3, "intro": "Automation does not fix an unclear process. It makes the uncertainty execute faster.\n\nToday I led a baseline review of the Power Platform environment provisioning process. The immediate deliverable was documentation, but the real objective was to expose every decision that an eventual provisioning pipeline would need to make.", "sections": {"theme": "The guide was designed as a supplement to the broader governance material. It walked from intake and justification through environment creation, security, data-loss prevention, auditing, retention, capacity, licensing, and handoff.\n\nThe review surfaced a critical design constraint: the process needed to work across two related organizations with different service-management and administrative paths. Language that looked universal was sometimes specific to one side. Capturing that difference was more valuable than forcing false standardization.\n\nThe group identified concrete updates. The environment settings table needed to match the current administrative options. The guide needed explicit steps for removing the default data-loss prevention assignment and adding the new environment as an exclusion. Auditing and retention belonged under environment settings. Copilot credits needed their own section, including purchase, assignment, and request paths. Work IQ connectors required a formal request.", "fieldNotes": "I kept the review focused on one process because broad governance conversations can become abstract quickly. Walking top to bottom forced each participant to react to a real sequence of actions.\n\nThe strongest principle was simple: document every setting, including settings that remain unchanged. An automation cannot safely reproduce a process if the desired default is implicit. Explicit defaults also make drift detectable later.\n\nI acknowledged where I had missed earlier feedback about organizational differences. That correction improved the design. The goal was not to defend the first draft. It was to reduce mental load and produce a specification that both administrators and automation could use.\n\nIn parallel, I advanced a solution catalog automation concept. The proposed system would enrich metadata for existing reports using Azure AI resources and a controlled response contract. I validated network conventions, region and naming assumptions, and whether existing infrastructure could be reused. I also traced the enterprise AI approval path because an internally built system still required governance.\n\nAnother application thread exposed incomplete historical data. Rather than hide that behind a form, I asked how many records were affected, what portion of value was tied to incomplete history, and whether balances remained directionally correct. I shaped the interface around read-only context, constrained adjustment inputs, server-side validation, and audit logging. The incomplete source remained an open risk.", "moved": "- Reviewed and refined a cross-organization Power Platform environment provisioning guide.\n\n- Identified explicit updates for environment settings, data-loss prevention, auditing, retention, credits, and connectors.\n\n- Converted implied defaults into documented configuration decisions.\n\n- Advanced architecture and governance discovery for AI-assisted solution catalog enrichment.\n\n- Shaped a controlled adjustment workflow around validation and auditability.\n\n- Kept incomplete historical data visible as a risk rather than presenting the application as complete.", "pattern": "Write the runbook as if a pipeline will execute it tomorrow. Every step needs an input, decision rule, expected state, validation check, owner, and rollback or escalation path.\n\nOnce the runbook is stable, translate it into idempotent provisioning modules. The requested state becomes configuration. The pipeline compares current and desired state, applies only necessary changes, validates controls, and records evidence.", "takeaways": "- Explicit defaults are required for safe automation.\n\n- Shared platforms still need organization-specific routing where responsibilities differ.\n\n- Data completeness must be measured before an interface implies confidence.", "thread": "The provisioning guide still needed final edits and a clear split between common controls and organization-specific execution paths."}, "moved": ["Reviewed and refined a cross-organization Power Platform environment provisioning guide.", "Identified explicit updates for environment settings, data-loss prevention, auditing, retention, credits, and connectors.", "Converted implied defaults into documented configuration decisions.", "Advanced architecture and governance discovery for AI-assisted solution catalog enrichment.", "Shaped a controlled adjustment workflow around validation and auditability.", "Kept incomplete historical data visible as a risk rather than presenting the application as complete."], "takeaways": ["Explicit defaults are required for safe automation.", "Shared platforms still need organization-specific routing where responsibilities differ.", "Data completeness must be measured before an interface implies confidence."], "source": "journal/2026/06/04/2026-06-04.md"}, {"id": "2026-06-03-test-the-agent-not-the-demo", "date": "2026-06-03", "title": "Test the Agent, Not the Demo", "theme": "Evaluation needs an explicit contract", "summary": "An agent can appear complete long before it is trustworthy. A polished response proves almost nothing unless the output is compared with an expected answer and the misses are captured systematically.", "prompt": "What decision did you make, and why?", "types": ["learning"], "projects": ["agentevaluation", "copilotstudio", "evaluation", "testing", "governance"], "words": 594, "minutes": 3, "intro": "An agent can appear complete long before it is trustworthy. A polished response proves almost nothing unless the output is compared with an expected answer and the misses are captured systematically.\n\nToday I moved a contract-focused Copilot Studio agent into user acceptance testing. The meaningful change was not simply giving testers access. It was defining what they should test and how their feedback would change the system.", "sections": {"theme": "The testing guidance was intentionally simple. Upload a representative document, review the response, compare it with the approved standard, and record anything that was missed, misclassified, or unclear.\n\nThe initial evaluation scope focused on alignment with core provisions, identification of deviations and missing clauses, basic risk surfacing, and a consistent output structure. Those are bounded behaviors that a domain reviewer can inspect. They are stronger than asking whether the agent feels useful.\n\nI made the current instructions visible as a starting point rather than treating the prompt as hidden implementation detail. That gave reviewers a way to connect an incorrect result to the behavior we had actually specified.", "fieldNotes": "Tester access was confirmed, and the premium Microsoft 365 license exposed broader Copilot functionality across the productivity suite. That expanded the tool surface, but it also increased the need to separate platform capability from this agent's acceptance criteria.\n\nThe feedback mechanism needed to support short observations. A reviewer should be able to say that the agent failed to flag governing law, assigned the wrong risk, or produced an unclear explanation. Those observations can become regression cases instead of disappearing into meeting notes.\n\nA broader prompt workshop the same day reinforced the value of clear context, goals, source material, and expected output. It also surfaced practical differences between licensed experiences and occasional service constraints. Those were useful platform lessons, but they were not evidence that the contract agent itself had passed testing.\n\nI also worked through an immature intake process for new AI requests. The lack of a formal enterprise route meant the platform path could be documented while the higher-level AI review still depended on people knowing where to carry the request. That is a governance risk because good technical work can move faster than the approval evidence around it.\n\nA solution catalog effort added another evaluation challenge: metadata extraction should return controlled values, avoid inferring ambiguous dates, and distinguish visible metrics from generic fields. Constraints like those turn an open-ended model response into a testable interface.", "moved": "- Implemented user acceptance testing guidance for a contract-focused Copilot Studio agent.\n\n- Confirmed tester access to the agent.\n\n- Defined bounded MVP behaviors for comparison, deviation detection, risk surfacing, and output consistency.\n\n- Established a lightweight feedback pattern that can become regression tests.\n\n- Advanced controlled-vocabulary rules for AI-assisted metadata extraction.\n\n- Documented a gap between platform intake and enterprise AI governance.", "pattern": "Every agent should have an evaluation contract containing representative inputs, expected findings, allowed labels, prohibited assumptions, output schema, reviewer role, and acceptance threshold.\n\nStore each reviewer correction as a versioned test case. Run the suite whenever instructions, knowledge, connectors, or models change. That creates an evidence trail from prompt revision to observed behavior.\n\nThe future state is continuous agent evaluation: feedback enters a structured queue, approved examples join the regression set, deployments run automated checks, and production telemetry identifies where new tests are needed.", "takeaways": "- Access is a prerequisite, not acceptance.\n\n- Domain reviewers need observable criteria, not a general request for feedback.\n\n- Controlled outputs make model behavior easier to test and govern.", "thread": "The next step was collecting enough reviewer cases to separate isolated prompt defects from recurring design problems."}, "moved": ["Implemented user acceptance testing guidance for a contract-focused Copilot Studio agent.", "Confirmed tester access to the agent.", "Defined bounded MVP behaviors for comparison, deviation detection, risk surfacing, and output consistency.", "Established a lightweight feedback pattern that can become regression tests.", "Advanced controlled-vocabulary rules for AI-assisted metadata extraction.", "Documented a gap between platform intake and enterprise AI governance."], "takeaways": ["Access is a prerequisite, not acceptance.", "Domain reviewers need observable criteria, not a general request for feedback.", "Controlled outputs make model behavior easier to test and govern."], "source": "journal/2026/06/03/2026-06-03.md"}, {"id": "2026-06-02-build-the-learning-system", "date": "2026-06-02", "title": "Build the Learning System", "theme": "Enablement needs infrastructure", "summary": "A community of practice can look lightweight from the outside, but the useful version is a product. It needs a learning path, accessible tools, durable artifacts, and a way for people with different starting points to keep moving together.", "prompt": "What blocked you today?", "types": ["idea"], "projects": ["communityofpractice", "machinelearning", "python", "developerexperience", "enablement"], "words": 626, "minutes": 3, "intro": "> 💡 idea\n\nA community of practice can look lightweight from the outside, but the useful version is a product. It needs a learning path, accessible tools, durable artifacts, and a way for people with different starting points to keep moving together.\n\nToday made that clear. The kickoff created momentum, then the practical constraints appeared immediately: access to training, Python and VS Code setup, authentication, package governance, and a shared place for recordings and resources.", "sections": {"theme": "The first machine learning and AI community session established a collaborative format, introduced foundational concepts, and connected the group to learning resources. The session was recorded, materials were organized in the shared channel, and the plan was to rotate facilitation as participation matured.\n\nWhat mattered most to me was the transition from presentation to operating model. The group was not just consuming a talk. It was beginning a sequence of reusable sessions with recordings, references, optional exercises, and discussion artifacts that could compound over time.\n\nI asked where I could help and focused on the layer that usually slows technical learning down: environment readiness. If people cannot authenticate to the course, install an editor, run Python, or obtain packages safely, the curriculum becomes secondary to support friction.", "fieldNotes": "Training access showed the first crack. Some participants needed invitations or a different sign-in path before they could reach the learning module. That was resolved for several users, but it demonstrated why access should be validated before the session rather than during it.\n\nThe developer workstation problem was more structural. Desktop support did not have a consistent process for Python and VS Code setup, while security controls and network behavior complicated dynamic package installation. A one-time global setup could help, but machine learning projects often require conflicting dependency versions. A single shared environment would eventually become brittle.\n\nI explored an internal package feed as one option, while also recognizing its storage and maintenance constraints. The more important design principle was to separate baseline tooling from project-specific dependencies. Standardize the editor, runtime, certificates, proxy configuration, and approved package sources. Keep each project isolated through reproducible environment definitions.\n\nI also started validating a pharmacy-focused predictive modeling idea with domain experts. The goal was not to force a model into a process. It was to test whether the problem, data, and operational constraints were real before investing in an evaluation pipeline.\n\nSeparately, I confirmed that licensed testers could access an existing Copilot Studio agent. That was implemented access, not model validation. The distinction matters because reaching the agent proves identity and licensing, not that the agent behaves correctly.", "moved": "- Helped launch a recorded, resource-backed machine learning and AI learning series.\n\n- Identified authentication and course-access friction early.\n\n- Advanced planning for repeatable Python and VS Code environment setup.\n\n- Explored a governed package-distribution pattern while documenting dependency risks.\n\n- Confirmed licensed tester access to an existing Copilot Studio agent.\n\n- Began domain validation for a predictive modeling concept before model development.", "pattern": "Treat technical enablement as a layered system. Layer one is identity and licenses. Layer two is a hardened baseline workstation. Layer three is an approved package source. Layer four is an isolated, versioned project environment. Layer five is the curriculum and evidence of learning.\n\nThe automation opportunity is a self-service bootstrap that verifies prerequisites, configures the baseline, creates a project environment from a lock file, runs health checks, and emits a diagnostic report. The same pipeline can support workshops, new hires, and production project onboarding.", "takeaways": "- Learning programs fail when setup friction is left to each learner.\n\n- Baseline tooling should be standardized, but project dependencies should be isolated.\n\n- Access validation and solution validation are different milestones.", "thread": "The group still needed a governed approach for package versions and a reliable setup path that would not slow future sessions."}, "moved": ["Helped launch a recorded, resource-backed machine learning and AI learning series.", "Identified authentication and course-access friction early.", "Advanced planning for repeatable Python and VS Code environment setup.", "Explored a governed package-distribution pattern while documenting dependency risks.", "Confirmed licensed tester access to an existing Copilot Studio agent.", "Began domain validation for a predictive modeling concept before model development."], "takeaways": ["Learning programs fail when setup friction is left to each learner.", "Baseline tooling should be standardized, but project dependencies should be isolated.", "Access validation and solution validation are different milestones."], "source": "journal/2026/06/02/2026-06-02.md"}, {"id": "2026-06-01-governance-starts-at-intake", "date": "2026-06-01", "title": "Governance Starts at Intake", "theme": "Make the request carry the architecture", "summary": "The hard part of an AI project is often not the model. It is turning an interesting idea into a request that can be reviewed, funded, secured, and supported without losing the reason it mattered in the first place.", "prompt": "What did you ship or move forward?", "types": ["idea", "win"], "projects": ["aigovernance", "copilotstudio", "governance", "architecture", "automation"], "words": 598, "minutes": 3, "intro": "> 💡 idea · ★ win\n\nThe hard part of an AI project is often not the model. It is turning an interesting idea into a request that can be reviewed, funded, secured, and supported without losing the reason it mattered in the first place.\n\nI spent today shaping several AI environment requests around that problem. The work was not glamorous, but it made the difference between a demo and something that could enter an enterprise delivery path.", "sections": {"theme": "I refined requests for dedicated Copilot Studio environments supporting internal knowledge retrieval, project reporting automation, and workforce learning. Each use case had a different audience, but the same underlying need: a clear business outcome, a bounded data scope, an authentication model, expected usage, licensing assumptions, and an accountable approval route.\n\nOne request focused on grounding a conversational assistant in internal documentation so technical staff could find unfamiliar support procedures faster. Another focused on standardizing project status reporting. A third established a controlled place to build and validate AI training experiences rather than asking a learning team to teach from theory alone.\n\nThe useful shift was treating intake as the first architecture artifact. A well-formed request should allow reviewers to understand what is being built, who can access it, what data it touches, how it will be licensed, and what success looks like.", "fieldNotes": "The first friction point was language. Team names and organizational labels were inconsistent, which matters when environment names, groups, ownership, and support routing depend on them. I validated the naming with people closer to the operating model instead of encoding a guess into the platform.\n\nThe second friction point was governance routing. The Microsoft 365 approval path was visible, but the broader enterprise AI review path was less formal. I surfaced that gap directly and moved the requests toward the appropriate steering and platform reviews without pretending the process was more mature than it was.\n\nLicensing also needed to be explicit. The learning environment request called out that builders and users should have appropriate licenses rather than relying on an undefined consumption model. That turns cost and access from late surprises into design constraints.\n\nI also pushed a domain and DNS dependency into discovery for a separate application effort. That question belonged early because a missing network prerequisite can invalidate an otherwise complete design.\n\nAutomated platform alerts reported successful data loads with row-count mismatches. I treated those as supporting context, not completed work. They reinforced a broader point: a green status at the top does not remove the need to inspect exceptions underneath.", "moved": "- Refined multiple AI use cases into reviewable environment requests with explicit value, audience, access, and data considerations.\n\n- Validated naming assumptions before they became resource conventions.\n\n- Routed requests toward both platform and enterprise AI governance.\n\n- Made licensing and environment separation part of the initial design.\n\n- Identified domain and DNS validation as an early dependency for a separate application path.", "pattern": "Use one intake contract for every AI solution. Capture the problem, expected outcome, users, data classification, access channel, authentication, integrations, environments, licensing, evaluation method, owner, and support model.\n\nThe future state is an event-driven intake pipeline. A structured request should generate the architecture record, risk review, environment specification, security groups, backlog items, and approval evidence from the same source of truth.\n\nThat is how intake stops being paperwork and becomes executable governance.", "takeaways": "- A request is stronger when it carries the architecture reviewers need.\n\n- Naming is infrastructure when it drives ownership and provisioning.\n\n- Licensing, identity, and network dependencies belong in discovery.", "thread": "The enterprise AI review path still needed a more formal, repeatable intake mechanism that could scale with demand."}, "moved": ["Refined multiple AI use cases into reviewable environment requests with explicit value, audience, access, and data considerations.", "Validated naming assumptions before they became resource conventions.", "Routed requests toward both platform and enterprise AI governance.", "Made licensing and environment separation part of the initial design.", "Identified domain and DNS validation as an early dependency for a separate application path."], "takeaways": ["A request is stronger when it carries the architecture reviewers need.", "Naming is infrastructure when it drives ownership and provisioning.", "Licensing, identity, and network dependencies belong in discovery."], "source": "journal/2026/06/01/2026-06-01.md"}, {"id": "2026-05-29-standards-should-execute", "date": "2026-05-29", "title": "Standards Should Execute", "theme": "Move quality checks left", "summary": "A standard that depends entirely on a reviewer remembering every rule will eventually become inconsistent. Today I started reframing reporting standards as something software could evaluate.", "prompt": "Who did you help, or who helped you?", "types": ["idea", "win", "experiment"], "projects": ["qualityengineering", "powerbi", "quality", "automation", "mlops"], "words": 526, "minutes": 2, "intro": "> 💡 idea · ★ win · ⚗ experiment\n\nA standard that depends entirely on a reviewer remembering every rule will eventually become inconsistent. Today I started reframing reporting standards as something software could evaluate.", "sections": {"theme": "I accepted a new automation concept for Power BI quality review. The idea was to inspect a report or semantic model against an agreed standards list and return interactive guidance to the developer. The goal was not to replace judgment. It was to remove repetitive checks and make the expected corrections visible earlier.\n\nThe work was still in discovery. Standards for semantic models and data loading were being assembled, and the automation needed its own tracked work item connected to the broader continuous-improvement effort. I did not call the checker implemented.", "fieldNotes": "The concept aligned closely with another metadata-enrichment effort. Both systems needed controlled rules, evidence from the artifact, and a response that distinguishes confirmed findings from recommendations. Starting with a clean contract was more important than reusing code prematurely.\n\nThe AI intake process also received another round of feedback. An early requestor completed the business portion but could not confidently answer the platform configuration questions. That validated the proposed split between requestor intent and governance execution. The request also needed executive sponsorship before review.\n\nA deployment pipeline for a separate web application advanced to a new failure. The service principal appeared to need additional access at the resource-group layer, and the application owner escalated the permission question. The evidence supports that the blocker was identified and routed. It does not support that deployment completed.\n\nI also explored how structured source formats might affect the legal agent. A colleague suggested comparing PDF, Markdown, and JSON representations with a small, domain-authored question set. That was a strong evaluation idea because it converted a format preference into a controlled experiment. It remained explored, not validated.\n\nPreparation for the first machine learning community session continued, and discovery around a clinical risk model raised basic questions about how the score had been designed. I treated those questions as a reminder to understand lineage, intended use, and intervention timing before attempting to extend a predictive model.", "moved": "- Defined a concept for automated Power BI standards checking and developer guidance.\n\n- Separated the checker into its own tracked enhancement connected to broader standards work.\n\n- Validated that governance-owned fields should be removed from the requestor-facing intake.\n\n- Identified and routed a service-principal permission blocker in an Azure DevOps deployment.\n\n- Explored a controlled comparison of PDF, Markdown, and JSON grounding formats.\n\n- Advanced preparation for a machine learning community session.", "pattern": "Express standards as machine-readable rules with identifiers, severity, evidence requirements, remediation guidance, and exceptions. Run the rules before peer review and return findings in a stable schema.\n\nThe future state is continuous quality enforcement. Commits trigger artifact inspection, deterministic checks run first, AI explains complex findings second, and reviewers focus on judgment rather than mechanical compliance.", "takeaways": "- Standards create more value when they can be tested automatically.\n\n- Suggestions about model inputs should become experiments, not opinions.\n\n- A new deployment error is progress only when it narrows the blocker.", "thread": "The standards checker still needed an authoritative rule set, artifact access method, and evaluation plan."}, "moved": ["Defined a concept for automated Power BI standards checking and developer guidance.", "Separated the checker into its own tracked enhancement connected to broader standards work.", "Validated that governance-owned fields should be removed from the requestor-facing intake.", "Identified and routed a service-principal permission blocker in an Azure DevOps deployment.", "Explored a controlled comparison of PDF, Markdown, and JSON grounding formats.", "Advanced preparation for a machine learning community session."], "takeaways": ["Standards create more value when they can be tested automatically.", "Suggestions about model inputs should become experiments, not opinions.", "A new deployment error is progress only when it narrows the blocker."], "source": "journal/2026/05/29/2026-05-29.md"}, {"id": "2026-05-28-turn-intake-into-an-interface", "date": "2026-05-28", "title": "Turn Intake Into an Interface", "theme": "Ask each role only what it can answer", "summary": "A comprehensive intake form can still be a bad interface. Today the process became more useful when I separated what requestors know from what governance must decide.", "prompt": "What's the next smallest step?", "types": ["learning"], "projects": ["governance", "powerplatform", "intake", "automation", "developerexperience"], "words": 470, "minutes": 2, "intro": "A comprehensive intake form can still be a bad interface. Today the process became more useful when I separated what requestors know from what governance must decide.", "sections": {"theme": "I reviewed the emerging Copilot Studio intake process with the platform group and with an early requestor. The draft had accumulated more than a hundred lines covering business justification, risk, environments, connectors, roles, licensing, and operational controls.\n\nThe breadth was useful for governance, but it was too much for a person describing a use case. Direct feedback identified the right split: requestors should provide the problem, value, audience, data sensitivity, access needs, expected scale, and sponsorship. Governance should translate that into environments, groups, policies, connectors, roles, and approval routing.", "fieldNotes": "The baseline review also surfaced workload design. Several project environments were expected, each potentially requiring development, test, and production stages. I asked whether provisioning should be handled in batches or incrementally and checked that the implementation workload was manageable.\n\nThat conversation led naturally toward automation. Repeating the same environment setup many times is a signal that the process should become a parameterized script or pipeline. Before automating it, I wanted the end-to-end procedure documented and the intake fields stable.\n\nThe same day exposed two useful technical failures. A Power BI application displaying stale-year data was removed and reinstalled, after which refreshed data became visible. The initial refresh had no convenient status page and could take an unpredictable amount of time, which made observability part of the support problem.\n\nA separate Azure DevOps deployment failed with a bad archive after environment approvals were corrected. I did not mark the application deployed. The pipeline and approval path were implemented, but the build artifact still needed correction.\n\nFor the legal agent, I restored visibility after a configuration had been inadvertently flipped. Reviewers confirmed the agent appeared again. Additional licenses were still pending for other testers.", "moved": "- Refined the AI intake process through platform and requestor feedback.\n\n- Identified a clean boundary between requestor inputs and governance-owned configuration.\n\n- Advanced planning for repeated environment provisioning and automation.\n\n- Restored test-agent visibility after correcting an access configuration.\n\n- Validated refreshed Power BI data after an application reinstall.\n\n- Advanced an Azure DevOps pipeline through approvals, while preserving the failed archive as unresolved.", "pattern": "Use a two-stage intake. Stage one captures intent in plain language. Stage two converts intent into an architecture and control plan through deterministic rules and governance review.\n\nThe automation opportunity is a request compiler. A validated intake record should generate names, security groups, environment definitions, policy assignments, approval tasks, and a provisioning plan without making the requestor understand the platform internals.", "takeaways": "- Comprehensive does not mean usable.\n\n- Governance configuration should be derived from intent where possible.\n\n- Provisioning automation should follow a stable, documented contract.", "thread": "The process still needed a smaller requestor-facing form and an idempotent provisioning implementation."}, "moved": ["Refined the AI intake process through platform and requestor feedback.", "Identified a clean boundary between requestor inputs and governance-owned configuration.", "Advanced planning for repeated environment provisioning and automation.", "Restored test-agent visibility after correcting an access configuration.", "Validated refreshed Power BI data after an application reinstall.", "Advanced an Azure DevOps pipeline through approvals, while preserving the failed archive as unresolved."], "takeaways": ["Comprehensive does not mean usable.", "Governance configuration should be derived from intent where possible.", "Provisioning automation should follow a stable, documented contract."], "source": "journal/2026/05/28/2026-05-28.md"}, {"id": "2026-05-27-access-is-part-of-the-release", "date": "2026-05-27", "title": "Access Is Part of the Release", "theme": "Validate the permission path end to end", "summary": "The agent existed in test, but the link, environment role, agent visibility, and edit permissions did not behave as one clean unit. That friction was not separate from deployment. It was the deployment.", "prompt": "What would future-you want to know?", "types": ["win"], "projects": ["identity", "copilotstudio", "security", "leastprivilege", "testing"], "words": 500, "minutes": 2, "intro": "The agent existed in test, but the link, environment role, agent visibility, and edit permissions did not behave as one clean unit. That friction was not separate from deployment. It was the deployment.", "sections": {"theme": "I tested access with actual reviewers instead of assuming that environment membership was enough. One reviewer could open Copilot Studio and select the test environment manually but could not see the agent through the direct link. Extending access to the individual agent made the link work and exposed the next layer of behavior.\n\nThe test showed that environment access and agent access were separate controls. It also showed that an editor-level assignment could expose the asset while saving changes still failed. I did not interpret that failure as proof of a specific platform limitation. I recorded it as observed behavior requiring further investigation.", "fieldNotes": "The useful path was iterative. First, verify the user can select the environment. Second, verify the agent appears. Third, verify the direct link resolves. Fourth, test whether the assigned role permits viewing or editing. Each check isolated a different failure surface.\n\nThe same day, I shared that the first source-code commit and first development-to-test pipeline deployment had been completed for the legal agent. Licensing for additional stakeholders remained a blocker. I kept access provisioning separate from solution quality because a license can make the agent visible without proving that the answers are correct.\n\nI also expanded an intake template for future Copilot Studio requests. The draft captured business value, audience, data sensitivity, access channel, authentication, user volume, external sharing, security groups, environments, data-loss prevention, connectors, roles, and licensing. The template was intentionally broad, but early feedback suggested that requestors should not have to answer governance-owned configuration questions.\n\nA discussion with the AI adoption group also clarified the evaluation constraint. The workflow depended on uploaded files, while the available automated prompt evaluation did not represent that complete path. Domain reviewers would therefore remain central to acceptance testing.", "moved": "- Validated that environment access and agent access were separate permission layers.\n\n- Restored reviewer visibility to the test agent after an access configuration had changed.\n\n- Confirmed the direct link worked after the agent-level assignment was corrected.\n\n- Completed the first source-code commit and development-to-test pipeline deployment for the agent.\n\n- Expanded the future intake model for environments, security, licensing, and risk.\n\n- Documented file-upload evaluation as a remaining testing constraint.", "pattern": "Build an access test matrix for every promoted solution. Test identity, license, environment membership, application visibility, direct links, read actions, write actions, and administrative actions independently.\n\nAutomate the matrix where possible and run it after every deployment. A release should not be considered ready when the artifact arrives. It is ready when intended users can complete the intended actions with least privilege.", "takeaways": "- Environment access does not guarantee application access.\n\n- Visibility and editability are different permission tests.\n\n- Licensing readiness and behavioral acceptance are separate gates.", "thread": "The role combination needed further hardening so reviewers could use the agent without receiving unnecessary editing privileges."}, "moved": ["Validated that environment access and agent access were separate permission layers.", "Restored reviewer visibility to the test agent after an access configuration had changed.", "Confirmed the direct link worked after the agent-level assignment was corrected.", "Completed the first source-code commit and development-to-test pipeline deployment for the agent.", "Expanded the future intake model for environments, security, licensing, and risk.", "Documented file-upload evaluation as a remaining testing constraint."], "takeaways": ["Environment access does not guarantee application access.", "Visibility and editability are different permission tests.", "Licensing readiness and behavioral acceptance are separate gates."], "source": "journal/2026/05/27/2026-05-27.md"}, {"id": "2026-05-26-promote-the-agent-not-the-chaos", "date": "2026-05-26", "title": "Promote the Agent, Not the Chaos", "theme": "Separate iteration from validation", "summary": "The fastest way to make an AI agent fragile is to let development, testing, permissions, and stakeholder feedback happen in the same place. Today I demonstrated a more disciplined path.", "prompt": "What's worth remembering about today?", "types": ["learning"], "projects": ["agentlifecycle", "copilotstudio", "alm", "azuredevops", "evaluation"], "words": 418, "minutes": 2, "intro": "The fastest way to make an AI agent fragile is to let development, testing, permissions, and stakeholder feedback happen in the same place. Today I demonstrated a more disciplined path.", "sections": {"theme": "I walked stakeholders through a formal lifecycle for a contract-focused Copilot Studio agent. The working pattern used separate development and test environments, a managed solution, and a pipeline that promoted the agent forward. That separation allowed technical iteration to continue without changing the version under review.\n\nThe demonstration mattered because the agent was no longer just a prompt in a builder interface. It had a deployment path and a controlled place for user acceptance testing. I also granted the meeting participants basic privileges in the test environment so they could begin exercising the agent.", "fieldNotes": "The architecture was intentionally simple. Builders worked in development. The managed solution moved through a pipeline into test. Stakeholders evaluated the test version. Production remained a future state rather than an implied accomplishment.\n\nThat distinction created cleaner feedback. Reviewers could compare the agent's contract findings with their approved standards while development continued in parallel. The pipeline became the boundary between experimentation and evidence.\n\nA separate discussion identified a useful external input: recordings from commercial contract-lifecycle demonstrations. I treated those as discovery material, not validation of our own implementation. Reviewing another product can expose gaps, but it cannot replace testing the specific behavior we built.\n\nAutomated data-platform notifications also reported successful jobs with row-count mismatches. Those messages were supporting context only. I did not treat them as work I completed. They reinforced the same lesson: a top-level success label can hide unresolved exceptions.", "moved": "- Demonstrated a development-to-test deployment pipeline for a Copilot Studio agent.\n\n- Implemented a separate test environment for stakeholder validation.\n\n- Granted basic test privileges to the participating reviewers.\n\n- Established parallel development and user testing as the working lifecycle.\n\n- Identified external product recordings as discovery inputs without overstating their value.", "pattern": "Package agents as managed, versioned artifacts. Promote them through development, test, and production with explicit approvals. Bind each stage to a role model, evaluation set, and rollback point.\n\nThe future state is a release pipeline that runs agent evaluations, checks solution dependencies, validates environment permissions, records approval evidence, and blocks promotion when required controls fail.", "takeaways": "- A test environment protects both reviewers and builders.\n\n- A pipeline is a governance control, not just deployment convenience.\n\n- External demos inform discovery but do not validate internal behavior.", "thread": "The agent still needed broader user acceptance results and a proven production promotion path."}, "moved": ["Demonstrated a development-to-test deployment pipeline for a Copilot Studio agent.", "Implemented a separate test environment for stakeholder validation.", "Granted basic test privileges to the participating reviewers.", "Established parallel development and user testing as the working lifecycle.", "Identified external product recordings as discovery inputs without overstating their value."], "takeaways": ["A test environment protects both reviewers and builders.", "A pipeline is a governance control, not just deployment convenience.", "External demos inform discovery but do not validate internal behavior."], "source": "journal/2026/05/26/2026-05-26.md"}, {"id": "2026-05-22-a-green-run-is-not-a-deployment", "date": "2026-05-22", "title": "A Green Run Is Not a Deployment", "theme": "Validate the side effect, not the pipeline label", "summary": "I thought a new pipeline was deploying to development. The run looked promising, but the expected web application and function steps were missing. The useful outcome was catching that gap before calling the work complete.", "prompt": "What blocked you today?", "types": ["win"], "projects": ["cicd", "azuredevops", "observability", "sharepoint"], "words": 517, "minutes": 2, "intro": "I thought a new pipeline was deploying to development. The run looked promising, but the expected web application and function steps were missing. The useful outcome was catching that gap before calling the work complete.", "sections": {"theme": "I configured an Azure DevOps pipeline for an application with development and test approval gates. The production stage remained commented out while the owner gained confidence in the lower environments. That was the correct safety posture.\n\nI initially reported that the first development deployment had occurred. On closer inspection, the run did not appear to execute the expected deployment steps. I corrected the status immediately and asked the application owner to review the code when available.\n\nThe distinction matters. A pipeline run can succeed at parsing, building, or reaching a gate without changing the target service. Deployment evidence must include the intended stage, target, artifact, and validation result.", "fieldNotes": "The pipeline architecture intentionally separated development, test, and production. Approval gates were assigned to the application owner so promotion would not depend on one central engineer. Production also required additional thinking around backup and recovery, so leaving it disabled was an explicit control rather than unfinished cleanup.\n\nThe failure was observability. I expected to see deployment activity for both the web application and function, but the run did not show those steps. That suggested the YAML path, conditions, stage wiring, or template invocation still needed review. The available evidence does not identify which cause was responsible, so I did not speculate in the final record.\n\nA separate solution-catalog thread exposed another environment risk. A development SharePoint list had been deleted, while the production list was still connected to ETL automation. The team discussed refreshing production data into development before schema work, with a strong requirement not to disrupt existing automation. No automated refresh was completed in the evidence I found.\n\nThe organizational Azure DevOps boards were also transitioned to new area paths. I received notification that the transition was complete and that saved links and personal queries might need updates. I kept that as supporting context because the transition was completed by others.", "moved": "- Implemented a multi-stage Azure DevOps pipeline structure with development and test approval gates.\n\n- Kept production deployment disabled during lower-environment validation.\n\n- Corrected an initial deployment claim after expected application steps were not visible.\n\n- Identified deployment observability as a requirement for the next iteration.\n\n- Documented the need for a safe production-to-development data refresh before catalog schema changes.\n\n- Preserved existing production ETL automation as a non-negotiable dependency.", "pattern": "Define deployment as a verified state transition. The pipeline should emit the artifact version, target environment, executed steps, resource changes, smoke-test result, approver, and rollback reference.\n\nThe automation opportunity is a post-deployment evidence job that queries the target resources, verifies expected versions and health checks, and publishes a deterministic release manifest. A green pipeline without that evidence remains incomplete.", "takeaways": "- A successful run is not proof of deployment.\n\n- Production gates should remain closed until recovery and validation are explicit.\n\n- Development refreshes must protect production-connected automation.", "thread": "The pipeline still needed corrected stage execution and verified deployment of both application components."}, "moved": ["Implemented a multi-stage Azure DevOps pipeline structure with development and test approval gates.", "Kept production deployment disabled during lower-environment validation.", "Corrected an initial deployment claim after expected application steps were not visible.", "Identified deployment observability as a requirement for the next iteration.", "Documented the need for a safe production-to-development data refresh before catalog schema changes.", "Preserved existing production ETL automation as a non-negotiable dependency."], "takeaways": ["A successful run is not proof of deployment.", "Production gates should remain closed until recovery and validation are explicit.", "Development refreshes must protect production-connected automation."], "source": "journal/2026/05/22/2026-05-22.md"}, {"id": "2026-05-21-agents-need-a-platform-shape", "date": "2026-05-21", "title": "Agents Need a Platform Shape", "theme": "Design the factory before multiplying agents", "summary": "A list of interesting agents can create momentum, but it can also create a collection of disconnected experiments. Today I focused on the platform shape underneath the ideas.", "prompt": "What did you ship or move forward?", "types": ["win"], "projects": ["agentarchitecture", "azureaifoundry", "copilotstudio", "platformengineering", "mlops"], "words": 530, "minutes": 2, "intro": "A list of interesting agents can create momentum, but it can also create a collection of disconnected experiments. Today I focused on the platform shape underneath the ideas.", "sections": {"theme": "In a transcribed planning session, I outlined the lightweight Microsoft 365 agent path already under technology review and contrasted it with broader capabilities that would require Azure AI Foundry or Copilot Studio. The practical conclusion was that one surface would not satisfy every use case.\n\nThe discussion covered personalization, executive preferences, meeting intelligence, action tracking, workload assessment, early warning, strategic context, and domain-specific support. These remained candidate capabilities. The concrete work was defining the environment, security, deployment, and governance path needed to explore them safely.\n\nI proposed separate development, test, and production environments for the executive agent effort, a dedicated security group, managed environments, and a data-loss prevention policy. I also accepted actions to share the Azure memory capability, become more familiar with the Foundry deployment resources, clarify governance controls, and establish a formal pipeline with source control and quality gates.", "fieldNotes": "The strongest architecture decision was to separate modeling from orchestration. For predictive use cases, Copilot could be the interface or orchestration layer, while the model and its evaluation infrastructure remained independently governed. That prevents a conversational surface from becoming an unexamined modeling system.\n\nMeeting transcripts introduced another constraint. The desired experience was centralizing meeting information and creating actions without adding manual work, but transcript data was not readily available through the path being discussed. A clipboard-based workaround was considered. I treated it as exploration because the product surface was changing frequently and a temporary workaround could become unnecessary.\n\nA stale Power BI usage report also demonstrated the difference between a claimed fix and user validation. The report owner believed the refresh had been corrected, but the user still saw no current-year data after refreshing. I kept the issue open because the observed result did not match the expected state.\n\nThe machine learning community work advanced in parallel. Initial session content was prepared, facilitation roles were being considered, and a dedicated collaboration space and shared repository were proposed. That was planning evidence, not a completed launch.", "moved": "- Defined a multi-platform path for lightweight and advanced agent capabilities.\n\n- Proposed isolated development, test, and production environments with dedicated security controls.\n\n- Established source control, quality gates, and deployment stages as requirements for every agent.\n\n- Clarified that predictive models should remain separate from the Copilot orchestration layer.\n\n- Preserved a stale-report issue after user validation contradicted the expected fix.\n\n- Advanced planning for a reusable machine learning learning community and shared repository.", "pattern": "Build an agent factory with capability routing. Use the lightest platform that meets the requirement, but enforce shared controls for identity, data access, evaluation, deployment, telemetry, and retirement.\n\nA routing record should explain why a use case belongs in Microsoft 365 agents, Copilot Studio, or Azure AI Foundry. The same record can generate environment requests, security groups, repository scaffolding, and review tasks.", "takeaways": "- Agent ideas should inherit a common lifecycle.\n\n- The conversational layer should not silently become the predictive model.\n\n- User-observed behavior outranks an assumed fix.", "thread": "The platform routing criteria, tenant-level Foundry controls, and transcript integration path still needed validation."}, "moved": ["Defined a multi-platform path for lightweight and advanced agent capabilities.", "Proposed isolated development, test, and production environments with dedicated security controls.", "Established source control, quality gates, and deployment stages as requirements for every agent.", "Clarified that predictive models should remain separate from the Copilot orchestration layer.", "Preserved a stale-report issue after user validation contradicted the expected fix.", "Advanced planning for a reusable machine learning learning community and shared repository."], "takeaways": ["Agent ideas should inherit a common lifecycle.", "The conversational layer should not silently become the predictive model.", "User-observed behavior outranks an assumed fix."], "source": "journal/2026/05/21/2026-05-21.md"}, {"id": "2026-05-20-measure-useful-change", "date": "2026-05-20", "title": "Measure Useful Change", "theme": "Build the measurement path with the product", "summary": "Adoption counts can show activity, but they do not prove that a system improved anything. Today the conversation moved toward measures that could connect AI usage to outcomes without pretending uncertain numbers were hard facts.", "prompt": "What are you working on?", "types": ["win"], "projects": ["measurement", "powerbi", "copilot", "analytics", "governance"], "words": 521, "minutes": 2, "intro": "Adoption counts can show activity, but they do not prove that a system improved anything. Today the conversation moved toward measures that could connect AI usage to outcomes without pretending uncertain numbers were hard facts.", "sections": {"theme": "In a transcribed leadership checkpoint, we discussed automating Copilot metrics reporting rather than repeatedly assembling it by hand. The available data lived across the Copilot dashboard and administrative surfaces. The desired future state was a Power BI report that could refresh and remain accessible to leaders.\n\nThe more important decision was conceptual. The team wanted to distinguish hard measures from directional estimates and to define which metrics were meaningful before automating them. Actions per user, usage patterns, and time-saving estimates can support a story, but they need transparent definitions and appropriate caveats.\n\nThe legal agent also moved closer to structured testing. I was assigned to notify reviewers that the test environment was ready and request feedback. That was an activation step, not proof that testing had been completed.", "fieldNotes": "The metrics discussion exposed a common anti-pattern: automate collection first and decide what the numbers mean later. I wanted the inverse. Define the decision the measure supports, specify the source and refresh behavior, then build the pipeline.\n\nA long-term reporting design should preserve provenance for every metric. If a number comes from an administration dashboard, a manual classification, or an estimate, the report should say so. That makes the output useful without overstating precision.\n\nThe same checkpoint included an open production-path question for AI agents. Test readiness was visible, but the required sign-off for production still needed clarification. That governance gap belonged in the delivery plan, not outside it.\n\nA separate strategy artifact described the data-science role as structured learning from engagements, impact evaluation, and a catalog of proven strategies. I treated that as a direction for discussion rather than an approved operating model. It strengthened the throughline: measure causal or operational change where possible, not merely platform activity.\n\nAutomated data-load alerts reported failures and mismatches on the same date. They were supporting context only. They illustrate why any executive metric needs health, freshness, and exception indicators before it can be trusted.", "moved": "- Defined a direction for automated Copilot usage reporting in Power BI.\n\n- Advanced the distinction between hard metrics and directional estimates.\n\n- Identified source, refresh, and accessibility as requirements for leadership reporting.\n\n- Moved the legal agent into the reviewer-notification phase of user acceptance testing.\n\n- Preserved the unresolved production approval path as a delivery dependency.\n\n- Connected AI adoption measurement to broader impact-evaluation thinking.", "pattern": "Create a metric contract before creating the dashboard. For each measure, define its decision purpose, source, owner, calculation, refresh cadence, data quality checks, uncertainty, audience, and retirement rule.\n\nThe automation opportunity is a governed metrics pipeline that retrieves approved data, validates freshness, calculates transparent measures, and publishes bot
