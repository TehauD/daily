h the result and its provenance. Exceptions should be visible beside the headline number.", "takeaways": "- Activity is not impact.\n\n- Estimated value must be labeled differently from observed outcomes.\n\n- Measurement architecture should be designed before dashboard automation.", "thread": "The metric definitions and production approval path still needed accountable owners and explicit acceptance criteria."}, "moved": ["Defined a direction for automated Copilot usage reporting in Power BI.", "Advanced the distinction between hard metrics and directional estimates.", "Identified source, refresh, and accessibility as requirements for leadership reporting.", "Moved the legal agent into the reviewer-notification phase of user acceptance testing.", "Preserved the unresolved production approval path as a delivery dependency.", "Connected AI adoption measurement to broader impact-evaluation thinking."], "takeaways": ["Activity is not impact.", "Estimated value must be labeled differently from observed outcomes.", "Measurement architecture should be designed before dashboard automation."], "source": "journal/2026/05/20/2026-05-20.md"}, {"id": "2026-05-19-the-first-promotion-changes-the-work", "date": "2026-05-19", "title": "The First Promotion Changes the Work", "theme": "Make the lifecycle real early", "summary": "The first source-control commit and the first development-to-test promotion changed the nature of the agent. It was no longer only a configuration inside a builder. It had become a versioned artifact with a path forward.", "prompt": "Who did you help, or who helped you?", "types": ["win", "idea"], "projects": ["agentlifecycle", "copilotstudio", "azuredevops", "alm", "architecture"], "words": 533, "minutes": 2, "intro": "The first source-control commit and the first development-to-test promotion changed the nature of the agent. It was no longer only a configuration inside a builder. It had become a versioned artifact with a path forward.", "sections": {"theme": "I committed the contract-focused Copilot Studio agent to Azure DevOps and completed its first pipeline deployment from development into test. That was the strongest evidence of progress today because it created a repeatable boundary between building and evaluation.\n\nA required connector was also added to the default Copilot Studio data-loss prevention policy. That removed a platform blocker at useful timing, but I kept the two accomplishments distinct. The policy change enabled the capability. The pipeline promotion established the application lifecycle.\n\nI also worked through a transition conversation that clarified where my long-term contribution should remain focused: enterprise AI architecture, reusable automation patterns, deployment discipline, governance, and cross-domain solution design. The useful part was not the role language. It was recognizing that these projects need shared infrastructure more than isolated heroics.", "fieldNotes": "The first promotion did not prove production readiness. It proved that the agent could be represented in source control and moved into a test boundary. Stakeholders still needed access, licensing, evaluation guidance, and expected outputs before testing could produce useful evidence.\n\nI continued shaping a pharmacy supply-chain modeling idea around external signals, existing internal data, and advance warning of material constraints. The discussion reinforced that external data ingestion could be a reusable learning case, but the model concept remained exploratory. I did not treat a positive reaction as validation.\n\nA separate support question exposed how difficult it can be to locate a Power App when only its informal purpose is known. The search surface was limited, so I asked for the likely developer and clarified the business term. The application was eventually identified by someone with domain context. That was a small but useful reminder that application catalogs need aliases, owners, business capabilities, and support contacts.\n\nAutomated pull-request and data-platform notifications were abundant. I treated them as context, not personal accomplishments. Being copied on activity is not the same as reviewing, fixing, or shipping it.", "moved": "- Completed the first source-control commit for a Copilot Studio agent.\n\n- Completed the first pipeline promotion from development into test.\n\n- Removed a connector-policy blocker through the approved platform control.\n\n- Clarified the long-term focus on reusable AI architecture and automation patterns.\n\n- Advanced discovery for a predictive supply-chain use case without overstating validation.\n\n- Helped narrow an application lookup through business terminology and ownership context.", "pattern": "Put the lifecycle in place before the solution feels finished. Source control, managed packaging, environment separation, approvals, and test access should arrive early enough to shape how the team builds.\n\nThe future state is a standard agent repository that includes solution source, environment configuration, evaluation cases, deployment gates, access tests, and release evidence. New agents should inherit that structure rather than rebuild it.", "takeaways": "- The first promotion is an architecture milestone, not a production release.\n\n- Platform policy and application lifecycle are separate controls.\n\n- A solution catalog needs business aliases and ownership metadata.", "thread": "The test environment still needed stakeholder validation and clear acceptance criteria before the agent could move further."}, "moved": ["Completed the first source-control commit for a Copilot Studio agent.", "Completed the first pipeline promotion from development into test.", "Removed a connector-policy blocker through the approved platform control.", "Clarified the long-term focus on reusable AI architecture and automation patterns.", "Advanced discovery for a predictive supply-chain use case without overstating validation.", "Helped narrow an application lookup through business terminology and ownership context."], "takeaways": ["The first promotion is an architecture milestone, not a production release.", "Platform policy and application lifecycle are separate controls.", "A solution catalog needs business aliases and ownership metadata."], "source": "journal/2026/05/19/2026-05-19.md"}, {"id": "2026-05-14-the-default-is-the-real-security-boundary", "date": "2026-05-14", "title": "The Default Is the Real Security Boundary", "theme": "Secure the common path before scaling the platform", "summary": "A platform can have dozens of security controls and still be unsafe if the default path is too permissive. Today was about reducing the amount of trust required from every future maker.", "prompt": "What did you learn?", "types": ["learning"], "projects": ["powerplatform", "copilotstudio", "security", "devops"], "words": 754, "minutes": 3, "intro": "A platform can have dozens of security controls and still be unsafe if the default path is too permissive. Today was about reducing the amount of trust required from every future maker.\n\nI worked through a Power Platform and Copilot Studio baseline review, including connector exposure, tenant isolation, agent permissions, authentication context, and deployment controls. The strongest lesson was simple: advanced capability should be available by request, not silently included in the baseline.", "sections": {"theme": "Connector policy is easy to discuss as an allow-or-block decision. In practice, the risk depends on what the connector can access, whether it preserves the user's identity, whether it can write data, and whether it crosses a trust boundary.\n\nI proposed removing advanced data and search connectors from the default baseline. They may be valuable, but they represent development-scale behavior and broader data movement. Requiring an explicit request creates a point where purpose, scope, ownership, and safeguards can be documented.\n\nThat choice creates more work for platform administration. I accepted that tradeoff because convenience at provisioning time can become ambiguity during an incident. The default should support common low-risk scenarios. Elevated capabilities should leave an intentional trail.", "fieldNotes": "We tested agent role behavior rather than relying only on labels in the administration interface. End-user access could be granted, while editor and transcript-oriented roles remained restricted without the required environment privileges. That was an important validation. The effective control was tighter than the initial discussion assumed.\n\nThe test reinforced a broader rule: permission design should be verified through actual role transitions. Documentation and control names can suggest a boundary, but only a representative access test confirms what a user can do.\n\nTenant isolation emerged as a practical control for preventing Power Platform connectors from moving data across tenant boundaries. The group agreed it was a strong security improvement, while still recognizing that existing integrations must be considered before enforcement.\n\nAgent sharing was less settled. Sharing to broad groups is manageable when an agent only uses delegated user access. It becomes more consequential when an agent holds application-level rights or invokes a custom connector backed by a token, secret, or service identity. The sharing model needs to reflect the authentication model.\n\nI also set up the first deployment pipeline for an agent and connected the initial commit to source control. The target was a staged move into a test environment where domain reviewers could evaluate accuracy. That work linked two concerns that are often separated: secure platform governance and repeatable application delivery.\n\nA pipeline does not make an agent safe by itself. It does make changes visible, environments distinct, and promotion repeatable. Those properties create the foundation for testing, rollback, and approval gates.\n\nThe authentication discussion exposed a useful dividing line. Delegated connections typically constrain the agent to the user's permissions. Custom APIs and application identities can exceed that boundary. They are not automatically wrong, but they need stronger review, narrower permissions, and more deliberate sharing controls.", "moved": "- Advanced connectors were removed from the proposed default baseline and shifted toward explicit approval.\n\n- Tenant isolation was selected as a security control worth enabling.\n\n- Agent access roles were tested and validated against actual permission behavior.\n\n- Risks around broad agent sharing and application-level identities were documented.\n\n- The first agent deployment pipeline was implemented with source control as the starting point.\n\n- A staged evaluation path was established through a non-production environment.", "pattern": "Define a low-risk baseline, then make exceptions explicit. Separate connectors by capability, data movement, write access, and authentication context. Test permissions with representative users. Keep development, test, and production distinct. Promote through source control and a repeatable pipeline.\n\nFor agent platforms, add one more layer: pair the sharing policy with the identity model. A broadly shared agent using delegated access is not equivalent to a broadly shared agent holding application permissions.\n\nThe future state is policy-driven provisioning. Environment creation, connector assignment, security groups, deployment pipelines, logging, and evaluation gates should be generated from a versioned configuration instead of assembled manually.", "takeaways": "- Defaults scale faster than documentation, so defaults deserve the strongest design attention.\n\n- Advanced connectors should require an explicit purpose and owner.\n\n- Permission labels are not evidence. Test the actual access path.\n\n- Source control and environment promotion are governance controls as well as engineering practices.\n\n- Agent sharing cannot be evaluated separately from connector authentication.", "thread": "The remaining work is to test third-party connector authentication, decide how group sharing should change for agents with elevated rights, and convert the baseline decisions into a versioned, repeatable provisioning standard."}, "moved": ["Advanced connectors were removed from the proposed default baseline and shifted toward explicit approval.", "Tenant isolation was selected as a security control worth enabling.", "Agent access roles were tested and validated against actual permission behavior.", "Risks around broad agent sharing and application-level identities were documented.", "The first agent deployment pipeline was implemented with source control as the starting point.", "A staged evaluation path was established through a non-production environment."], "takeaways": ["Defaults scale faster than documentation, so defaults deserve the strongest design attention.", "Advanced connectors should require an explicit purpose and owner.", "Permission labels are not evidence. Test the actual access path.", "Source control and environment promotion are governance controls as well as engineering practices.", "Agent sharing cannot be evaluated separately from connector authentication."], "source": "journal/2026/05/14/2026-05-14.md"}, {"id": "2026-05-12-human-authority-has-to-be-part-of-the-architecture", "date": "2026-05-12", "title": "Human Authority Has to Be Part of the Architecture", "theme": "Narrow the agent until it becomes trustworthy", "summary": "The most useful AI prototype is not the one that tries to finish the whole job. It is the one that removes the repetitive first pass while making the human decision easier to inspect.", "prompt": "What blocked you today?", "types": ["learning"], "projects": ["aiagents", "copilotstudio", "governance", "evaluation"], "words": 721, "minutes": 3, "intro": "The most useful AI prototype is not the one that tries to finish the whole job. It is the one that removes the repetitive first pass while making the human decision easier to inspect.\n\nToday I demonstrated a contract analysis agent built in Microsoft Copilot Studio. The hard part was not showing that a model could compare documents or summarize clauses. The hard part was defining where automation should stop.", "sections": {"theme": "Contract review is judgment-heavy, but much of the initial work is repetitive. A reviewer has to locate relevant sections, compare them with an approved template, identify deviations, and decide which differences deserve attention. An agent can accelerate that sequence, but it should not quietly become the authority.\n\nI framed the agent as an analysis assistant rather than an approval system. It surfaces differences and potential risks earlier, while the legal reviewer keeps control of interpretation and disposition. That boundary matters more than the sophistication of the prompt.\n\nThe demonstration moved through three levels of maturity. A manual prompt showed that the core comparison task was possible, but also exposed inconsistency and repeated setup. A custom agent added durable instructions, model controls, and a defined knowledge source. The next step is not more features. It is controlled evaluation with real examples in a non-production environment.", "fieldNotes": "The manual workflow was useful as a baseline because it revealed the cost of ad hoc prompting. The user had to provide the reference material, the contract, and the comparison instructions each time. Even when the output was helpful, the process was too dependent on prompt quality and human memory to be reliably reusable.\n\nGrounding the custom agent in an approved template changed the operating model. The reference document could be maintained in a governed content location, and the agent could use the current version without requiring a fresh upload for every review. That reduces friction, but it also creates a dependency on document ownership, update controls, and traceability.\n\nI also showed a single-document upload experience. Simplifying the interaction was important. The user should not need to assemble a bundle of prompts and reference files just to start an analysis. The agent should already know its purpose, its approved source, and the structure of the response.\n\nThe largest unresolved design question is template breadth. One agent can be taught to recognize multiple agreement types, but expanding too quickly risks ambiguous routing and inconsistent comparisons. The better path is to start with one template, establish an evaluation set, and only add document types after the failure modes are understood.\n\nAnother open question is coexistence with an incoming commercial tool. A useful proof of concept does not justify duplicating a platform capability. The agent needs a clear role, either as a focused bridge, an evaluation benchmark, or a reusable pattern for workflows the larger tool will not cover.", "moved": "- Demonstrated a custom contract analysis agent in Microsoft Copilot Studio.\n\n- Validated a simpler single-document review flow grounded in an approved reference template.\n\n- Established human review as the authority for legal interpretation and final decisions.\n\n- Defined an initial test scope around one contract template rather than broad document coverage.\n\n- Identified non-production evaluation as the next gate before any wider deployment.", "pattern": "Start with the repetitive comparison task, not the final decision. Ground the agent in a controlled reference source. Make the user interaction smaller than the manual process. Route the output to a human reviewer with enough structure to verify the result.\n\nThen evaluate against real examples before expanding scope. New templates should be treated like new model behaviors, with their own tests, expected outputs, and documented failure cases.\n\nThis pattern applies well beyond contracts. Policy review, standards mapping, technical intake, and structured document quality checks all benefit from the same architecture: narrow task, governed knowledge, inspectable output, human authority, and staged promotion.", "takeaways": "- A strong agent removes setup work without removing accountable judgment.\n\n- Reusable instructions and governed knowledge matter more than an impressive one-time prompt.\n\n- One well-evaluated template is more valuable than broad but ambiguous coverage.\n\n- Deployment environments are part of the product design, not an administrative afterthought.", "thread": "I need to turn the demonstration into an evaluation package with representative documents, expected findings, false-positive tracking, and explicit promotion criteria. I also need to define whether this agent complements or duplicates the larger legal technology roadmap."}, "moved": ["Demonstrated a custom contract analysis agent in Microsoft Copilot Studio.", "Validated a simpler single-document review flow grounded in an approved reference template.", "Established human review as the authority for legal interpretation and final decisions.", "Defined an initial test scope around one contract template rather than broad document coverage.", "Identified non-production evaluation as the next gate before any wider deployment."], "takeaways": ["A strong agent removes setup work without removing accountable judgment.", "Reusable instructions and governed knowledge matter more than an impressive one-time prompt.", "One well-evaluated template is more valuable than broad but ambiguous coverage.", "Deployment environments are part of the product design, not an administrative afterthought."], "source": "journal/2026/05/12/2026-05-12.md"}, {"id": "2026-05-08-a-correct-model-can-still-be-the-wrong-system", "date": "2026-05-08", "title": "A Correct Model Can Still Be the Wrong System", "theme": "Evaluate what users and operators actually experience", "summary": "Accuracy is an incomplete definition of success. A model can return the correct answer and still be too slow, too expensive, too opaque, or too brittle to use.", "prompt": "What's the next smallest step?", "types": ["experiment"], "projects": ["mlsystems", "machinelearning", "aiagents", "evaluation", "mlops"], "words": 689, "minutes": 3, "intro": "Accuracy is an incomplete definition of success. A model can return the correct answer and still be too slow, too expensive, too opaque, or too brittle to use.\n\nToday I studied evaluation patterns for AI and machine learning systems, with a focus on functional correctness, efficiency, continual learning, experiment tracking, and production validation. The throughline was that evaluation has to follow the system, not stop at the model output.", "sections": {"theme": "For code, SQL, and tool-using agents, functional correctness is necessary. It is not sufficient. A generated query can return the right result while consuming unreasonable memory or taking too long to run. An agent can select a valid tool but pass the wrong parameters. A plan can look coherent but violate the user's constraints.\n\nThese are different failure classes and they need different tests. Treating them as one accuracy score hides where the system actually breaks.\n\nThe same applies after deployment. A stationary test set cannot explain how a model behaves when live data changes. Continual learning is largely an infrastructure problem because retraining, validation, rollout, observation, and rollback must all work together.", "fieldNotes": "I reviewed examples of planning failures in tool-using agents. One failure mode is structural: the agent chooses a tool that exists but calls it with an invalid parameter shape. Another is semantic: the parameter schema is valid, but the value is wrong. A third is goal failure, where the plan does not satisfy the task or ignores a constraint.\n\nThat taxonomy is immediately reusable. Schema validation can catch structural failures before execution. Reference cases can test semantic argument selection. End-to-end task assertions can determine whether the final goal and constraints were met.\n\nI also focused on efficiency as an evaluation dimension. Functional correctness should be paired with runtime, memory, token use, or execution cost where those qualities affect usability. The ground truth is not only the expected answer. It can also include an expected performance envelope.\n\nExperiment tracking provides the bridge between isolated results and engineering understanding. Capturing code, configuration, inputs, outputs, metrics, and timestamps makes it possible to compare changes and debug regressions. Tracking everything is tempting, but indiscriminate telemetry can bury the signals that matter. The instrumentation plan should start from failure modes and operational decisions.\n\nProduction testing introduces a harder constraint. Live validation is necessary when data distributions shift, but it cannot be reckless. Safer patterns include limited exposure, shadow execution, explicit health checks, rollback criteria, and comparison against the current system. The goal is to learn from production conditions without turning users into an uncontrolled experiment.\n\nA canceled working session left less direct build evidence for the day, so I am treating this as an exploration and design day rather than claiming implementation. The concrete outcome was a clearer evaluation model that can be applied to future agent and ML work.", "moved": "- Explored a failure taxonomy for tool selection, parameter validity, parameter correctness, and goal completion.\n\n- Defined efficiency and cost as first-class evaluation dimensions alongside correctness.\n\n- Connected continual learning requirements to deployment, monitoring, and rollback infrastructure.\n\n- Identified experiment tracking as the mechanism for comparing changes and investigating regressions.\n\n- Clarified safer patterns for validating models under production data conditions.", "pattern": "Build evaluation as a layered contract.\n\nValidate schemas before execution. Test semantic arguments against labeled cases. Assert end-to-end goals and constraints. Measure runtime and cost. Capture experiment lineage. Monitor live behavior for distribution change. Release through controlled exposure with explicit rollback thresholds.\n\nThis converts evaluation from a scorecard into an operating system for improvement. Every failure should map to a test, every test to a release gate, and every production signal to a decision the team is prepared to make.", "takeaways": "- Correct output does not compensate for unacceptable runtime or cost.\n\n- Agent evaluation should separate tool, argument, and goal failures.\n\n- Continual learning depends more on infrastructure than on retraining code.\n\n- Telemetry is useful when it supports a defined operational decision.\n\n- Production validation requires controlled exposure and rollback, not optimism.", "thread": "I need to turn this evaluation model into a reusable harness with typed tool contracts, labeled scenarios, performance budgets, experiment metadata, and release gates that can run in a pipeline."}, "moved": ["Explored a failure taxonomy for tool selection, parameter validity, parameter correctness, and goal completion.", "Defined efficiency and cost as first-class evaluation dimensions alongside correctness.", "Connected continual learning requirements to deployment, monitoring, and rollback infrastructure.", "Identified experiment tracking as the mechanism for comparing changes and investigating regressions.", "Clarified safer patterns for validating models under production data conditions."], "takeaways": ["Correct output does not compensate for unacceptable runtime or cost.", "Agent evaluation should separate tool, argument, and goal failures.", "Continual learning depends more on infrastructure than on retraining code.", "Telemetry is useful when it supports a defined operational decision.", "Production validation requires controlled exposure and rollback, not optimism."], "source": "journal/2026/05/08/2026-05-08.md"}, {"id": "2026-05-07-governance-needs-evidence-not-just-guardrails", "date": "2026-05-07", "title": "Governance Needs Evidence, Not Just Guardrails", "theme": "Permissions shape both security and AI quality", "summary": "A governance baseline can be perfectly written and still miss the risk users actually experience. Today the gap showed up in search quality: broad file sharing does not only increase exposure, it can also pollute the context an AI assistant retrieves.", "prompt": "What would future-you want to know?", "types": ["learning"], "projects": ["governance", "powerplatform", "copilot", "security", "automation"], "words": 713, "minutes": 3, "intro": "A governance baseline can be perfectly written and still miss the risk users actually experience. Today the gap showed up in search quality: broad file sharing does not only increase exposure, it can also pollute the context an AI assistant retrieves.\n\nI reviewed updates to a Power Platform baseline and worked through data loss prevention, developer accountability, connector controls, and oversharing. The key shift was moving from policy language to evidence that can be measured across the tenant.", "sections": {"theme": "Traditional access reviews ask whether a user can open a file. AI changes the question. If a user can access thousands of marginally relevant or broadly shared artifacts, those files can enter retrieval results and weaken the assistant's answer even when no permission boundary is technically violated.\n\nThat makes oversharing both a security issue and a quality issue. The same permissive group that creates unnecessary access can introduce stale, duplicate, or misleading content into Copilot search. Fixing the problem requires more than reminding people to share carefully.\n\nWe reviewed a revised DLP strategy and discussed new controls that allow specific actions on otherwise approved connectors to be enabled or disabled. That granularity is useful because connector risk is not binary. A read action and a destructive write action should not inherit the same default simply because they come from the same connector.", "fieldNotes": "The baseline review exposed a second governance concern: cost responsibility. Agent activity can trigger consumption that is not obvious to the developer at design time. A technical platform needs a developer agreement that makes ownership, acceptable use, cost awareness, and compliance responsibilities explicit before an application or flow is released.\n\nThe oversharing discussion was grounded in direct examples of broad internal access degrading Copilot search results. That evidence changed the conversation. Instead of treating permissions hygiene as an abstract control, it became a visible product-quality problem.\n\nThe proposed technical response was a tenant-level permissions audit. The script would iterate through sites, identify broad sharing patterns, and produce a reviewable inventory. The goal is not to remove access automatically. It is to make the current state observable enough that owners can distinguish intentional collaboration from accumulated exposure.\n\nA useful audit must preserve context. Broad access alone is a signal, not a verdict. The output should include the site, sharing principal, affected scope, ownership, last activity, and a classification that supports review. Public-facing output must remain generalized, but the internal remediation process needs enough precision to act.\n\nThe discussion also reinforced that governance documentation should be versioned. The baseline was being updated to reflect a new DLP strategy and prepared for a later publication. Versioning gives the team a way to explain which policy applied when a solution was built or approved.", "moved": "- Reviewed an updated Power Platform baseline aligned to a revised DLP strategy.\n\n- Identified developer cost responsibility and acceptable-use expectations as missing governance requirements.\n\n- Validated that broad internal sharing can degrade Copilot retrieval quality.\n\n- Defined a tenant permissions audit as the next technical mechanism for finding overshared content.\n\n- Explored action-level restrictions for approved connectors instead of relying only on connector-wide allow or block decisions.", "pattern": "Turn policy concerns into measurable controls.\n\nStart with a documented baseline. Add tenant scans that discover actual configuration and permissions. Route findings to owners for review. Track exceptions with rationale and expiration. Re-run the scan to verify remediation and detect drift.\n\nFor AI-enabled platforms, evaluate governance across three dimensions: access, action, and retrieval quality. Access asks who can reach the content. Action asks what the connector or agent can change. Retrieval quality asks whether the available content improves or degrades the answer.\n\nThe future state is continuous control monitoring. A scheduled audit can detect broad sharing, risky connector actions, unowned solutions, and policy drift, then produce a prioritized remediation queue instead of another static report.", "takeaways": "- Oversharing can reduce AI answer quality even when access is technically authorized.\n\n- Connector governance should distinguish read, write, and destructive actions.\n\n- Developer agreements need clear ownership for cost and compliance.\n\n- A baseline becomes operational only when configuration can be measured against it.", "thread": "I need to design the permissions audit so it identifies meaningful exposure without flooding reviewers with expected collaboration. The hardest part is not enumeration. It is producing a defensible signal that leads to action."}, "moved": ["Reviewed an updated Power Platform baseline aligned to a revised DLP strategy.", "Identified developer cost responsibility and acceptable-use expectations as missing governance requirements.", "Validated that broad internal sharing can degrade Copilot retrieval quality.", "Defined a tenant permissions audit as the next technical mechanism for finding overshared content.", "Explored action-level restrictions for approved connectors instead of relying only on connector-wide allow or block decisions."], "takeaways": ["Oversharing can reduce AI answer quality even when access is technically authorized.", "Connector governance should distinguish read, write, and destructive actions.", "Developer agreements need clear ownership for cost and compliance.", "A baseline becomes operational only when configuration can be measured against it."], "source": "journal/2026/05/07/2026-05-07.md"}, {"id": "2026-05-05-migration-is-really-a-mapping-problem", "date": "2026-05-05", "title": "Migration Is Really a Mapping Problem", "theme": "Make hidden dependencies explicit", "summary": "Moving a Power Apps customized SharePoint form between environments looks like a packaging task until the package opens. Then the real problem appears: the exported solution still knows where it came from.", "prompt": "What are you trying next?", "types": ["learning"], "projects": ["powerapps", "sharepoint", "alm", "automation"], "words": 663, "minutes": 3, "intro": "Moving a Power Apps customized SharePoint form between environments looks like a packaging task until the package opens. Then the real problem appears: the exported solution still knows where it came from.\n\nToday I worked through the development-to-production migration process for a customized SharePoint form. The useful lesson was not how to click Export. It was how to treat every environment-specific reference as data that must be discovered, mapped, changed, and validated.", "sections": {"theme": "A customized form is tied to more than its visible controls. The export contains environment identifiers, list references, URLs, and metadata that connect the application to its source. Those bindings are convenient during development, but they become liabilities during promotion.\n\nI demonstrated the export workflow, downloaded and extracted the package, and traced the files that carry the important mappings. The package structure made the core issue clear: migration succeeds only when source identifiers are deliberately replaced with target identifiers.\n\nThis is where a manual process can become fragile. A copied value can be syntactically valid and still point to the wrong list. A target URL can look correct but reference the wrong site context. A form can import successfully and still fail at runtime because one dependency was never remapped.", "fieldNotes": "The walkthrough started from the form settings in SharePoint and moved through the Power Apps export process. Naming the package clearly mattered because the artifact needed to remain distinguishable from both the source form and the eventual production deployment.\n\nAfter export, I treated the ZIP as a solution artifact rather than a black box. Extracting it exposed the JSON-based configuration and the environment-specific values embedded inside it. Those files become the handoff point between application design and release engineering.\n\nThe most important operational step is inventory. Before changing any file, capture the source and target values side by side. That includes the list identifiers and URLs used by the customized form. Editing without a mapping table turns the migration into a memory exercise, which is exactly the failure mode automation should eliminate.\n\nThe process also highlighted a validation gap. Import completion is not proof of correctness. The target form still needs to be opened, connected to the intended list, and exercised through representative create, read, update, and validation paths. The package can be structurally accepted while the application remains functionally misbound.\n\nThis work was demonstrated as a manual migration because the manual path makes the dependencies visible. The next maturity step is to encode those substitutions into a repeatable transformation with preflight checks. A deterministic script could inspect the package, verify required keys, apply an explicit mapping file, retain a backup, and fail when an expected source value is missing.", "moved": "- Demonstrated the export of a Power Apps customized SharePoint form.\n\n- Inspected the extracted solution package and identified the primary configuration files involved in migration.\n\n- Documented the need to replace source list identifiers and URLs with target values.\n\n- Established target-environment validation as a required step after import.\n\n- Defined package mapping as the reusable core of the deployment process.", "pattern": "Treat low-code artifacts like code even when the platform presents them as downloadable packages.\n\nExport the artifact, inventory environment dependencies, externalize source-to-target mappings, transform deterministically, and validate behavior in the destination. Keep the original package immutable and produce a separate promoted artifact.\n\nThe automation pattern should be idempotent. Given the same source package and mapping file, it should produce the same output. It should log every replacement without logging secrets, stop on ambiguous matches, and preserve enough metadata to explain exactly what changed.", "takeaways": "- Successful import does not prove that a migrated form is connected correctly.\n\n- Environment identifiers should be treated as configurable deployment data.\n\n- A mapping table is safer than manual search and replace.\n\n- Low-code promotion benefits from the same source control and validation discipline as traditional applications.", "thread": "The next step is to turn the walkthrough into a parameterized migration utility with package inspection, mapping validation, backup creation, and a post-import test checklist."}, "moved": ["Demonstrated the export of a Power Apps customized SharePoint form.", "Inspected the extracted solution package and identified the primary configuration files involved in migration.", "Documented the need to replace source list identifiers and URLs with target values.", "Established target-environment validation as a required step after import.", "Defined package mapping as the reusable core of the deployment process."], "takeaways": ["Successful import does not prove that a migrated form is connected correctly.", "Environment identifiers should be treated as configurable deployment data.", "A mapping table is safer than manual search and replace.", "Low-code promotion benefits from the same source control and validation discipline as traditional applications."], "source": "journal/2026/05/05/2026-05-05.md"}, {"id": "2026-05-01-designing-an-agent-for-signal-not-noise", "date": "2026-05-01", "title": "Designing an Agent for Signal, Not Noise", "theme": "Information becomes useful when it is triaged", "summary": "A useful leadership agent should not summarize everything it can find. It should identify what requires attention, preserve uncertainty, and make the next action easier to see.", "prompt": "What did you ship or move forward?", "types": ["win", "experiment"], "projects": ["aiagents", "copilot", "productivity", "automation"], "words": 690, "minutes": 3, "intro": "A useful leadership agent should not summarize everything it can find. It should identify what requires attention, preserve uncertainty, and make the next action easier to see.\n\nToday I packaged and shared a Chief of Staff agent definition. The artifact focused on daily briefing, action tracking, risk detection, and follow-up. The important design decision was to prioritize decisions, blockers, ownership, and deadlines over a broad activity recap.", "sections": {"theme": "Work history is rarely scarce. The harder problem is deciding what matters now.\n\nA daily brief can easily become another inbox. Calendar entries, messages, and open tasks may all be relevant, but listing them without judgment transfers the sorting work back to the user. The agent definition instead organized output around leadership focus, top priorities, key meetings, decisions needed, risks, open actions, awareness items, and a short look ahead.\n\nThat structure makes the agent accountable for compression. It has to decide whether an item changes a decision, introduces risk, requires preparation, or needs follow-up. If it does not meet one of those thresholds, it probably does not belong in the brief.", "fieldNotes": "The strongest part of the design was the treatment of incomplete information. Missing context should not suppress a meaningful risk signal. The agent should state what is known, identify what remains unclear, and surface the uncertainty when the lack of follow-up could matter.\n\nThat is a different behavior from confident summarization. A summary tries to produce a clean narrative. An operational agent should preserve unresolved edges because those edges often contain the actual work.\n\nThe prompt also separated action extraction from general summarization. It asked the agent to identify owners, implied next steps, stalled work, aging commitments, and unclear ownership. This creates a more useful model of work than a meeting-by-meeting recap.\n\nI kept the default brief intentionally structured. Each priority includes why it matters, what action or decision is required, and what happens if it is delayed. Meetings are included only when they carry leadership impact or decision risk. Open actions include an owner, status, and a trigger for the next check-in.\n\nThe design still has clear limitations. A prompt can define behavior, but it cannot guarantee complete source coverage or reliable persistence. It also cannot convert an implied owner into a confirmed commitment. Those distinctions need to remain visible in the output.\n\nThis was a packaging and design milestone, not proof that the full operating model was validated. The artifact established the agent's response contract and risk posture. Evaluation against real work history remains the next step.", "moved": "- Packaged and shared a Chief of Staff agent artifact.\n\n- Defined a daily brief centered on priorities, decisions, risks, actions, and near-term dependencies.\n\n- Added explicit handling for stalled work, aging commitments, and unclear ownership.\n\n- Established that incomplete information should be surfaced as uncertainty rather than silently omitted.\n\n- Limited meeting coverage to items with leadership impact or decision risk.", "pattern": "Start with the decisions the user needs to make, not the sources the agent can search.\n\nDefine a compact output contract. Require every surfaced item to explain its impact. Separate confirmed facts from inferred follow-up. Preserve uncertainty. Omit sections with no relevant content. Keep awareness items optional so they do not crowd out action.\n\nThe same pattern can support engineering operations, portfolio review, model governance, and incident coordination. The source mix changes, but the core contract remains stable: identify signal, explain consequence, assign the next check, and make gaps explicit.\n\nA future-state implementation should make this event-driven. New commitments, approaching deadlines, changed risks, and completed meetings could update a structured action graph. The daily brief would then become a view over current state rather than a fresh reconstruction every morning.", "takeaways": "- A briefing should reduce prioritization work, not reproduce the source material.\n\n- Unclear ownership is itself an operational risk.\n\n- Implied next steps must remain distinguishable from confirmed commitments.\n\n- Optional sections protect the signal-to-noise ratio.\n\n- A prompt defines behavior, but evaluation proves whether the behavior is dependable.", "thread": "The next experiment is to evaluate the agent against representative days and score whether it finds the right decisions, owners, deadlines, and risks without over-reporting routine activity."}, "moved": ["Packaged and shared a Chief of Staff agent artifact.", "Defined a daily brief centered on priorities, decisions, risks, actions, and near-term dependencies.", "Added explicit handling for stalled work, aging commitments, and unclear ownership.", "Established that incomplete information should be surfaced as uncertainty rather than silently omitted.", "Limited meeting coverage to items with leadership impact or decision risk."], "takeaways": ["A briefing should reduce prioritization work, not reproduce the source material.", "Unclear ownership is itself an operational risk.", "Implied next steps must remain distinguishable from confirmed commitments.", "Optional sections protect the signal-to-noise ratio.", "A prompt defines behavior, but evaluation proves whether the behavior is dependable."], "source": "journal/2026/05/01/2026-05-01.md"}, {"id": "2026-04-30-guardrails-need-an-operating-model", "date": "2026-04-30", "title": "Guardrails Need an Operating Model", "theme": "Convert principles into observable controls", "summary": "A policy that says an agent needs human oversight is directionally correct. It is not complete until the organization knows who reviews it, when review occurs, and how the control is tested.", "prompt": "What are you working on?", "types": ["learning", "win"], "projects": ["aigovernance", "powerplatform", "copilotstudio", "devops"], "words": 708, "minutes": 3, "intro": "A policy that says an agent needs human oversight is directionally correct. It is not complete until the organization knows who reviews it, when review occurs, and how the control is tested.\n\nToday I worked through a Power Platform baseline review focused on environment requests, DLP changes, direct-line testing, lifecycle management, logging, training, and human-in-the-loop requirements. The central lesson was that governance fails when ownership is implied.", "sections": {"theme": "The discussion exposed gaps in the path from request to supported environment. Environment creation, security group setup, licensing, connector access, administrative settings, and ongoing support were not yet expressed as one consistent operating model.\n\nThat fragmentation creates risk even when each individual control is reasonable. A maker may know which environment is needed but not which queue receives the request. An administrator may create the environment without the same naming or security convention used elsewhere. A deployment may work while carrying hard-coded environment values that break at promotion.\n\nThe solution is not another broad policy statement. It is a standardized intake process with explicit ownership and evidence at each stage.", "fieldNotes": "The group discussed creating a dedicated request form or service entry for Power Platform environment and connector access. This would reduce noise and provide a consistent path for collecting purpose, owner, environment stage, connector needs, and security requirements.\n\nLifecycle management was another focus. The documented follow-up called for developer or administrator oversight of ALM pipelines so environment settings are correct and hard-coded values are avoided. It also called for periodic review of application settings against policy.\n\nThose controls are stronger when automated. A pre-deployment check can detect hard-coded URLs, missing connection references, unmanaged variables, and incorrect targets. A scheduled review can compare current configuration with the approved baseline and flag drift.\n\nDirect-line channel functionality required testing in a support environment. The plan included creating the environment, duplicating a DLP policy for the test, and reverting to the original policy afterward. This is a good example of controlled experimentation: isolate the change, preserve the existing baseline, test the capability, and restore the original state.\n\nWe also discussed evaluating the Copilot Studio Center of Excellence kit in non-production before deciding whether it should become a formal platform enhancement. That remains an evaluation task, not an implemented capability.\n\nI was assigned work to document the request and naming process, compile guidance for makers, and draft a human-in-the-loop guardrail for published agents. The guardrail needs to define more than a reviewer checkbox. It should establish which actions require approval, how exceptions are handled, and what evidence is retained.\n\nA separate team briefing identified AI-assisted metadata improvement as an active area to continue exploring for a solution catalog. I am treating that as supporting context only. The evidence supports continued work and piloting, not a claim that the enhancement was shipped.", "moved": "- Defined follow-up work for a standardized environment and connector intake process.\n\n- Identified lifecycle controls for ALM oversight, environment settings, and hard-coded values.\n\n- Planned isolated testing for direct-line capability using a temporary policy configuration.\n\n- Established non-production evaluation as the gate for a Copilot Studio governance kit.\n\n- Assigned development of training guidance and a human-in-the-loop guardrail for published agents.\n\n- Documented unresolved ownership across environment creation, security groups, and ongoing administration.", "pattern": "Turn every governance principle into four elements: trigger, owner, evidence, and enforcement.\n\nA request triggers intake. A named role owns the decision. The process captures evidence such as approved connectors, test results, and environment mappings. Automated checks enforce what can be validated deterministically, while human review handles judgment and exceptions.\n\nThe future state is a policy-as-code control plane. Intake data should generate environment configuration, group assignments, pipeline variables, review tasks, and monitoring rules. Changes should be observable and reversible.", "takeaways": "- Human-in-the-loop is a control design problem, not a slogan.\n\n- Standardized intake reduces both administrative noise and configuration drift.\n\n- Temporary policy changes need isolation and rollback.\n\n- Hard-coded environment values are governance defects as well as engineering defects.\n\n- Evaluation in non-production should precede platform-wide adoption.", "thread": "The remaining work is to define the human review boundary precisely and connect intake, provisioning, deployment validation, logging, and periodic review into one traceable workflow."}, "moved": ["Defined follow-up work for a standardized environment and connector intake process.", "Identified lifecycle controls for ALM oversight, environment settings, and hard-coded values.", "Planned isolated testing for direct-line capability using a temporary policy configuration.", "Established non-production evaluation as the gate for a Copilot Studio governance kit.", "Assigned development of training guidance and a human-in-the-loop guardrail for published agents.", "Documented unresolved ownership across environment creation, security groups, and ongoing administration."], "takeaways": ["Human-in-the-loop is a control design problem, not a slogan.", "Standardized intake reduces both administrative noise and configuration drift.", "Temporary policy changes need isolation and rollback.", "Hard-coded environment values are governance defects as well as engineering defects.", "Evaluation in non-production should precede platform-wide adoption."], "source": "journal/2026/04/30/2026-04-30.md"}, {"id": "2026-04-29-names-are-not-identities", "date": "2026-04-29", "title": "Names Are Not Identities", "theme": "Human-readable labels need stable machine references", "summary": "A display name is readable, but it is not stable enough to carry automation. Today a governance review made that lesson concrete across environments, security groups, documentation, and deployment controls.", "prompt": "Who did you help, or who helped you?", "types": ["learning", "win"], "projects": ["platformgovernance", "powerplatform", "copilotstudio", "governance", "automation"], "words": 659, "minutes": 3, "intro": "A display name is readable, but it is not stable enough to carry automation. Today a governance review made that lesson concrete across environments, security groups, documentation, and deployment controls.\n\nI worked through Power Platform baseline decisions covering DLP strategy, environment naming, security group references, and the minimum environment structure needed for Copilot Studio delivery. The strongest throughline was that governance has to survive renames.", "sections": {"theme": "Environment and security group names communicate purpose. They are important for operators and users, but they change as scope and ownership evolve. If scripts, integrations, or governance records depend on display names, a harmless rename can become an operational failure.\n\nThe group identified object identifiers as the safer reference for security groups. That is a small implementation detail with a large architectural consequence. Automation should resolve and store immutable identities while presenting friendly labels separately.\n\nThe same separation applies to environment naming. We reviewed inconsistencies and planned corrections so the names accurately reflected platform scope rather than a single product. Documentation also needed to match the revised convention.", "fieldNotes": "The baseline discussion included adding selected third-party connectors to the default DLP policy under a revised strategy. This was discussed as a governance change, not proof that every connector scenario had been validated. The baseline document needed to record the decision and retain the surrounding security context.\n\nWe also clarified the intended environment model for Copilot Studio. Development and test environments were considered the initial minimum needed to support automated promotion and validation. Production remained part of the requested target state, with all solution changes expected to follow a development-to-test-to-production path.\n\nThat environment sequence matters because Copilot Studio is being treated as an orchestration and conversational layer over approved services. It is not a reason to bypass the governance of the systems it connects to. Models, storage, and processing remain controlled by their respective platforms.\n\nThis creates a distinct deployment pipeline for agent solutions. The pipeline needs stable environment references, controlled connectors, and enough separation to validate behavior before release. Without that, the environment names are cosmetic and the promotion path is aspirational.\n\nThe review also surfaced process ownership gaps. Environment creation, security group setup, and administrative responsibilities needed clearer assignment across organizational boundaries. I was assigned follow-up work to confirm ownership, correct naming, and evaluate object ID references.\n\nA canceled automation session on the same day was not treated as completed work. That distinction matters in a journal like this. Calendar intent is not evidence. The supported work came from a transcribed governance discussion and its documented actions.", "moved": "- Discussed a revised DLP strategy for selected default connectors.\n\n- Defined development, test, and production as the intended promotion sequence for Copilot Studio solutions.\n\n- Identified development and test as the initial minimum for controlled validation and automated promotion.\n\n- Assigned corrections for environment and security group naming consistency.\n\n- Explored using immutable object identifiers instead of display names in automation.\n\n- Documented unresolved ownership for environment creation and ongoing administration.", "pattern": "Store immutable identifiers, display friendly names, and validate that the two still correspond.\n\nEvery automated deployment should resolve environments, groups, workspaces, and connections by stable IDs. Naming conventions should describe purpose and lifecycle stage, but they should not be the primary key.\n\nGovernance documentation should version both the human convention and the machine mapping. A pipeline can then fail safely when an expected object is missing, duplicated, or renamed.\n\nThe future state is configuration-driven provisioning. A versioned manifest should define environment stage, owning group, security group object ID, allowed connectors, pipeline target, and review cadence.", "takeaways": "- Display names are for people. Immutable IDs are for automation.\n\n- Naming standards still matter because they communicate scope and ownership.\n\n- Documentation and deployed configuration must change together.\n\n- Development and test separation enables evidence-based promotion.\n\n- A canceled session is not completed work.", "thread": "I need to convert the naming and ownership decisions into a canonical environment manifest and determine how drift will be detected when labels, memberships, or policies change."}, "moved": ["Discussed a revised DLP strategy for selected default connectors.", "Defined development, test, and production as the intended promotion sequence for Copilot Studio solutions.", "Identified development and test as the initial minimum for controlled validation and automated promotion.", "Assigned corrections for environment and security group naming consistency.", "Explored using immutable object identifiers instead of display names in automation.", "Documented unresolved ownership for environment creation and ongoing administration."], "takeaways": ["Display names are for people. Immutable IDs are for automation.", "Naming standards still matter because they communicate scope and ownership.", "Documentation and deployed configuration must change together.", "Development and test separation enables evidence-based promotion.", "A canceled session is not completed work."], "source": "journal/2026/04/29/2026-04-29.md"}, {"id": "2026-04-28-define-the-data-boundary-before-building-the-table", "date": "2026-04-28", "title": "Define the Data Boundary Before Building the Table", "theme": "Architecture starts with ownership", "summary": "A table is easy to create. The harder work is deciding who owns the data, where transformation is allowed, and which layer is safe to expose downstream.", "prompt": "What's the next smallest step?", "types": ["learning"], "projects": ["dataengineering", "synapse", "analytics", "alm"], "words": 676, "minutes": 3, "intro": "A table is easy to create. The harder work is deciding who owns the data, where transformation is allowed, and which layer is safe to expose downstream.\n\nToday I worked through data ownership and schema standards for a Synapse-based reporting workflow. The useful outcome was not a new table. It was a clearer lifecycle for moving data from ingestion to development and then to production reporting without blurring team responsibilities.", "sections": {"theme": "Source data can arrive through APIs, files, or databases. Once it enters a shared analytics platform, it becomes tempting for every project team to shape it directly. That is convenient in the short term, but it weakens lineage and makes production support ambiguous.\n\nThe standard discussed today separated raw ingestion, development, and reporting layers. Source-oriented data remains under the data management function. Development data is prepared for analysis and user acceptance testing. The report layer is where analytics teams own production-ready structures used by downstream reporting.\n\nThat division is more than a naming convention. It determines where changes are requested, who can write, and who is accountable when a dataset no longer matches its source.", "fieldNotes": "The conversation used the familiar bronze, silver, and gold model as a way to explain the lifecycle. Raw data lands first. It then moves into a development-ready structure. Finally, curated tables are promoted into a reporting layer.\n\nThe key constraint was that the development schema remains controlled by the data management team and is read-only to other consumers. Changes to the managed data are requested rather than performed directly. This protects the shared layer from project-specific edits that could affect other workloads.\n\nThe reporting schema has a different purpose. It provides a stable interface for production reports and can be owned by the analytics team responsible for those products. That ownership is appropriate because the report layer contains the transformations and structures required for consumption, not the original source representation.\n\nWe also discussed exceptions. Some data is generated and owned directly by an analytics team, such as platform metadata or cost detail. In those cases, a separate raw schema may add ceremony without adding control. The important lesson is that an exception should follow ownership and lineage, not convenience.\n\nA small technical decision can reveal the architecture. Table creation, distribution, indexing, and naming all matter, but they should happen after the ownership model is clear. Otherwise, engineering standards become a collection of syntax choices without an operating model behind them.\n\nA related recording on the same day demonstrated migration of a Power Apps customized SharePoint form between environments. That work reinforced the same principle from another angle: environmental identifiers and URLs are dependencies that must be mapped deliberately rather than carried forward invisibly.", "moved": "- Clarified ownership boundaries for source, development, and report-layer data.\n\n- Documented a raw-to-development-to-report lifecycle aligned to a bronze, silver, and gold model.\n\n- Established that changes to managed development data should be requested through the owning team.\n\n- Identified valid exceptions where analytics-owned source data does not require a separate raw layer.\n\n- Demonstrated that environment-specific identifiers must be explicitly mapped during low-code promotion.", "pattern": "Define the owner of the source before defining the table. Separate immutable or source-aligned ingestion from development transformations and production reporting. Assign write access according to responsibility. Make exceptions explicit and traceable.\n\nFor deployment artifacts, apply the same discipline. Inventory environment bindings, externalize mappings, transform deterministically, and validate the destination after promotion.\n\nThe future state is metadata-driven. Dataset ownership, schema stage, write authority, retention, and promotion rules should be machine-readable so pipelines can validate them before deployment.", "takeaways": "- Schema names are useful only when they represent real ownership boundaries.\n\n- Read-only development layers reduce accidental changes to shared data.\n\n- The report layer should expose stable, production-ready structures rather than raw source details.\n\n- Exceptions are safe when they preserve ownership and lineage.\n\n- Environment references should be treated as deployment configuration.", "thread": "The next step is to turn these standards into reusable documentation and automated checks for schema ownership, naming, permissions, and promotion paths."}, "moved": ["Clarified ownership boundaries for source, development, and report-layer data.", "Documented a raw-to-development-to-report lifecycle aligned to a bronze, silver, and gold model.", "Established that changes to managed development data should be requested through the owning team.", "Identified valid exceptions where analytics-owned source data does not require a separate raw layer.", "Demonstrated that environment-specific identifiers must be explicitly mapped during low-code promotion."], "takeaways": ["Schema names are useful only when they represent real ownership boundaries.", "Read-only development layers reduce accidental changes to shared data.", "The report layer should expose stable, production-ready structures rather than raw source details.", "Exceptions are safe when they preserve ownership and lineage.", "Environment references should be treated as deployment configuration."], "source": "journal/2026/04/28/2026-04-28.md"}, {"id": "2026-04-24-one-source-should-produce-many-outputs", "date": "2026-04-24", "title": "One Source Should Produce Many Outputs", "theme": "Centralize truth before automating documents", "summary": "The recurring documentation problem is not that teams lack templates. It is that every template becomes another copy that can drift.", "prompt": "What did you learn?", "types": ["idea", "win"], "projects": ["knowledgesystems", "knowledgegraph", "aiagents", "pmo", "automation"], "words": 618, "minutes": 3, "intro": "> 💡 idea · ★ win\n\nThe recurring documentation problem is not that teams lack templates. It is that every template becomes another copy that can drift.\n\nToday I joined a technical discussion about an AI assistant for project-management guidance, forms, templates, and status reporting. The most useful idea was a layered content model: maintain authoritative process content once, then reference or generate the downstream artifacts from that source.", "sections": {"theme": "The proposed assistant would help users find the right material for specific lifecycle activities, such as a project gate or status update. The immediate temptation is to index every document and add chat. That would improve discovery but preserve the underlying duplication.\n\nThe better architecture starts with a master content layer. Process changes are made once in a controlled source. Tipsheets, templates, guidance, and examples either reference that source or are generated from it.\n\nThis changes the role of the agent. It is no longer only a search interface over a document sprawl. It becomes a navigation and generation layer over governed knowledge.", "fieldNotes": "The discussion described manual status reporting as a substantial recurring burden and identified inconsistent documents stored across multiple locations. Those statements came from participants in the conversation. I did not independently validate the estimated labor impact, so I am not carrying the numeric claim into this public journal.\n\nI suggested that the design could differ if project controls and deliverables were referenced from a central location rather than reproduced in separate files. That distinction matters. A generated document should inherit controlled content, but it also needs a clear record of which source version produced it.\n\nA single master document can still become a bottleneck. The scalable version is a structured knowledge model with modular sections, ownership, effective dates, and lifecycle tags. The agent can then assemble only the content relevant to the user's stage and role.\n\nThe conversation was exploratory. No assistant was implemented or demonstrated that day. The evidence supports a design direction and problem framing, not a shipped application.\n\nThe day also included a status report for a certificate infrastructure cutover scheduled for the following week. That message was supporting context only. It described readiness and future work by a broader project team, not an accomplishment I could attribute to myself.", "moved": "- Explored an AI assistant for project lifecycle guidance and document discovery.\n\n- Defined a master-content layer as the preferred source for downstream forms, templates, and tipsheets.\n\n- Identified central project controls as a way to reduce duplicate and inconsistent artifacts.\n\n- Clarified that the agent should navigate governed knowledge rather than index uncontrolled copies.\n\n- Documented the need for generated outputs to retain source version and ownership context.", "pattern": "Separate canonical knowledge from presentation artifacts.\n\nStore policies, steps, required deliverables, approval roles, and examples as modular governed content. Add metadata for lifecycle stage, audience, owner, version, and review date. Let the agent retrieve or assemble outputs from that model.\n\nGeneration should be deterministic where possible. The same approved content and template should produce the same baseline artifact. Human editing can follow, but the output should retain lineage to the source modules used.\n\nThe future state is event-driven documentation. When a controlled process changes, impacted templates and guidance can be flagged or regenerated automatically, with reviewers seeing the exact downstream effect before publication.", "takeaways": "- Better search does not solve duplicated source content.\n\n- A master content layer reduces drift only when ownership and versioning are explicit.\n\n- Agents should assemble role-specific guidance from governed modules.\n\n- Generated documents need lineage back to the source version.\n\n- Exploration should not be described as implementation.", "thread": "The next step is to define the canonical content schema and test whether one lifecycle activity can generate a consistent checklist, guidance page, and status artifact from the same source."}, "moved": ["Explored an AI assistant for project lifecycle guidance and document discovery.", "Defined a master-content layer as the preferred source for downstream forms, templates, and tipsheets.", "Identified central project controls as a way to reduce duplicate and inconsistent artifacts.", "Clarified that the agent should navigate governed knowledge rather than index uncontrolled copies.", "Documented the need for generated outputs to retain source version and ownership context."], "takeaways": ["Better search does not solve duplicated source content.", "A master content layer reduces drift only when ownership and versioning are explicit.", "Agents should assemble role-specific guidance from governed modules.", "Generated documents need lineage back to the source version.", "Exploration should not be described as implementation."], "source": "journal/2026/04/24/2026-04-24.md"}, {"id": "2026-04-23-production-needs-observability-before-it-needs-more-makers", "date": "2026-04-23", "title": "Production Needs Observability Before It Needs More Makers", "theme": "Prevention without detection is incomplete", "summary": "A platform is not governed because its DLP policy is complicated. It is governed when risky behavior can be tested, reviewed, and detected after release.", "prompt": "What decision did you make, and why?", "types": ["win", "experiment"], "projects": ["platformsecurity", "powerplatform", "security", "observability", "devops"], "words": 669, "minutes": 3, "intro": "A platform is not governed because its DLP policy is complicated. It is governed when risky behavior can be tested, reviewed, and detected after release.\n\nToday I worked through Power Platform baseline risks involving connector policy, direct-line functionality, security logging, test isolation, production review, and reporting. The central shift was from preventive settings alone to a broader control model that includes visibility and evidence.", "sections": {"theme": "DLP policies define which connectors can interact, but real solutions still operate through identities, channels, actions, and data paths that need validation. A connector can be approved while a specific usage pattern remains risky.\n\nThe group discussed testing required connectors in a dedicated administrative environment rather than changing the common baseline first. That isolates uncertainty and creates a place to reproduce policy behavior without exposing production workloads.\n\nWe also identified logging as a gap. The follow-up was to research integration of Power Platform activity into the organization's security monitoring system, with attention to unusual access and high-volume write behavior. This was a planned action, not a completed integration.", "fieldNotes": "Direct-line functionality created a practical policy problem. The test needed to determine whether required connectors could be placed in a narrower DLP policy instead of opening them in the default policy. The right answer depended on observed behavior, not assumption.\n\nThe dedicated test environment was therefore more than convenience. It provided a disposable boundary for policy experiments, administrative settings, and security group access. A strong test environment should make it possible to apply a change, record the result, and return to a known baseline.\n\nProduction review was another explicit control. I was assigned to establish a mandatory code review process for agents or applications released to production, particularly those exposed through conversational channels. Low-code does not eliminate code risk. Instructions, actions, connection references, custom logic, and sharing configuration all deserve review.\n\nReporting was discussed as a second line of evidence. Existing governance or compliance tooling might provide enough visibility into Copilot activity. If it did not, custom BI reporting was identified as a potential path. The immediate task was to investigate coverage before deciding to build something new.\n\nA separate artifact shared the same day showed a structured executive status generator template. It specified health indicators, dates, financial fields, milestones, and rules for removing unsupported rows. That reinforced the value of deterministic output contracts. Reporting should state what is known and remove placeholders that cannot be supported.\n\nAnother shared artifact showed a structured contract comparison produced with Microsoft 365 Copilot. It demonstrated a findings-table format with locations, reference clauses, variance summaries, and confidence scores. I am treating this as an example available for comparison, not as validation of the custom agent.", "moved": "- Defined connector-policy testing as an isolated administrative experiment.\n\n- Assigned research into centralized security logging for risky Power Platform activity.\n\n- Proposed a mandatory production code review for agents and applications.\n\n- Planned an assessment of existing governance reporting before building custom BI visibility.\n\n- Reviewed deterministic output patterns for executive status and contract comparison artifacts.", "pattern": "Govern in layers: prevent, test, review, observe, and respond.\n\nUse DLP and access controls to narrow the allowed path. Use an isolated environment to test policy behavior. Require peer review before production. Send activity to centralized monitoring. Build reporting only for gaps the existing tools do not cover.\n\nThe future state is an automated release gate. A deployment should fail when policy mappings are missing, risky actions lack approval, review evidence is absent, monitoring is not configured, or the target environment does not match the release manifest.", "takeaways": "- Connector approval does not validate every connector usage pattern.\n\n- A dedicated administrative test environment reduces policy experimentation risk.\n\n- Low-code and agent solutions still require production review.\n\n- Security monitoring should focus on behavior such as unusual access or high-volume writes.\n\n- Custom reporting should address verified visibility gaps, not duplicate available tooling.", "thread": "The remaining work is to complete the connector tests, determine the available audit signals, and translate production review into a repeatable release checklist with evidence and ownership."}, "moved": ["Defined connector-policy testing as an isolated administrative experiment.", "Assigned research into centralized security logging for risky Power Platform activity.", "Proposed a mandatory production code review for agents and applications.", "Planned an assessment of existing governance reporting before building custom BI visibility.", "Reviewed deterministic output patterns for executive status and contract comparison artifacts."], "takeaways": ["Connector approval does not validate every connector usage pattern.", "A dedicated administrative test environment reduces policy experimentation risk.", "Low-code and agent solutions still require production review.", "Security monitoring should focus on behavior such as unusual access or high-volume writes.", "Custom reporting should address verified visibility gaps, not duplicate available tooling."], "source": "journal/2026/04/23/2026-04-23.md"}, {"id": "2026-04-22-adoption-needs-a-control-plane", "date": "2026-04-22", "title": "Adoption Needs a Control Plane", "theme": "Scale the path, not just the prototype", "summary": "AI adoption slows down when every promising use case has to rediscover the same path through access, security, testing, and review. The friction is not only in the model. It is in the operating system around the model.", "prompt": "What blocked you today?", "types": ["win"], "projects": ["aiadoption", "copilotstudio", "aiagents", "governance", "evaluation"], "words": 673, "minutes": 3, "intro": "AI adoption slows down when every promising use case has to rediscover the same path through access, security, testing, and review. The friction is not only in the model. It is in the operating system around the model.\n\nToday I presented an AI adoption approach and advanced the next steps for a contract evaluation agent. The discussion made the governance layers visible: a non-production environment, an approved connector policy, representative test material, and domain review of both inputs and outputs.", "sections": {"theme": "A successful demonstration can prove that a task is possible. It does not prove the solution is ready to be trusted, supported, or repeated.\n\nThe contract agent needed two parallel workstreams. The technical workstream required a governed environment and the connector configuration needed for standard functionality. The evaluation workstream required domain reviewers to curate examples and validate whether the agent's findings were accurate.\n\nNeither workstream can substitute for the other. A secure environment does not make the analysis correct. A good answer in a demo does not make the deployment governed.\n\nThe adoption program also had a capacity problem. More people were interested in co-leading than there were prepared projects ready for them. That is a useful signal. The limiting factor was not enthusiasm. It was the ability to source, shape, and govern enough real work.", "fieldNotes": "I framed adoption as a layered model rather than a collection of isolated AI experiments. A project needs a business problem, an accountable owner, a supported platform path, and an evaluation plan. Without those pieces, a prototype can become an orphaned artifact.\n\nThe legal use case was a concrete example. The immediate actions were to follow up on approved non-production environments, obtain final approval for the required DLP connectors, and coordinate domain review of the agent's input and output accuracy. Those actions were documented, but they were not yet complete.\n\nThe strongest design choice was putting domain validation directly into the plan. Contract analysis contains judgment that cannot be reduced to a technical smoke test. Reviewers need to examine whether the reference material is appropriate, whether the output identifies meaningful variances, and whether the presentation supports human decision-making.\n\nThe discussion also called for additional workflows that could benefit from co-leadership and AI adoption. I am treating that as a sourcing challenge, not evidence of new projects delivered. A healthy portfolio should not reward the number of ideas collected. It should reward the number of well-shaped opportunities that ca
