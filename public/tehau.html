-access-model-not-a-document", "date": "2026-03-12", "title": "Governance Is an Access Model, Not a Document", "theme": "Make the control plane operational", "summary": "A platform baseline is only real when a developer can enter the right environment, receive the right role, use approved connectors, and leave an audit trail that explains what happened.", "prompt": "What blocked you today?", "types": ["learning"], "projects": ["powerplatform", "copilotstudio", "security", "governance", "automation"], "words": 572, "minutes": 3, "intro": "A platform baseline is only real when a developer can enter the right environment, receive the right role, use approved connectors, and leave an audit trail that explains what happened.\n\nToday I worked through Copilot Studio environment access, security groups, credit allocation, DLP naming, audit settings, and role design. The meeting was transcribed, which gave direct evidence of the decisions and follow-up work.", "sections": {"theme": "The discussion moved beyond general governance language. It addressed who should receive member access, which role developers need in addition to environment-maker privileges, how DLP policies should be named, and how licensing or billing staff might view credit allocation without receiving broader administrative rights.\n\nThat level of detail matters. A policy that says access should be appropriate is not enough. The environment needs a repeatable mapping from job function to security group, role, connector policy, and reporting visibility.\n\nThe team also reviewed department-level tracking and chargeback concerns for Copilot credits. Credit allocation is not only financial administration. It influences isolation, accountability, and the ability to understand which workloads are consuming shared capacity.", "fieldNotes": "The immediate access decision was to provide developer membership without owner rights. That is a useful least-privilege pattern because it separates the ability to build from the ability to control group membership or the environment itself.\n\nThe baseline documentation also needed to include the basic-user role alongside the environment-maker role. Missing one required role can make the environment appear broken even when the security group is correct. Documentation should describe the complete entitlement bundle, not one visible permission.\n\nDLP policy naming became another concrete control. A consistent name should connect the policy to the environment scope and purpose. Operators should not have to open every policy to determine which environment it protects.\n\nThe conversation explored audit and logging strategies, environment group plans, and an administrative role that might allow credit visibility without broad platform control. Those items remained investigative. I did not treat them as implemented.\n\nThe day also included several scheduled AI perspective discussions without transcripts. Invitations alone do not prove attendance or content, so they are not part of the accomplishment record.", "moved": "- Validated developer access through security-group membership without owner rights.\n\n- Identified the complete Copilot Studio role bundle that baseline documentation must include.\n\n- Defined DLP policy naming as an explicit governance requirement.\n\n- Connected credit allocation with department-level accountability and reporting.\n\n- Opened an investigation into a least-privilege role for licensing and billing visibility.\n\n- Documented audit, environment grouping, and configuration questions that remained unresolved.", "pattern": "Express governance as configuration.\n\nMaintain a versioned manifest that maps environment purpose to security group, user roles, DLP policy, connectors, credit allocation, audit settings, owner, and support contact. Validate the manifest against the tenant regularly. Report drift as data rather than discovering it through failed access.\n\nThe future state is an idempotent provisioning pipeline. An approved request should create or reconcile the environment, assign the security group, apply the baseline roles and DLP policy, configure logging, and publish an access report.", "takeaways": "- Member access and owner access should remain separate.\n\n- A role baseline must include every entitlement required for the developer experience.\n\n- DLP names should communicate scope without manual inspection.\n\n- Credit allocation is part of platform accountability.\n\n- Governance questions should be recorded as unresolved until the configuration is tested.", "thread": "The next step is to finalize the naming and role standards, test the credit-viewing permissions, and automate drift detection across environment access and policy configuration."}, "moved": ["Validated developer access through security-group membership without owner rights.", "Identified the complete Copilot Studio role bundle that baseline documentation must include.", "Defined DLP policy naming as an explicit governance requirement.", "Connected credit allocation with department-level accountability and reporting.", "Opened an investigation into a least-privilege role for licensing and billing visibility.", "Documented audit, environment grouping, and configuration questions that remained unresolved."], "takeaways": ["Member access and owner access should remain separate.", "A role baseline must include every entitlement required for the developer experience.", "DLP names should communicate scope without manual inspection.", "Credit allocation is part of platform accountability.", "Governance questions should be recorded as unresolved until the configuration is tested."], "source": "journal/2026/03/12/2026-03-12.md"}, {"id": "2026-03-10-find-the-actual-system-boundary", "date": "2026-03-10", "title": "Find the Actual System Boundary", "theme": "Duplicate capture usually signals a missing boundary", "summary": "A workflow can look like a form problem when the real issue is that information is being copied between systems without a clear owner.", "prompt": "What are you working on?", "types": ["win"], "projects": ["solutionarchitecture", "architecture", "workflow", "automation", "governance"], "words": 543, "minutes": 2, "intro": "A workflow can look like a form problem when the real issue is that information is being copied between systems without a clear owner.\n\nToday I worked through a contract intake flow and compared the details captured in a request form with a separate checklist. The overlap raised a basic architecture question: is one artifact authoritative, or is someone manually transposing the same information from one place to another?", "sections": {"theme": "The discussion exposed a familiar tension between buying a vendor solution and building an internal one. That decision is easy to frame as a feature comparison. It is more useful to begin with the flow of information.\n\nIf two tools collect nearly the same detail, adding another form does not improve the process. It creates another state to reconcile. Before choosing a platform, I need to know where the request originates, which system owns each field, who is allowed to update it, and what event advances the work.\n\nThe evidence supported exploration and problem framing. It did not establish that a new integration or application was implemented that day.", "fieldNotes": "The request form and checklist appeared to contain substantially similar information. That suggested the process may include re-entry, submission on another person's behalf, or a handoff between teams that is not represented as a system event.\n\nEach possibility leads to a different design.\n\nIf the issue is re-entry, the strongest pattern is to capture the data once and pass a stable identifier downstream. If the issue is delegated submission, the model needs both the requester and the submitter. If the issue is a review checklist, the checklist should reference the original request rather than duplicate its attributes.\n\nThe buy-versus-build question remains important, but it should follow the boundary analysis. A vendor product may offer mature workflow controls, while an internal solution may fit existing identity and data patterns more closely. Neither option is automatically better if the authoritative record remains ambiguous.\n\nI also need to be careful with the evidence level. The chat documented questions and architectural tension, not a completed design. I am calling this explored work because the useful outcome was a sharper problem definition.", "moved": "- Compared overlapping contract intake artifacts.\n\n- Identified potential manual transcription between systems as a design risk.\n\n- Framed the vendor-versus-internal decision around data ownership and workflow boundaries.\n\n- Distinguished delegated submission, duplicate entry, and review activity as separate requirements.", "pattern": "Map the record before selecting the tool.\n\nFor each field, define the system of record, creator, editor, reviewer, and downstream consumers. Represent handoffs as events. Preserve the original identifier across every step. Generate checklists and views from the authoritative record rather than copying its content.\n\nThe future state is a contract intake event that creates one governed record, routes review tasks, and publishes status without requiring people to transpose the same details between interfaces.", "takeaways": "- Similar forms often reveal duplicate state rather than missing functionality.\n\n- Buy versus build should follow a clear data ownership decision.\n\n- Delegated submission requires explicit identity fields.\n\n- A checklist should validate the source record, not become another source.\n\n- Exploration is valuable when it reduces ambiguity before implementation.", "thread": "The next step is to document the current-state handoffs and determine whether the duplicate artifacts serve distinct control purposes or represent avoidable re-entry."}, "moved": ["Compared overlapping contract intake artifacts.", "Identified potential manual transcription between systems as a design risk.", "Framed the vendor-versus-internal decision around data ownership and workflow boundaries.", "Distinguished delegated submission, duplicate entry, and review activity as separate requirements."], "takeaways": ["Similar forms often reveal duplicate state rather than missing functionality.", "Buy versus build should follow a clear data ownership decision.", "Delegated submission requires explicit identity fields.", "A checklist should validate the source record, not become another source.", "Exploration is valuable when it reduces ambiguity before implementation."], "source": "journal/2026/03/10/2026-03-10.md"}, {"id": "2026-03-06-document-the-data-path-before-you-scale-it", "date": "2026-03-06", "title": "Document the Data Path Before You Scale It", "theme": "A pipeline is a chain of trust", "summary": "A working data pipeline is only reusable when another engineer can explain how it authenticates, where it lands data, and how development differs from reporting.", "prompt": "What's worth remembering about today?", "types": ["win"], "projects": ["dataengineering", "azuredatafactory", "sharepoint", "synapse"], "words": 575, "minutes": 3, "intro": "A working data pipeline is only reusable when another engineer can explain how it authenticates, where it lands data, and how development differs from reporting.\n\nToday I completed a detailed walkthrough of exporting SharePoint list data through Azure Data Factory into a cloud analytics platform. The session was transcribed and covered certificate authentication, access requirements, linked services, project organization, environment naming, data loading, and validation.", "sections": {"theme": "The source begins with SharePoint, but the real architecture includes an application identity, certificate-based authentication, permissions, an Azure Data Factory linked service, environment-specific organization, a target database, and a validation step.\n\nEvery link matters. If the identity lacks permission, the pipeline cannot read. If the certificate is not managed correctly, the connection becomes brittle. If development and reporting assets are mixed, changes become harder to promote and diagnose.\n\nThe walkthrough made those dependencies visible before I applied the pattern to a new project.", "fieldNotes": "The session explicitly covered the standard naming conventions, the source site being connected, and certificate-based connection setup. The presenter explained that project folders are created in Data Factory and that projects are organized using development and reporting folders or schemas.\n\nThat organization is a practical boundary. Development remains the place for active pipeline changes. The reporting layer represents the data shape intended for downstream use. Keeping them separate supports safer iteration and clearer promotion.\n\nThe meeting summary also recorded setup of a service principal, security permissions, linked services, extraction from SharePoint, loading into Synapse, and references to team security practices. The certificate method was selected because access-token use was restricted in the environment.\n\nI did not claim that I built a new production pipeline that day. The evidence supports knowledge transfer, documentation, and preparation for a real project. It also supports that I asked clarifying questions and received a concrete walkthrough of the existing pattern.\n\nA separate file modified that day contained a provider-attribution worksheet export intended for a BI team. Because the file contains sensitive operational data, none of its identifying content belongs in a public journal. Its presence supports that source data was being prepared, but it does not by itself prove a completed integration.", "moved": "- Completed a transcribed walkthrough of the SharePoint-to-Azure Data Factory export pattern.\n\n- Documented certificate-based authentication and required access setup.\n\n- Reviewed linked-service configuration and environment-based naming.\n\n- Learned the development and reporting folder or schema organization used for projects.\n\n- Reviewed the extraction, cloud loading, and validation flow.\n\n- Prepared to apply the pattern to a real project without claiming a production release.", "pattern": "Document the full data contract, not only the pipeline canvas.\n\nRecord the source, identity, authentication method, permission scope, linked service, environment names, target schema, load behavior, validation query, owner, and rotation requirements. Keep sensitive values outside documentation and outside code.\n\nThe future state is a configuration-driven pipeline factory. A project manifest could define the source list, approved identity, target table, schema mapping, and schedule. Automation could provision the linked service, deploy the pipeline, test connectivity, and publish lineage evidence.", "takeaways": "- Authentication and permissions are part of the data architecture.\n\n- Development and reporting layers should remain visibly separate.\n\n- Naming conventions reduce ambiguity during support and promotion.\n\n- A walkthrough is validated knowledge transfer, not a production deployment.\n\n- Public documentation should preserve the pattern while removing operational data.", "thread": "The next step is to apply the documented pattern to a governed project and capture the resulting schema mapping, validation checks, and promotion requirements as reusable configuration."}, "moved": ["Completed a transcribed walkthrough of the SharePoint-to-Azure Data Factory export pattern.", "Documented certificate-based authentication and required access setup.", "Reviewed linked-service configuration and environment-based naming.", "Learned the development and reporting folder or schema organization used for projects.", "Reviewed the extraction, cloud loading, and validation flow.", "Prepared to apply the pattern to a real project without claiming a production release."], "takeaways": ["Authentication and permissions are part of the data architecture.", "Development and reporting layers should remain visibly separate.", "Naming conventions reduce ambiguity during support and promotion.", "A walkthrough is validated knowledge transfer, not a production deployment.", "Public documentation should preserve the pattern while removing operational data."], "source": "journal/2026/03/06/2026-03-06.md"}, {"id": "2026-03-05-configuration-belongs-outside-the-build", "date": "2026-03-05", "title": "Configuration Belongs Outside the Build", "theme": "Make the first execution reveal the real gaps", "summary": "A deployment pipeline becomes fragile when environment-specific settings are embedded in the artifact or reconstructed by memory. The useful work today was separating application configuration from the deployment itself.", "prompt": "What are you trying next?", "types": ["win"], "projects": ["azuredevops", "azure", "pipelines", "configuration", "automation"], "words": 550, "minutes": 2, "intro": "A deployment pipeline becomes fragile when environment-specific settings are embedded in the artifact or reconstructed by memory. The useful work today was separating application configuration from the deployment itself.\n\nI provided guidance for handling application settings and the Azure pipeline path for an application deployment. The first execution remained with the requester, so the work was guidance delivered, not a completed rollout.", "sections": {"theme": "The immediate need was to provide a pattern for application settings and pipeline execution. The work item later recorded that this guidance had been provided and that the next step was to wait for the requester's first run so exceptions could be addressed.\n\nThat is an important boundary. A design can be technically sound and still encounter environment-specific failures during the first execution. Authentication, agent reachability, variable scope, permissions, and target-resource configuration often remain invisible until the pipeline runs in context.\n\nRather than describe the solution as complete, I treated the first run as the next validation event.", "fieldNotes": "Application settings should not be hard-coded into the deployable package. They need to be parameterized by environment and supplied through a controlled configuration path. The exact implementation details were not present in the available evidence, so I am not reconstructing a procedure that the source does not show.\n\nThe source does explicitly show that application-settings handling and pipeline guidance were delivered. It also shows that the project was waiting for the requester to execute the solution and surface any exception issues.\n\nThat status is more useful than a vague statement that the pipeline was in progress. It defines the current state, the next owner, and the trigger for re-engagement.\n\nA good consulting handoff should make that trigger explicit. The requester runs the pipeline. The pipeline produces logs. Any failure is returned with the stage, operation, and error context. The platform contributor then addresses the smallest verified gap rather than continuing to design against assumptions.\n\nThe day also generated automated warehouse warnings and broader organizational updates. Those were not evidence that I fixed or shipped those systems, so they were excluded from the accomplishment record.", "moved": "- Provided application-settings handling guidance for an Azure deployment.\n\n- Provided pipeline guidance for the deployment path.\n\n- Established the requester's first execution as the next validation step.\n\n- Preserved exception handling as follow-up rather than claiming the deployment was complete.\n\n- Distinguished automated notifications from attributable delivery work.", "pattern": "Separate artifact, configuration, and execution evidence.\n\nThe artifact should remain environment-neutral. Configuration should be supplied through approved variables or secret stores. The execution should generate logs that identify the stage, target, version, and failure point. Ownership should shift explicitly at each handoff.\n\nThe future state is a self-validating deployment template. Before making changes, it checks required variables, target accessibility, identity permissions, and configuration completeness. After execution, it publishes a machine-readable result that can trigger the right follow-up automatically.", "takeaways": "- Environment-specific configuration should not be embedded in the build artifact.\n\n- Guidance delivered is different from deployment validated.\n\n- The first real execution is an evaluation event, not a formality.\n\n- Handoffs need an owner and a clear return trigger.\n\n- Automated alerts should not be converted into personal accomplishments.", "thread": "The next step is the requester's first execution, followed by evidence-based remediation of any configuration, permission, or pipeline exception that appears."}, "moved": ["Provided application-settings handling guidance for an Azure deployment.", "Provided pipeline guidance for the deployment path.", "Established the requester's first execution as the next validation step.", "Preserved exception handling as follow-up rather than claiming the deployment was complete.", "Distinguished automated notifications from attributable delivery work."], "takeaways": ["Environment-specific configuration should not be embedded in the build artifact.", "Guidance delivered is different from deployment validated.", "The first real execution is an evaluation event, not a formality.", "Handoffs need an owner and a clear return trigger.", "Automated alerts should not be converted into personal accomplishments."], "source": "journal/2026/03/05/2026-03-05.md"}, {"id": "2026-03-04-deployment-is-a-governance-problem-before-it-is-a-pipeline-problem", "date": "2026-03-04", "title": "Deployment Is a Governance Problem Before It Is a Pipeline Problem", "theme": "A pipeline needs decisions around it", "summary": "Moving an agent from a sandbox into production sounds like a technical handoff. The deeper problem is deciding who owns the path, what evidence is required, and which steps can be automated without weakening review.", "prompt": "What did you learn?", "types": ["win"], "projects": ["platformgovernance", "powerplatform", "copilotstudio", "devops", "governance"], "words": 619, "minutes": 3, "intro": "Moving an agent from a sandbox into production sounds like a technical handoff. The deeper problem is deciding who owns the path, what evidence is required, and which steps can be automated without weakening review.\n\nToday I documented follow-up work from a governance discussion. The strongest throughline was the need to turn agent promotion from an informal sequence into a defined operating model.", "sections": {"theme": "The discussion produced a concrete set of follow-up tasks. A team needed to address the sandbox-to-production process. The promotion path needed visibility with the steering group. The pipeline setup and remaining manual deployment steps needed to be documented for reuse.\n\nThose tasks make the maturity gap clear. A pipeline can move solution components, but it cannot decide whether an agent is ready. Readiness depends on ownership, environment boundaries, policy alignment, review evidence, and a supported rollback path.\n\nI was assigned with another platform contributor to help form the team that would examine the promotion process and report findings. I was also assigned to document the pipeline setup and manual steps. Those were defined actions, not completed deployment work.", "fieldNotes": "The governance notes also recorded that non-production and production Center of Excellence environments had been updated. That provided useful platform context, but the update itself was confirmed by another contributor. I did not claim it as my delivery.\n\nThe more durable contribution was structuring the unresolved work. New environment requests needed routing contacts. Baseline document changes still required review. An agent integration with an external work-management suite was proposed for technical review workflows. These threads all depend on a common control plane.\n\nThe promotion question should not be reduced to exporting a solution and importing it elsewhere. An agent can depend on connectors, environment variables, identities, knowledge sources, channels, policies, and human approvals. If any dependency remains implicit, the deployment is not reproducible.\n\nDocumentation has to capture the manual gaps honestly. A process is not automated because the center of it uses a pipeline. If someone must change a connection reference, grant access, update a channel, or verify a policy after deployment, that action belongs in the release contract.\n\nThe useful design direction is a release manifest. It should declare the source and target environments, solution version, required connectors, identity model, variables, approvals, test evidence, and rollback owner. The pipeline can validate the manifest and stop when a required element is absent.\n\nThe day's evidence supported documented decisions and assigned design work. It did not support saying the agent promotion pipeline was implemented or validated.", "moved": "- Documented the need for a formal sandbox-to-production process for agents.\n\n- Established that the promotion topic required steering-level visibility.\n\n- Assigned a focused team to examine the process and report findings.\n\n- Assigned documentation of pipeline setup and remaining manual deployment steps.\n\n- Connected environment-request routing and baseline review to the larger operating model.", "pattern": "Treat deployment as a governed state transition.\n\nDefine entry criteria for each environment. Store deployment requirements in a versioned manifest. Separate automated promotion from manual approvals. Require evidence for testing, connector policy, identity configuration, and rollback readiness.\n\nThe future state is an idempotent release pipeline that compares desired configuration with the target environment, applies approved changes, records evidence, and refuses promotion when ownership or validation is missing.", "takeaways": "- A pipeline moves artifacts, while governance decides whether they should move.\n\n- Manual deployment steps must be part of the documented release contract.\n\n- Environment routing and ownership should be explicit before promotion begins.\n\n- Agent dependencies extend beyond the solution package.\n\n- Assigned follow-up is not the same as implemented capability.", "thread": "The next step is to map the current promotion process, identify every manual dependency, and define the minimum evidence required before an agent can enter production."}, "moved": ["Documented the need for a formal sandbox-to-production process for agents.", "Established that the promotion topic required steering-level visibility.", "Assigned a focused team to examine the process and report findings.", "Assigned documentation of pipeline setup and remaining manual deployment steps.", "Connected environment-request routing and baseline review to the larger operating model."], "takeaways": ["A pipeline moves artifacts, while governance decides whether they should move.", "Manual deployment steps must be part of the documented release contract.", "Environment routing and ownership should be explicit before promotion begins.", "Agent dependencies extend beyond the solution package.", "Assigned follow-up is not the same as implemented capability."], "source": "journal/2026/03/04/2026-03-04.md"}]};

const STOP=new Set(('a an the and or but if of to in on for with by from as at is are was were be been being it its this that these those not no than then so too very can will would should could may might must do does did done have has had having into over under about after before more most less least each every any all some such own same other only also just both between through during without within when where while what which who whom why how i we you they he she our your their them us me my there here one two three new make makes made becomes become need needs needed use used using work working future rather instead first once still when every keep keeps part across already itself without real right next another becomes something thing things way ways much many often whether because should help helps like start starts given').split(' '));

const REFRAME=/\b(is not|are not|not just|not yet|, not\b|not the|before)\b/i;
function insightData(){
  if(insightData.c)return insightData.c;
  const dates=[...new Set(E.map(e=>e.date))].sort(),days=dates.map(D0);
  let run=1,best=1,bestEnd=dates[0],wrun=1,wbest=1,wEnd=dates[0];
  for(let i=1;i<days.length;i++){
    run=(days[i]-days[i-1])===864e5?run+1:1;if(run>best){best=run;bestEnd=dates[i]}
    const n=new Date(days[i-1]);do{n.setUTCDate(n.getUTCDate()+1)}while(n.getUTCDay()===0||n.getUTCDay()===6);
    wrun=(+days[i]===+n)?wrun+1:1;if(wrun>wbest){wbest=wrun;wEnd=dates[i]}
  }
  const wStart=(()=>{let i=dates.indexOf(wEnd);return dates[i-wbest+1]})();
  const wd=[0,0,0,0,0,0,0];E.forEach(e=>wd[D0(e.date).getUTCDay()]++);
  const months=[...new Set(E.map(e=>e.month))].sort();
  const words={};E.forEach(e=>{const t=(e.takeaways.join(' ')+' '+(e.sections.pattern||'')+' '+e.title+' '+e.theme).toLowerCase().replace(/\bfuture[- ]state\b/g,' ');
    const seen=new Set();(t.match(/[a-z][a-z-]{3,}/g)||[]).forEach(w=>{w=w.replace(/-+$/,'');if(STOP.has(w)||w.length<4)return;words[w]=(words[w]||0)+1;seen.add(w)})});
  const terms=Object.entries(words).sort((a,b)=>b[1]-a[1]).slice(0,24);
  const pairs={};E.forEach(e=>{const p=[...new Set(e.projects)].sort();for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){const k=p[i]+'|'+p[j];pairs[k]=(pairs[k]||0)+1}});
  const topPairs=Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const top=D.projects.slice(0,10).map(p=>({p,by:months.map(m=>E.filter(e=>e.month===m&&e.projects.includes(p.key)).length)}));
  const tmix=months.map(m=>{const c={};E.filter(e=>e.month===m).forEach(e=>e.types.forEach(t=>c[t]=(c[t]||0)+1));return [m,c]});
  const reframes=E.filter(e=>REFRAME.test(e.title));
  return insightData.c={dates,best,bestEnd,wbest,wStart,wEnd,wd,months,terms,topPairs,top,tmix,reframes};
}

  let drop=null;I.top.slice(0,8).forEach(({p,by})=>{for(let i=1;i<by.length;i++){const d=by[i-1]-by[i];if(d>=4&&(!drop||d>drop.d))drop={p,d,from:by[i-1],to:by[i],m1:I.months[i-1],m2:I.months[i]}}});

  const wins=I.tmix.slice().sort((a,b)=>(b[1].win||0)-(a[1].win||0))[0],learn=I.tmix.slice().sort((a,b)=>share(b[1],'learning')-share(a[1],'learning'))[0];
  if(wins&&learn&&wins[0]!==learn[0])out.push(mon(wins[0])+' was your month for wins ('+(wins[1].win||0)+'); '+mon(learn[0])+' leaned hardest toward learning ('+plural(learn[1].learning||0,'learning')+', '+plural(learn[1].win||0,'win')+').');
  if(I.topPairs[0]){const [a,b]=I.topPairs[0][0].split('|');out.push('<b>'+esc(PL[a])+'</b> and <b>'+esc(PL[b])+'</b> show up together more than any other pair ('+I.topPairs[0][1]+' entries).')}
  return out;
}

function mountGraph(){

  const ctx=cv.getContext('2d');const g=S.g;

  const minCount=g.single?1:2;

    nodes.push({kind:'e',key:e.id,label:e.title,e,deg:0,x:0,y:0,vx:0,vy:0});
    links.forEach(p=>{edges.push([idx['e:'+e.id],idx['p:'+p]]);nodes[idx['p:'+p]].deg++;nodes[idx['e:'+e.id]].deg++})});
  const nb=nodes.map(()=>new Set());edges.forEach(([a,b])=>{nb[a].add(b);nb[b].add(a)});
  nodes.forEach(n=>{n.r=n.kind==='p'?3.2+Math.sqrt(n.deg)*2.3:4.6;n.q=n.kind==='p'?3+Math.sqrt(n.deg)*1.7:3.4});

  const ps=nodes.filter(n=>n.kind==='p').sort((a,b)=>b.deg-a.deg);
  ps.forEach((n,i)=>{const a=i*2.399,r=30+Math.sqrt(i)*55;n.x=Math.cos(a)*r;n.y=Math.sin(a)*r});

  nodes.forEach((n,i)=>{if(n.kind==='e'){const l=[...nb[i]];const h=l.length?nodes[l[0]]:{x:0,y:0};n.x=h.x+(rnd()-.5)*80;n.y=h.y+(rnd()-.5)*80}});
  function tick(alpha){

  function size(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';dirty=true}
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const typeColor=()=>({win:css('--ok'),learning:css('--accent'),decision:css('--soft'),experiment:css('--warn'),idea:css('--idea'),blocker:css('--err')});
  const toS=(x,y)=>[(x-cam.x)*cam.k+W/2,(y-cam.y)*cam.k+H/2],toW=(sx,sy)=>[(sx-W/2)/cam.k+cam.x,(sy-H/2)/cam.k+cam.y];
  function color(n,tc){if(n.kind==='p')return css('--ink');if(g.color==='month'){const i=months.indexOf(n.e.month),t=months.length>1?i/(months.length-1):1;
      const dark=css('--bg').toLowerCase()<'#8';return 'hsl('+(200+t*60).toFixed(0)+' 75% '+(dark?(45+t*25):(62-t*30)).toFixed(0)+'%)'}
    return tc[n.e.types[0]]||css('--faint')}
  function draw(){
    dirty=false;const tc=typeColor(),ink=css('--ink'),soft=css('--soft'),line=css('--line'),acc=css('--accent'),bg=css('--canvas');
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    const sel=g.sel?idx['p:'+g.sel]:undefined,focus=hover>=0?hover:sel;
    const q=S.q?terms(S.q):null,qmatch=q?new Set(nodes.map((n,i)=>(n.kind==='e'?q.every(t=>n.e.hay.includes(t)):q.every(t=>n.label.toLowerCase().includes(t)))?i:-1).filter(i=>i>=0)):null;
    const lit=i=>focus===undefined||focus<0?(qmatch?qmatch.has(i):true):(i===focus||nb[focus].has(i));
    ctx.lineWidth=1;
    edges.forEach(([i,j])=>{const on=focus!==undefined&&focus>=0&&(i===focus||j===focus);const [x1,y1]=toS(nodes[i].x,nodes[i].y),[x2,y2]=toS(nodes[j].x,nodes[j].y);
      ctx.globalAlpha=on?.9:(lit(i)&&lit(j)?.35:.06);ctx.strokeStyle=on?acc:line;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()});
    nodes.forEach((n,i)=>{const [x,y]=toS(n.x,n.y),r=Math.max(2.4,n.r*Math.pow(cam.k,.4));if(x<-20||y<-20||x>W+20||y>H+20)return;
      ctx.globalAlpha=lit(i)?1:.12;ctx.fillStyle=color(n,tc);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      if(n.kind==='p'&&n.rank<12){ctx.globalAlpha*=.5;ctx.lineWidth=2;ctx.strokeStyle=ink;ctx.beginPath();ctx.arc(x,y,r+3,0,7);ctx.stroke();ctx.lineWidth=1;ctx.globalAlpha=lit(i)?1:.12}
      if(i===focus){ctx.lineWidth=2;ctx.strokeStyle=ink;ctx.stroke();ctx.lineWidth=1}});
    ctx.textAlign='center';ctx.textBaseline='top';const boxes=[];
    const order=nodes.map((n,i)=>i).sort((a,b)=>(b===focus)-(a===focus)||(nodes[a].kind===nodes[b].kind?(nodes[a].rank??999)-(nodes[b].rank??999):nodes[a].kind==='p'?-1:1));
    order.forEach(i=>{const n=nodes[i];const [x,y]=toS(n.x,n.y),r=Math.max(2.4,n.r*Math.pow(cam.k,.4));
      const show=n.kind==='p'?(n.rank<Math.round(10*cam.k*cam.k+4)||(focus>=0&&lit(i)&&cam.k>.9)||i===focus):(i===focus||(focus>=0&&nb[focus].has(i)&&cam.k>1.7)||cam.k>2.6);
      if(!show||!lit(i))return;const fs=n.kind==='p'?Math.min(15,10+n.deg*.12):11;ctx.font=(n.kind==='p'?'600 ':'')+fs+'px '+css('--font');
      const t=n.label.length>42?n.label.slice(0,40)+'…':n.label;const tw=ctx.measureText(t).width,bx=[x-tw/2-2,y+r+2,x+tw/2+2,y+r+fs+5];
      if(i!==focus&&boxes.some(b=>bx[0]<b[2]&&bx[2]>b[0]&&bx[1]<b[3]&&bx[3]>b[1]))return;boxes.push(bx);ctx.globalAlpha=1;ctx.lineWidth=3;ctx.strokeStyle=bg;ctx.strokeText(t,x,y+r+3);ctx.fillStyle=n.kind==='p'?ink:soft;ctx.fillText(t,x,y+r+3)});
    ctx.globalAlpha=1;
  }
  function loop(){raf=requestAnimationFrame(loop);if(alpha>.005){tick(alpha);alpha*=.95;dirty=true}if(dirty)draw()}
  function pick(sx,sy){const [x,y]=toW(sx,sy);let best=-1,bd=1e9;nodes.forEach((n,i)=>{const d=Math.hypot(n.x-x,n.y-y),r=Math.max(n.r,6/cam.k);if(d<r+3/cam.k&&d<bd){bd=d;best=i}});return best}
  const ptrs=new Map();let pinch=0,moved=0,down=null;
  cv.addEventListener('pointerdown',ev=>{cv.setPointerCapture(ev.pointerId);ptrs.set(ev.pointerId,[ev.offsetX,ev.offsetY]);moved=0;
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);drag=null;return}
    const i=pick(ev.offsetX,ev.offsetY);down={i,x:ev.offsetX,y:ev.offsetY,cx:cam.x,cy:cam.y};if(i>=0){drag=i;nodes[i].fixed=true}});
  cv.addEventListener('pointermove',ev=>{const p=ptrs.get(ev.pointerId);
    if(ptrs.size===2&&p){ptrs.set(ev.pointerId,[ev.offsetX,ev.offsetY]);const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch){cam.k=Math.min(6,Math.max(.15,cam.k*d/pinch));pinch=d;dirty=true}return}
    if(down){moved=Math.max(moved,Math.hypot(ev.offsetX-down.x,ev.offsetY-down.y));
      if(drag!==null&&drag>=0){const [x,y]=toW(ev.offsetX,ev.offsetY);nodes[drag].x=x;nodes[drag].y=y;alpha=Math.max(alpha,.25);dirty=true}
      else{cam.x=down.cx-(ev.offsetX-down.x)/cam.k;cam.y=down.cy-(ev.offsetY-down.y)/cam.k;dirty=true}return}
    const i=pick(ev.offsetX,ev.offsetY);if(i!==hover){hover=i;dirty=true;cv.style.cursor=i>=0?'pointer':'grab';
      if(i>=0){const n=nodes[i];tip.hidden=false;tip.innerHTML=n.kind==='p'?'<b>'+esc(n.label)+'</b><span>'+plural(n.deg,'entry','entries')+'</span>':'<b>'+esc(n.label)+'</b><span>'+esc(fmtLong(n.e.date))+' · '+esc(n.e.types.join(', '))+'</span>';
        const r=stage.getBoundingClientRect();tip.style.left=Math.min(ev.offsetX+14,r.width-tip.offsetWidth-8)+'px';tip.style.top=Math.max(8,ev.offsetY-tip.offsetHeight-10)+'px'}else tip.hidden=true}});
  function up(ev){ptrs.delete(ev.pointerId);if(ptrs.size<2)pinch=0;if(!down)return;
    if(drag!==null&&drag>=0)nodes[drag].fixed=false;
    if(moved<5){const i=down.i;if(i>=0){const n=nodes[i];if(n.kind==='e'){go('e-'+n.key);return}S.g.sel=S.g.sel===n.key?'':n.key}else S.g.sel='';graphSide();dirty=true}
    drag=null;down=null}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{if(!down){hover=-1;tip.hidden=true;dirty=true}});
  cv.addEventListener('wheel',ev=>{ev.preventDefault();const [wx,wy]=toW(ev.offsetX,ev.offsetY);const f=Math.exp(-ev.deltaY*.0015);cam.k=Math.min(6,Math.max(.15,cam.k*f));

  const mo=new MutationObserver(()=>{dirty=true});mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  const mq=matchMedia('(prefers-color-scheme: dark)');const onMq=()=>{dirty=true};mq.addEventListener('change',onMq);
  size();fit();loop();
  const leg=$('#glegend');
  if(leg){leg.innerHTML=g.color==='type'?TYPES.map(t=>'<span><i style="background:'+TYPE_TOKEN[t]+'"></i>'+t+'</span>').join('')+'<span><i class="pdot"></i>project</span>'
    :'<span>'+esc(fmtShort(E[E.length-1].date))+'</span><span class="ramp" aria-hidden="true"></span><span>'+esc(fmtShort(E[0].date))+'</span><span><i class="pdot"></i>project</span>'}
  G={nodes,edges,draw(){dirty=true},fit,focus(k){const i=idx['p:'+k];if(i===undefined)return;cam.x=nodes[i].x;cam.y=nodes[i].y;dirty=true},
     destroy(){cancelAnimationFrame(raf);ro.disconnect();mo.disconnect();mq.removeEventListener('change',onMq)}};
  graphSide();
}

function viewEntry(){
  const e=byId[S.entry];if(!e)return '<div class="empty">That entry was not found.</div>';
  const idx=E.indexOf(e),newer=E[idx-1],older=E[idx+1],s=e.sections;
  const sec=(k,body)=>body?'<h2 id="s-'+k+'">'+esc({fieldNotes:'Field notes from the build',moved:'What moved',takeaways:'Standing takeaways',future:'Future state',insight:'Key insight'}[k])+'</h2>'+body:'';
  const src=D.meta.source_repo?D.meta.source_repo.replace(/\/$/,'')+'/blob/'+encodeURIComponent(D.meta.source_branch||'main')+'/'+e.source.split('/').map(encodeURIComponent).join('/'):'';
  const back=S.from==='entries'?'All entries':{graph:'Graph',patterns:'Patterns',takeaways:'Takeaways',threads:'Open threads',insights:'Insights'}[S.from];
  return '<article class="reader" style="margin-top:28px">'+
    '<div class="crumbs"><a href="#'+S.from+'">← '+esc(back)+'</a><span class="muted num">'+(idx+1)+' of '+E.length+'</span></div>'+
    '<header class="rhead"><div class="meta"><time datetime="'+e.date+'">'+esc(fmtLong(e.date))+'</time>'+typeBadges(e)+'<span>'+e.minutes+' min read · '+nf(e.words)+' words</span></div>'+
    '<h1>'+inline(e.title)+'</h1>'+(e.prompt?'<p class="prompt"><span>Prompt</span>'+esc(e.prompt)+'</p>':'')+'</header>'+
    (e.theme?'<div class="themebox"><div class="k">The theme</div><div class="v">'+inline(e.theme)+'</div></div>':'')+
    '<div class="prose">'+md(e.intro)+md(s.theme||'')+
      sec('fieldNotes',s.fieldNotes?md(s.fieldNotes):'')+
      sec('moved',s.moved?(e.moved.length?md(e.moved.map(x=>'- '+x).join('\n'),{listClass:'moved'}):md(s.moved)):'')+
      (s.pattern?'<div class="callout pattern"><div class="k">The reusable pattern</div>'+md(s.pattern)+'</div>':'')+
      sec('insight',s.insight?md(s.insight):'')+
      sec('future',s.future?md(s.future):'')+
      sec('takeaways',s.takeaways?md(s.takeaways):'')+
      (s.thread?'<div class="callout thread"><div class="k">Open thread</div>'+md(s.thread)+'</div>':'')+
    '</div>'+
    '<footer class="rfoot">'+(e.projects.length?'<div class="chips">'+e.projects.map(p=>'<button class="chip" data-act="go-project" data-k="'+esc(p)+'">'+esc(PL[p]||p)+'</button>').join('')+'</div>':'')+
      (src?'<div class="muted">Source: <a href="'+esc(src)+'" target="_blank" rel="noopener noreferrer">'+esc(e.source)+' ↗</a></div>':'')+
      '<nav class="pager" aria-label="More entries">'+(older?'<a class="prev" href="#e-'+esc(older.id)+'"><small>← Older · '+esc(fmtShort(older.date))+'</small><span>'+esc(older.title)+'</span></a>':'')+
      (newer?'<a class="next" href="#e-'+esc(newer.id)+'"><small>Newer · '+esc(fmtShort(newer.date))+' →</small><span>'+esc(newer.title)+'</span></a>':'')+'</nav></footer></article>';
}

/* ============================== events ============================== */
function wire(root){
  root.querySelectorAll('[data-act]').forEach(el=>{
    const act=el.dataset.act,k=el.dataset.k;
    const ev=el.tagName==='SELECT'?'change':'click';
    el.addEventListener(ev,()=>{
      if(act!=='more')S.limit=30;
      switch(act){
        case 'type':S.types.has(k)?S.types.delete(k):S.types.add(k);break;
        case 'clear-types':S.types.clear();break;
        case 'project':S.project=S.project===k?'':k;break;
        case 'month':S.month=S.month===k?'':k;break;
        case 'allproj':S.showAllProjects=!S.showAllProjects;break;
        case 'sort':S.sort=el.value;break;
        case 'more':S.limit+=30;break;
        case 'rm':if(k==='q'){S.q='';$('#q').value=''}else if(k.startsWith('type:'))S.types.delete(k.slice(5));else S[k]='';break;
        case 'reset':S.q='';$('#q').value='';S.types.clear();S.project='';S.month='';break;
        case 'cproj':S.coll.project=el.value;break;
        case 'go-project':S.types.clear();S.month='';S.project=k;S.coll.project=k;return go('entries');
        case 'go-type':S.project='';S.month='';S.types=new Set([k]);return go('entries');
        case 'go-month':S.project='';S.types.clear();S.month=k;return go('entries');
        case 'search':S.q=k;$('#q').value=k;S.types.clear();S.project='';S.month='';return go('entries');
        case 'g-color':S.g.color=k;break;
        case 'g-single':S.g.single=el.checked;S.g.sel='';break;
        case 'g-fit':if(G){G.fit();G.draw()}return;
      }
      const y=window.scrollY;render();window.scrollTo(0,y);
    });
  });
}
let qt;
$('#q').addEventListener('input',ev=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=ev.target.value.trim();S.limit=30;
  if(S.view==='graph'&&G){G.draw()}else if(S.view==='entry'||S.view==='insights')go('entries');else{render()}},120)});
document.addEventListener('keydown',ev=>{
  if(ev.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){ev.preventDefault();$('#q').focus()}
  else if(ev.key==='Escape'&&document.activeElement===$('#q')){$('#q').value='';S.q='';render();$('#q').blur()}
  else if(S.view==='entry'&&!/input|textarea|select/i.test(document.activeElement.tagName)){
    const e=byId[S.entry],i=E.indexOf(e);if(ev.key==='ArrowLeft'&&E[i+1])go('e-'+E[i+1].id);if(ev.key==='ArrowRight'&&E[i-1])go('e-'+E[i-1].id)}
});

/* theme: system → light → dark (The Daily's data-theme convention) */
const THEMES=['system','light','dark'];
const SVG=p=>'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">'+p+'</svg>';
const TI={system:SVG('<path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM8 3a5 5 0 0 1 0 10Z" fill-rule="evenodd"/>'),
  light:SVG('<circle cx="8" cy="8" r="3.2"/><path d="M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M2.9 13.1l1.4-1.4M11.7 4.3l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>'),
  dark:SVG('<path d="M9.6 1.3a6.6 6.6 0 1 0 5.1 9.4A5.4 5.4 0 0 1 9.6 1.3Z"/>')};
function applyTheme(t,iconOnly){if(!iconOnly){if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
  const b=$('#themeBtn');b.innerHTML=TI[t];b.title='Theme: '+t;b.setAttribute('aria-label','Theme: '+t+'. Select to change.')}
let theme=store.get('theme');if(THEMES.includes(theme))applyTheme(theme);else{theme='system';applyTheme(theme,true)}
$('#themeBtn').addEventListener('click',()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];store.set('theme',theme);applyTheme(theme)});

/* boot: embedded data (built), or entries.json beside the page (dev) */
if(FIELD_GUIDE)init(FIELD_GUIDE);
else fetch('entries.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(init)
  .catch(()=>{$('#app').innerHTML='<div class="empty" style="margin-top:40px">No journal data found. Run <code>python build.py --journal path/to/journal</code> and open <code>dist/index.html</code>.</div>'});
})();
</script>
